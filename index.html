<title>Doku-Fix</title>
<style>
:root{
  --grund:#F2F2F7; --flaeche:#FFFFFF; --schrift:#000000; --schrift2:#6C6C70;
  --linie:#C6C6C8; --tape:#146C99; --tape-auf:#FFFFFF; --norm:rgba(20,108,153,.14);
  --warn:#C4001A; --chip:#E3EEF4;
  --rahmen:#D1D1D6; --seite:#E5E5EA;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --grund:#000000; --flaeche:#1C1C1E; --schrift:#FFFFFF; --schrift2:#AEAEB2;
    --linie:#38383A; --tape:#5BB8E8; --tape-auf:#002A3D; --norm:rgba(91,184,232,.22);
    --warn:#FF6961; --chip:#0D2F40; --rahmen:#3A3A3C; --seite:#111113;
  }
}
:root[data-theme="dark"]{
  --grund:#000000; --flaeche:#1C1C1E; --schrift:#FFFFFF; --schrift2:#AEAEB2;
  --linie:#38383A; --tape:#5BB8E8; --tape-auf:#002A3D; --norm:rgba(91,184,232,.22);
  --warn:#FF6961; --chip:#0D2F40; --rahmen:#3A3A3C; --seite:#111113;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
.zahl{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.kopf{display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:2.125rem;font-weight:700;letter-spacing:.01em;margin:0}
.fortschritt{font-size:.8125rem;color:var(--schrift2)}
.patient{font-size:.9375rem;color:var(--schrift2);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;padding:10px 16px 0}
.chip{background:var(--chip);color:var(--tape);border:0;border-radius:16px;padding:6px 12px;font:inherit;font-size:.9375rem;font-weight:600;cursor:pointer}
.chip-pfeil{color:var(--schrift2);align-self:center;font-size:.875rem}
.frage{font-size:1.25rem;font-weight:600;margin:0 0 4px}
.hinweis{font-size:.8125rem;color:var(--schrift2);margin:0 0 14px}
.raster{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.raster.drei{grid-template-columns:1fr 1fr 1fr}
.raster.vier{grid-template-columns:repeat(4,1fr);gap:8px}
.wahl.klein{min-height:48px;padding:0 6px;justify-content:center;font-size:.9375rem}
.unterfrage{font-weight:600;margin:16px 0 10px}
.hinweis.klein{margin:8px 0 0}
.wahl{min-height:56px;border:0;border-radius:14px;background:var(--flaeche);color:var(--schrift);font:inherit;font-weight:500;
  text-align:left;padding:0 16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.wahl[aria-pressed="true"]{background:var(--tape);color:var(--tape-auf)}
.wahl:focus-visible,.chip:focus-visible,.weiter:focus-visible,.griff:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.weiter{margin-top:14px;width:100%;min-height:50px;border:0;border-radius:14px;background:var(--tape);color:var(--tape-auf);font:inherit;font-weight:600;cursor:pointer}
.weiter:disabled{opacity:.35;cursor:default}
.schritt{animation:rein .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rein{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.flieger{position:fixed;z-index:20;border-radius:14px;background:var(--tape);color:var(--tape-auf);display:flex;align-items:center;
  padding:0 16px;font-weight:600;pointer-events:none;white-space:nowrap;overflow:hidden;
  transition:all .3s cubic-bezier(.3,.7,.2,1)}
/* NAS */
.nas-block{background:var(--flaeche);border-radius:14px;padding:12px 14px 8px;margin-bottom:10px}
.nas-zeile{display:flex;justify-content:space-between;align-items:baseline}
.nas-titel{font-weight:600}
.nas-wert{font-size:2.75rem;font-weight:600;line-height:1}
.nas-wert small{font-size:1rem;color:var(--schrift2);font-weight:500;margin-left:4px;font-family:-apple-system,system-ui,sans-serif}
input[type=range]{width:100%;accent-color:var(--tape);height:44px}
.skala{display:flex;justify-content:space-between;font-size:.8125rem;color:var(--schrift2)}
.segment{display:flex;background:var(--linie);border-radius:10px;padding:2px;margin-top:18px}
.segment button{flex:1;min-height:40px;border:0;background:transparent;border-radius:8px;font:inherit;font-size:.9375rem;color:var(--schrift);cursor:pointer}
.segment button[aria-pressed="true"]{background:var(--flaeche);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.segment.oben{margin:4px 0 10px}
.schnell-zeile{display:grid;grid-template-columns:1fr auto;grid-template-areas:"r r" "s k";gap:6px 8px;padding:10px 0 4px;border-top:1px solid var(--linie);margin-top:8px}
.schnell-zeile:first-of-type{border-top:0}
.richtung{grid-area:r;font-size:.9375rem;color:var(--schrift2)}
.auswahl{grid-area:s;min-height:44px;border:0;border-radius:10px;background:var(--grund);color:var(--schrift);font:inherit;padding:0 12px;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--schrift2) 50%),linear-gradient(135deg,var(--schrift2) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.schmerz-knopf{grid-area:k;min-height:44px;border:1.5px solid var(--linie);border-radius:10px;background:transparent;color:var(--schrift);font:inherit;font-size:.9375rem;padding:0 12px;cursor:pointer;white-space:nowrap}
.schmerz-knopf[aria-pressed="true"]{background:var(--tape);border-color:var(--tape);color:var(--tape-auf);font-weight:600}
.auswahl:focus-visible,.schmerz-knopf:focus-visible,.segment button:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
/* Schiene */
.bew{background:var(--flaeche);border-radius:14px;padding:12px 14px 10px;margin-bottom:10px}
.bew-name{font-size:.9375rem;font-weight:600}
.schiene{position:relative;height:56px;margin:4px 6px 0;touch-action:none;cursor:pointer}
.spur{position:absolute;left:0;right:0;top:22px;height:4px;border-radius:2px;background:var(--linie)}
.normband{position:absolute;top:12px;height:24px;background:var(--norm);border-radius:4px}
.fuell{position:absolute;top:22px;height:4px;background:var(--tape);border-radius:2px}
.strich{position:absolute;top:30px;width:1px;height:6px;background:var(--schrift2);opacity:.6}
.strich.lang{height:10px;opacity:1}
.strich.null{top:14px;height:22px;width:2px;background:var(--schrift);opacity:1}
.griff{position:absolute;top:10px;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:var(--flaeche);
  border:3px solid var(--tape);box-shadow:0 1px 4px rgba(0,0,0,.2);touch-action:none}
.nnm{display:flex;justify-content:space-between;align-items:baseline;font-size:.8125rem;color:var(--schrift2);gap:8px}
.nnm b{color:var(--schrift);font-size:1.0625rem}
/* Textblatt */
.blatt-kopf{display:flex;justify-content:space-between;align-items:center;min-height:30px;border:0;background:none;width:100%;font:inherit;color:var(--schrift);padding:0;cursor:pointer}
.blatt-kopf span:last-child{color:var(--schrift2);font-size:.8125rem}
.doku{font-size:.9375rem;line-height:1.5;margin:8px 0 12px;white-space:pre-wrap}
.kopieren{min-height:44px;border:0;border-radius:12px;background:var(--tape);color:var(--tape-auf);font:inherit;font-weight:600;padding:0 18px;cursor:pointer}
nav button{border:0;background:none;font:inherit;font-size:.6875rem;color:var(--schrift2);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:72px}
nav button[aria-current="page"]{color:var(--tape)}
nav svg{width:26px;height:26px}
@media (prefers-reduced-motion: reduce){.schritt{animation:none}.flieger{transition:opacity .15s}.blatt{transition:none}}
/* Layout der App */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--grund);color:var(--schrift);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  font-size:1.0625rem;line-height:1.35;-webkit-text-size-adjust:100%}
#root{height:100%}
.app{height:100dvh;display:flex;flex-direction:column;max-width:1200px;margin:0 auto;position:relative}
.inhalt{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.links{flex:1;min-height:0;display:flex;flex-direction:column}
header{padding:calc(env(safe-area-inset-top) + 14px) 16px 4px}
.chips{min-height:44px;align-items:center}
main{flex:1;overflow-y:auto;padding:8px 16px 24px;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
main>.schritt{margin-top:0}
main.oben>.schritt{margin-top:0}
.rechts{display:none}
.rechts-inner{padding:16px}
.blatt{position:relative;background:var(--flaeche);border-radius:14px 14px 0 0;box-shadow:0 -1px 0 var(--linie);padding:6px 16px 10px;
  max-height:52px;overflow:hidden;transition:max-height .3s ease;flex:none}
.blatt.offen{max-height:62dvh;overflow-y:auto}
.blatt-kopf{min-height:40px}
nav{display:flex;justify-content:space-around;padding:8px 0 calc(env(safe-area-inset-bottom) + 6px);background:var(--flaeche);border-top:1px solid var(--linie);flex:none}
@media (min-width:900px){
  .inhalt{display:grid;grid-template-columns:minmax(0,1fr) 400px}
  .blatt{display:none}
  .rechts{display:block;border-left:1px solid var(--linie);background:var(--flaeche);overflow-y:auto}
  .rechts h2{font-size:1.375rem;margin:0 0 8px}
  main{padding-bottom:40px}
}
@media (min-width:600px) and (max-width:899px){
  main,header,.chips{padding-left:max(16px,calc(50% - 280px));padding-right:max(16px,calc(50% - 280px))}
}
.doku{font-size:.9375rem;line-height:1.5;margin:8px 0 12px;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.doku.leer{color:var(--schrift2)}
.zeile-kopf{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sekundaer{min-height:44px;border:1.5px solid var(--linie);border-radius:12px;background:transparent;color:var(--schrift);font:inherit;font-weight:500;padding:0 16px;cursor:pointer}
.sekundaer:focus-visible,.eingabe:focus-visible,.kleinknopf:focus-visible,summary:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.knopfreihe{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.knopfreihe .weiter{margin-top:0;flex:1;min-width:140px}
.eingabe{width:100%;min-height:50px;border:0;border-radius:14px;background:var(--flaeche);color:var(--schrift);font:inherit;padding:12px 16px;resize:none}
.eingabe::placeholder{color:var(--schrift2)}
.zahl-groß{font-size:2.25rem;font-weight:600;line-height:1}
.dauer{background:var(--flaeche);border-radius:14px;padding:12px 14px 4px;margin-bottom:10px}
.dauer-text{font-size:1rem;color:var(--tape);font-weight:600;min-height:1.4em;margin:2px 0 10px}
.nas-wert.leer{color:var(--schrift2)}
.sek{font-size:.8125rem;color:var(--schrift2)}
.fehler{color:var(--warn);font-size:.9375rem;margin:8px 0 0}
.hinweis-box{background:var(--chip);color:var(--schrift);border-radius:12px;padding:10px 12px;font-size:.875rem;margin:10px 0 0}
.hinweis-box.warn{border-left:4px solid var(--warn)}
.stelle-liste{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.stelle-zeile{display:flex;justify-content:space-between;align-items:center;background:var(--flaeche);border-radius:12px;padding:6px 6px 6px 14px;min-height:46px}
.kleinknopf{border:0;background:none;color:var(--tape);font:inherit;font-size:.9375rem;min-height:40px;padding:0 10px;cursor:pointer}
.kleinknopf.rot{color:var(--warn)}
.chip[aria-current="step"]{background:var(--tape);color:var(--tape-auf)}
.gruppe{margin:14px 0 6px;font-size:.8125rem;color:var(--schrift2);font-weight:600}
.liste{display:flex;flex-direction:column;gap:8px}
.zeile{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--flaeche);border-radius:14px;padding:10px 14px;text-align:left;border:0;color:var(--schrift);font:inherit;width:100%;cursor:pointer;min-height:56px}
.zeile[aria-pressed="true"]{background:var(--tape);color:var(--tape-auf)}
.zeile .titel{font-weight:500}
.zeile .nebenher{grid-column:1;font-size:.8125rem;opacity:.75}
.zeile .haken{grid-row:1 / span 2;grid-column:2}
.badge{display:inline-block;font-size:.75rem;font-weight:600;border-radius:8px;padding:2px 7px;margin-left:8px;background:var(--chip);color:var(--tape);vertical-align:1px}
.zeile[aria-pressed="true"] .badge{background:rgba(255,255,255,.22);color:inherit}
.ziele{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.ziele::-webkit-scrollbar{display:none}
.ziele .chip{flex:none;min-height:36px;background:var(--flaeche);color:var(--schrift)}
.ziele .chip[aria-pressed="true"]{background:var(--tape);color:var(--tape-auf)}
.karte{background:var(--flaeche);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.karte h3{font-size:1rem;margin:0 0 8px}
.mini-raster{display:flex;flex-wrap:wrap;gap:8px}
.mini{min-height:44px;border:1.5px solid var(--linie);border-radius:12px;background:transparent;color:var(--schrift);font:inherit;font-size:.9375rem;padding:0 12px;cursor:pointer}
.mini[aria-pressed="true"]{background:var(--tape);border-color:var(--tape);color:var(--tape-auf);font-weight:600}
.mini:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
details.info{margin-top:8px;font-size:.8125rem;color:var(--schrift2)}
details.info summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
details.info p{margin:4px 0}
.leerer-zustand{padding:32px 0;text-align:left}
.tab-titel{font-size:2.125rem;font-weight:700;margin:0}
.norm-info{font-size:.8125rem;color:var(--schrift2);margin-top:2px}
.unsicher{color:var(--schrift2)}
.pt-zeile{display:grid;grid-template-columns:1fr auto;align-items:center;background:var(--flaeche);border-radius:14px;margin-bottom:8px;overflow:hidden}
.pt-zeile .haupt{border:0;background:none;color:var(--schrift);font:inherit;text-align:left;padding:12px 14px;cursor:pointer;min-height:56px}
.pt-zeile[aria-current="true"]{outline:2px solid var(--tape)}
.pt-name{font-weight:600}
.dosis{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.bew .bew-kopf{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.schiene-namen{display:flex;justify-content:space-between;font-size:.8125rem;color:var(--schrift2);margin:6px 6px 0}
.schiene-zahlen{position:relative;height:16px;margin:0 6px;font-size:.6875rem;color:var(--schrift2)}
.schiene-zahlen span{position:absolute;transform:translateX(-50%)}
.griff{cursor:grab}
.griff:active{cursor:grabbing}
@media (prefers-reduced-motion: reduce){.blatt{transition:none}}
/* kompakter Kopf */
h1{font-size:2.25rem;line-height:1.1}
.frage{font-size:1.5rem;line-height:1.2;margin-bottom:6px}
@media (min-width:600px){h1{font-size:2.75rem}.frage{font-size:1.75rem}}
.patient-zeile{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:32px}
.patient{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.patient-zeile .kleinknopf{flex:none;padding:0 0 0 10px}
.chips{flex-wrap:nowrap;overflow-x:auto;padding:6px 16px;min-height:46px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip,.chip-pfeil{flex:none;white-space:nowrap}
.regler-zeile{display:grid;grid-template-columns:64px 1fr 44px;align-items:center;gap:8px;background:var(--flaeche);border-radius:14px;padding:0 14px;margin-bottom:8px;min-height:56px}
.regler-zeile input[type=range]{height:44px}
.regler-wert{font-size:1.5rem;font-weight:600;text-align:right}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:stretch;margin-top:4px}
.stepper button{min-height:60px;border:0;border-radius:14px;background:var(--flaeche);color:var(--tape);font:inherit;font-size:1.75rem;font-weight:500;cursor:pointer}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper button:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.stepper-wert{display:flex;align-items:baseline;justify-content:center;gap:8px;background:var(--flaeche);border-radius:14px;font-size:2.25rem;font-weight:600}
.stepper-wert{align-items:center}
.stepper-wert small{font-size:1rem;color:var(--schrift2);font-weight:500;font-family:-apple-system,system-ui,sans-serif}
.segment.oben button{min-height:44px}
.stepper.klein{grid-template-columns:52px 1fr 52px;margin-top:0}
.stepper.klein button{min-height:44px;font-size:1.375rem;border-radius:12px}
.stepper.klein .stepper-wert{font-size:1.5rem;border-radius:12px}
.vorschlag{margin-bottom:18px}
.vorschlag .wahl{background:var(--chip);color:var(--tape);font-weight:600}
/* Drehrad */
.rad{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;background:var(--flaeche);border-radius:14px;padding:0 10px;overflow:hidden;height:132px}
.rad-band{position:absolute;left:8px;right:8px;top:44px;height:44px;border-radius:10px;background:var(--grund);pointer-events:none}
.rad-spalte-wrap{position:relative;z-index:1;height:132px;flex:none}
.rad-spalte{height:132px;overflow-y:auto;scroll-snap-type:y mandatory;scroll-padding-block:44px;scrollbar-width:none;overscroll-behavior:contain;padding-block:44px;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent);
  outline:none}
.rad-spalte::-webkit-scrollbar{display:none}
.rad-spalte:focus-visible{outline:3px solid var(--tape);outline-offset:-3px;border-radius:10px}
.rad-zeile{height:44px;display:flex;align-items:center;justify-content:center;scroll-snap-align:start;font-size:1.375rem;font-variant-numeric:tabular-nums;
  cursor:pointer;user-select:none;-webkit-user-select:none;will-change:transform,opacity}
.rad-und,.rad-klein{position:relative;z-index:1;color:var(--schrift2);font-size:.9375rem;flex:none}
.rad-und{margin:0 6px}
.rad-klein{width:62px}
.geraet h3{margin:0 0 10px}
.geraet-felder{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.geraet-feld{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:1rem}
.geraet-eingabe{display:flex;align-items:center;gap:8px}
.geraet-eingabe input{width:92px;min-height:44px;border:0;border-radius:12px;padding:0 10px;font:inherit;text-align:right;background:var(--grund);color:var(--schrift)}
.geraet-eingabe em{font-style:normal;color:var(--schrift2);min-width:42px}
.chip .zaehler{display:inline-block;margin-left:6px;min-width:20px;padding:0 6px;border-radius:10px;background:var(--tape);color:var(--tape-auf);font-size:.75rem;line-height:20px;text-align:center}
.chip[aria-pressed="true"] .zaehler{background:var(--tape-auf);color:var(--tape)}
.kgg-editor{background:var(--flaeche);border-radius:14px;margin:6px 0 4px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.kgg-editor .gruppe{margin:4px 0 6px}
.kgg-felder{display:flex;flex-direction:column;gap:12px}
.kgg-feld{display:flex;flex-direction:column;gap:8px}
.kgg-text{display:flex;flex-direction:column;gap:4px;font-size:.9375rem;color:var(--schrift2)}
.kgg-text .eingabe{background:var(--grund);min-height:44px;padding:8px 12px}
.kgg-editor .geraet-eingabe input{background:var(--grund)}
nav button{min-width:0;flex:1}
.ziele.kgg-kat{flex-wrap:wrap;overflow:visible}
.haken-zeile{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;background:var(--flaeche);border-radius:14px;cursor:pointer;min-height:50px}
.haken-zeile input{width:22px;height:22px;accent-color:var(--tape);flex:none}
.wahl{padding-block:10px}
.v-kopf{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.v-kopf .zahl{color:var(--schrift2);font-size:.875rem}
.vergleich{display:flex;flex-direction:column;gap:2px;background:var(--flaeche);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:.9375rem}
.vergleich b{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--schrift2)}
details.aufklapp{margin-top:12px;background:var(--flaeche);border:1px solid var(--rahmen);border-radius:12px;padding:0 14px}
details.aufklapp>summary{list-style:none;cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600}
details.aufklapp>summary::-webkit-details-marker{display:none}
details.aufklapp>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--schrift2);border-bottom:2px solid var(--schrift2);transform:rotate(45deg);margin:-4px 2px 0 6px;flex:none;transition:transform .2s}
details.aufklapp[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
details.aufklapp>summary .zaehler{margin-left:auto;font-weight:500;font-size:.8125rem;color:var(--tape)}
details.aufklapp>.inhalt{padding:0 0 14px}
details.aufklapp.ohne-pfeil>summary::after{display:none}
details.aufklapp[open]>.inhalt{animation:aufgehen .26s cubic-bezier(.2,.8,.2,1)}
@keyframes aufgehen{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){details.aufklapp>summary::after{transition:none}details.aufklapp[open]>.inhalt{animation:none}}
details.aufklapp .eingabe{background:var(--grund)}
/* Wissensbasis */
.kb-wahl{margin-top:14px}
.kb-wahl .mini{text-align:left;padding:8px 12px;line-height:1.3}
.kb-karte{margin:10px 0 0}
.kb-karte>p{margin:6px 0;font-size:.9375rem;line-height:1.4}
.kb-karte details.aufklapp{background:var(--grund)}
.kb-meta{font-size:.8125rem;color:var(--schrift2);margin:4px 0 8px}
.kb-abschnitt h4{font-size:.9375rem;margin:12px 0 4px}
.kb-abschnitt p,.kb-abschnitt li{font-size:.9375rem;line-height:1.4;margin:4px 0}
.kb-abschnitt ul,.kb-quellen{margin:4px 0;padding-left:20px}
.kb-quellen li{font-size:.8125rem;margin:6px 0;line-height:1.35}
.kb-status{display:block;color:var(--schrift2)}
.kb-status.warn{color:var(--warn)}
.kb-hinweis{margin-top:16px}

/* Dropdown mit Mehrfachauswahl */
details.dropdown{margin-top:12px;background:var(--flaeche);border-radius:14px}
details.dropdown>summary{list-style:none;cursor:pointer;min-height:56px;padding:8px 14px;display:grid;grid-template-columns:1fr auto;column-gap:10px;align-items:center;border-radius:14px}
details.dropdown>summary::-webkit-details-marker{display:none}
details.dropdown>summary::after{content:"";grid-row:1 / span 2;grid-column:2;width:8px;height:8px;border-right:2px solid var(--schrift2);border-bottom:2px solid var(--schrift2);transform:rotate(45deg);margin-right:4px;transition:transform .2s}
details.dropdown[open]>summary::after{transform:rotate(-135deg)}
details.dropdown>summary:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.dd-titel{font-size:.8125rem;color:var(--schrift2)}
.dd-wert{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-wert.leer{font-weight:400;color:var(--schrift2)}
.dd-liste{border-top:1px solid var(--rahmen);max-height:min(50vh,22rem);overflow-y:auto}
.dd-zeile{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;padding:0 14px;background:transparent;border:0;border-bottom:1px solid var(--rahmen);color:var(--schrift);font:inherit;text-align:left;cursor:pointer}
.dd-zeile:last-child{border-bottom:0}
.dd-zeile[aria-checked="true"]{font-weight:600;color:var(--tape)}
.dd-zeile:focus-visible{outline:3px solid var(--tape);outline-offset:-3px}
.dd-haken{width:1.25rem;text-align:center}
.eingabe-zeile{display:flex;gap:8px;align-items:stretch;margin:8px 0}
.eingabe-zeile .eingabe{flex:1}
.eingabe-zeile .sekundaer{flex:none;margin:0}
@media (prefers-reduced-motion:reduce){details.dropdown>summary::after{transition:none}}

/* Funktionstests: Zeile mit Info und Auswahl */
.test{background:var(--flaeche);border:1px solid var(--rahmen);border-radius:12px;margin-top:8px;padding:0 0 0 0}
details.aufklapp .test{background:var(--grund)}
.test.an{border-color:var(--tape)}
.test-kopf{display:flex;align-items:stretch}
.test-info{flex:1;min-width:0;min-height:56px;padding:8px 12px 8px 14px;background:transparent;border:0;color:var(--schrift);font:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:2px}
.test-info .titel{font-weight:600}
.test-info .nebenher{font-size:.8125rem;color:var(--schrift2)}
.test-info:focus-visible,.test-wahl:focus-visible{outline:3px solid var(--tape);outline-offset:-3px}
.test-wahl{flex:none;width:56px;background:transparent;border:0;border-left:1px solid var(--rahmen);cursor:pointer;display:flex;align-items:center;justify-content:center}
.test-wahl span{width:28px;height:28px;border-radius:50%;border:2px solid var(--linie);display:flex;align-items:center;justify-content:center;font-weight:700;line-height:1}
.test-wahl[aria-pressed="true"] span{background:var(--tape);border-color:var(--tape);color:var(--tape-auf)}
.test-text{padding:0 14px 12px;font-size:.9375rem}
.test-text p{margin:6px 0}
.test>.eingabe{width:calc(100% - 24px);margin:8px 12px 12px}

.block-titel{margin:18px 0 0;padding-bottom:4px;font-size:.9375rem;font-weight:700;border-bottom:2px solid var(--tape)}
.normbox{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:.875rem;font-weight:400}
.normbox-titel{margin:0 0 4px;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--schrift2)}
.normbox-zeile{margin:4px 0;line-height:1.4}
.normbox-durch{margin-top:8px}
.normbox-durch summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--tape)}
.normbox-durch p{margin:2px 0 6px;line-height:1.4}
.normbox .hinweis{margin:6px 0 0}
.wz{margin:0}
.wz-zeile{display:grid;grid-template-columns:7.5rem 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--rahmen);font-size:.9375rem}
.wz-zeile:last-child{border-bottom:0}
.wz-zeile dt{font-weight:600;color:var(--schrift2)}
.wz-zeile dd{margin:0;line-height:1.4}
.wz-pruef{margin:8px 0 12px}
.wz-pruef-titel{display:block;margin-bottom:6px;font-size:.875rem;font-weight:600}
.warnbox{margin:10px 0 14px;padding:10px 12px;border-radius:10px;background:var(--chip);border-left:4px solid var(--tape);font-size:.9375rem;line-height:1.4}
/* Seitenwechsel: die linke Spalte schiebt sich von rechts herein, wie ein neuer Bildschirm. */
.links.wechsel{animation:seite .38s cubic-bezier(.2,.8,.2,1)}
.links.wechsel .schritt{animation:none}
@keyframes seite{from{opacity:0;transform:translateX(56px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.links.wechsel{animation:none}}
details.aufklapp .wahl:not([aria-pressed="true"]){background:var(--grund)}
.fenster{margin:12px 0;background:var(--flaeche);border:1px solid var(--rahmen);border-radius:12px;padding:4px 14px 14px}
.fenster-titel{font-weight:600;min-height:44px;display:flex;align-items:center;justify-content:space-between;margin:0}
.fenster-titel .zaehler{font-weight:500;font-size:.8125rem;color:var(--tape)}
.fenster .wahl:not([aria-pressed="true"]){background:var(--grund)}
.fenster .frage{font-size:1.0625rem;font-weight:600}
/* Körperschema im Schritt "Welcher Bereich ist betroffen?" */
:root{--ks-koerper:#D5DAE3;--ks-kante:#B4BCC9;--ks-vor:#D97706;--ks-vor-weich:rgba(217,119,6,.28)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ks-koerper:#3B3F48;--ks-kante:#5A606C;--ks-vor:#FF9F0A;--ks-vor-weich:rgba(255,159,10,.3)}}
:root[data-theme="dark"]{--ks-koerper:#3B3F48;--ks-kante:#5A606C;--ks-vor:#FF9F0A;--ks-vor-weich:rgba(255,159,10,.3)}
.schritt.ks-schritt{container-type:inline-size}
.ks-zwei{display:grid;gap:14px}
.ks-links{display:contents}
.ks-links>.weiter{order:2;margin-top:0}
.ks{order:1}
@container (min-width:600px){
  .ks-zwei{grid-template-columns:minmax(0,1fr) minmax(240px,290px);align-items:start;gap:20px}
  .ks-links{display:block;min-width:0}
  .ks-links>.weiter{margin-top:14px}
  .ks{position:sticky;top:0}
}
.ks{background:var(--flaeche);border-radius:14px;padding:12px;display:grid;gap:10px}
.ks .segment.ks-seg{margin:0}
.ks-punktmarke{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ks-vor);margin-left:6px;vertical-align:middle}
.ks-figur{position:relative;width:100%;max-width:230px;margin:0 auto;aspect-ratio:300/630}
.ks-figur svg{position:absolute;inset:0;width:100%;height:100%}
.ks-k{fill:var(--ks-koerper)}
.ks-l{fill:none;stroke:var(--ks-koerper);stroke-linecap:round}
.ks-d{fill:none;stroke:var(--ks-kante);stroke-width:2;stroke-linecap:round}
.ks-zeh{fill:var(--ks-koerper);stroke:var(--flaeche);stroke-width:1.2}
.ks-nabel{fill:var(--ks-kante)}
.ks-ws{stroke:var(--ks-kante);stroke-width:3;stroke-dasharray:1 7;stroke-linecap:round;fill:none}

.ks-o{position:absolute;top:0;font-size:.75rem;font-weight:700;color:var(--schrift2);background:var(--grund);border-radius:6px;padding:2px 7px}
.ks-o-l{left:0}.ks-o-r{right:0}
.ks-punkt{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border:0;padding:0;background:transparent;border-radius:50%;display:grid;place-items:center;cursor:pointer;z-index:2}
.ks-punkt::before{content:"";width:13px;height:13px;border-radius:50%;background:var(--flaeche);border:2px solid var(--tape);transition:transform .18s,background .18s,box-shadow .18s}
.ks-punkt:hover::before{transform:scale(1.25)}
.ks-punkt[aria-pressed="true"]::before{background:var(--tape);box-shadow:0 0 0 5px var(--norm)}
.ks-punkt.vor::before{background:var(--ks-vor);border-color:var(--ks-vor);animation:ks-puls 1.6s ease-out infinite}
.ks-punkt.akt::before{transform:scale(1.3)}
.ks-punkt:focus-visible{outline:3px solid var(--tape);outline-offset:0}
@keyframes ks-puls{0%{box-shadow:0 0 0 0 var(--ks-vor-weich)}70%,100%{box-shadow:0 0 0 11px transparent}}
.ks-pill{position:absolute;z-index:3;transform:translate(-50%,calc(-100% - 15px));background:var(--schrift);color:var(--grund);font-size:.8125rem;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap;pointer-events:none;animation:ks-rein .2s ease-out}
@keyframes ks-rein{from{opacity:0}to{opacity:1}}
.ks-ws-knopf{justify-self:center;border:1.5px solid var(--linie);background:transparent;color:var(--schrift);border-radius:999px;padding:7px 14px;font:inherit;font-size:.9375rem;font-weight:500;cursor:pointer}
.ks-ws-knopf.vor{border-color:var(--ks-vor)}
.ks-ws-knopf[aria-pressed="true"]{background:var(--tape);border-color:var(--tape);color:var(--tape-auf);font-weight:600}
.ks-unter{margin:0;text-align:center;font-size:.75rem;color:var(--schrift2)}
.ks-legende{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;margin:0;font-size:.8125rem;color:var(--schrift2)}
.ks-legende span{display:inline-flex;align-items:center;gap:6px}

.ks-legende i.v{background:var(--ks-vor)}
@media (prefers-reduced-motion:reduce){.ks-punkt::before,.ks-pill{animation:none!important;transition:none!important}}

/* Fläche "Weiteren Bereich hinzufügen" */
details.flaeche-auf{margin:4px 0 12px}
details.flaeche-auf>summary{list-style:none;cursor:pointer;min-height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-radius:14px;background:var(--flaeche);color:var(--tape);font-weight:600}
details.flaeche-auf>summary::-webkit-details-marker{display:none}
details.flaeche-auf>summary:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.fa-plus{position:relative;width:26px;height:26px;border-radius:50%;background:var(--chip);flex:none;transition:transform .2s}
.fa-plus::before,.fa-plus::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:2px;margin:-1px 0 0 -6px;border-radius:1px;background:var(--tape)}

@media (prefers-reduced-motion:reduce){.fa-plus,.fa-inhalt{transition:none;animation:none}}
/* Körperschema, Zonen und Schmerzverlauf */
:root{--ks-strich:#D92D20}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ks-strich:#FF6B5E}}
:root[data-theme="dark"]{--ks-strich:#FF6B5E}
.ks-figur{max-width:250px}
.ks-figur svg{touch-action:manipulation}
.ks-koerper>*{fill:var(--ks-koerper)}

.ks-figur:not(.ks-zeichnen) .ks-zone:hover{fill:var(--tape);fill-opacity:.25}
.ks-zone.sel,.ks-figur:not(.ks-zeichnen) .ks-zone.sel:hover{fill:var(--tape);fill-opacity:.8}
.ks-zone.vor{fill:var(--ks-vor);fill-opacity:.55;animation:ks-blink 1.4s ease-in-out infinite alternate}
@keyframes ks-blink{from{fill-opacity:.3}to{fill-opacity:.75}}
.ks-hit{fill:transparent;stroke:none;cursor:pointer}
.ks-zone:focus{outline:none}
.ks-figur.ks-zeichnen svg{touch-action:none;cursor:crosshair}
.ks-figur.ks-zeichnen{outline:2px dashed var(--ks-strich);outline-offset:6px;border-radius:12px}
.ks-strich{fill:none;stroke:var(--ks-strich);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;opacity:.92}
.ks-marke{fill:var(--ks-strich)}
.ks-verlauf-knopf{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:1.5px solid var(--ks-strich);background:transparent;color:var(--ks-strich);border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.ks-verlauf-knopf svg{width:22px;height:22px}
.ks-verlauf-knopf:focus-visible,.ks-klein:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.ks-zeichen-leiste{display:grid;gap:8px}
.ks-knoepfe{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.ks-klein{min-height:44px;border:0;border-radius:10px;background:var(--grund);color:var(--schrift);font:inherit;font-size:.875rem;font-weight:600;cursor:pointer;padding:0 6px}

.ks-klein.voll{background:var(--tape);color:var(--tape-auf)}
.ks-klein:disabled{opacity:.4;cursor:default}
.ks-verlauf-text{margin:0;padding:8px 10px;border-radius:10px;background:var(--grund);font-size:.875rem;line-height:1.4}
.ks-legende i.s{width:16px;height:4px;border-radius:2px;background:var(--ks-strich)}
@media (prefers-reduced-motion:reduce){.ks-zone{animation:none!important;transition:none}}

details.massn-kachel{margin:12px 0 0}

.sk-inhalt{padding:2px 2px 6px}
.sk-inhalt .unterfrage:first-child{margin-top:8px}

.sb-vorschlag{margin-bottom:0}

.sn-nr.fertig,.sn-zeile.spaeter .sn-nr.fertig{background:var(--tape);color:var(--tape-auf);border:0}

.richtung{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

/* Orthopädische Tests als Kachel */
details.ot-kachel{margin:0 0 12px}
.ot-inhalt{display:grid;gap:4px}
.ot-folge{margin:6px 2px 6px}
.ot-gruppe{background:var(--flaeche);border-radius:14px;padding:10px 12px 12px;margin-top:8px;animation:ot-rein .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes ot-rein{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.ot-titel{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-weight:600}
.ot-nr{flex:none;width:24px;height:24px;border-radius:50%;background:var(--chip);color:var(--tape);display:grid;place-items:center;font-size:.8125rem;font-weight:700}
.ot-gruppe .hinweis.klein{margin-top:10px}

/* Jahr zur Nebendiagnose */
.nj-reihe{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.nj-hinter{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;animation:nj-dim .2s ease-out}
.nj-blatt{width:min(520px,100%);max-height:min(70dvh,560px);display:flex;flex-direction:column;background:var(--grund);border-radius:18px 18px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 14px);animation:nj-hoch .28s cubic-bezier(.2,.8,.2,1)}

.nj-kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.nj-titel{margin:0;font-size:1.125rem;font-weight:600}
.nj-raster{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;overflow-y:auto;padding:2px}
.nj-jahr{min-height:46px;border:0;border-radius:12px;background:var(--flaeche);color:var(--schrift);font-size:1rem;font-weight:500;cursor:pointer}

.nas-range{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer}

.nas-range::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--nf);border:3px solid var(--flaeche);box-shadow:0 1px 5px rgba(0,0,0,.3);margin-top:-10px;transition:background .12s,transform .12s}
.nas-range::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--nf);border:3px solid var(--flaeche);box-shadow:0 1px 5px rgba(0,0,0,.3);transition:background .12s}

.nas-wert{transition:color .12s}
/* Jahr als Drehrad */
.nj-rad{position:relative;height:220px;background:var(--flaeche);border-radius:14px;overflow:hidden}

.nj-rad .nj-jahr.nah{opacity:.75}
.nj-rad .nj-jahr.an{opacity:1;color:var(--tape);font-size:1.5rem;font-weight:700;background:transparent}

details.sb-auf{margin:0}

.sw-wert{font-size:1.75rem}

.sw-skala span{flex:1;text-align:center}
.sw-skala span:first-child{text-align:left}
.sw-skala span:last-child{text-align:right}

:root[data-theme="dark"]{--gruen:#30D158;--gruen-weich:rgba(48,209,88,.22)}

,calc(50% - 280px)) 4px;gap:2px;flex:none}.pw-seg button{border:0;background:none;font:inherit;font-size:.875rem;padding:7px 4px;border-radius:8px;color:var(--schrift);cursor:pointer}.pw-seg button[aria-selected="true"]{background:var(--flaeche);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}.uk-wahl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 2px}.uk-wahl .hinweis{margin:0 4px 0 0}.hb-opt{margin:6px 0 10px 14px;padding-left:12px;border-left:2px solid var(--tape)}.hb-opt .unterfrage{margin:0 0 6px}.su-block{margin-bottom:6px}.gk-suche{margin:4px 0 10px}.gk-suche .eingabe-zeile .eingabe{background:color-mix(in srgb,var(--tape) 11%,var(--flaeche));border:1px solid color-mix(in srgb,var(--tape) 40%,transparent)}.gk-suche .eingabe-zeile .eingabe::placeholder{color:color-mix(in srgb,var(--tape) 70%,var(--schrift2))}.gk-suche .eingabe-zeile .eingabe:focus{border-color:var(--tape)}.gk-frage{margin:10px 0 4px;padding:12px 14px;background:var(--flaeche);border-radius:14px}.ku-kurz{margin:4px 0 0;font-size:.9375rem;color:var(--schrift);line-height:1.35}html,body,main{overscroll-behavior-x:none}.blatt{padding-top:14px}.blatt::before{content:"";position:absolute;top:5px;left:50%;width:38px;height:5px;border-radius:3px;background:var(--linie);transform:translateX(-50%)}.blatt-kopf{touch-action:none}.blatt{max-height:62px}.blatt.offen{max-height:70dvh}main{will-change:auto}</style>

 zusätzlich, für die Armfunktion.",quellen:["Q102"],staerke:"schwach empfohlen, sehr niedrige Evidenz"},{id:"NE01_TRANSFER",name:"Transferpaket zum Armtraining",text:"Transferpaket zum aufgabenorientierten Armtraining",angabe:"Zusammen mit aufgabenorientiertem Armtraining, damit das Geübte im Alltag ankommt.",quellen:["Q102"],staerke:"Expertenkonsens"},{id:"NE01_GRUPPE",name:"Aufgabenorientiertes Gruppentraining",text:"aufgabenorientiertes Gruppentraining",angabe:"Nicht schlechter als Einzeltherapie bei Gleichgewicht, Gehgeschwindigkeit und Gehausdauer.",quellen:["Q102"],staerke:"schwach empfohlen, sehr niedrige Evidenz"},{id:"NE01_FUNKTION",name:"Funktionelles aufgabenorientiertes Training",text:"funktionelles aufgabenorientiertes Training",angabe:"Verbessert Alltagsaktivitäten und Beinfunktion, nicht Gleichgewicht und Gehen. Mehr als 2,5 Stunden Reha pro Woche können mehr nutzen.",quellen:["Q103"],staerke:"keine GRADE-Angabe"},{id:"NE01_PNF",name:"PNF-Techniken",text:"PNF-Techniken",angabe:"Kongressposter mit 17 RCTs und 656 Erwachsenen: besser bei Functional Reach und Berg Balance Scale, kein Unterschied bei Timed Up and Go, Rumpfkontrolle und Gehgeschwindigkeit. Wirkung auf die übrige Funktion unklar.",quellen:["Q104","Q105"],staerke:"Evidenz niedrig, nur Abstract gelesen"}]},NE02:{titel:"Morbus Parkinson",hinweise:["Gilt für idiopathisches Parkinson bei Erwachsenen. Die meisten Studien liefen bei Hoehn-und-Yahr-Stadium 1 bis 3, für Stadium 4 und 5 ist die Übertragbarkeit nicht gesichert (Q27).","Physiotherapie im Team der integrierten Versorgung: stark empfohlen, hohe Evidenz (Q27)."],vorschlaege:[{id:"NE02_AUSDAUER",name:"Ausdauertraining",text:"Ausdauertraining mit mittlerer bis hoher Intensität",angabe:"Mittlere bis hohe Intensität, für die Sauerstoffaufnahme.",quellen:["Q27"],staerke:"stark empfohlen, hohe Evidenz"},{id:"NE02_KRAFT",name:"Krafttraining",text:"Krafttraining",angabe:"Gegen die Schwere der motorischen Symptome.",quellen:["Q27"],staerke:"stark tsziel von mehr als 150 Minuten pro Woche besprochen",angabe:"Mehr als 150 Minuten Training oder Alltagsaktivität pro Woche, schrittweise steigern, nach Fähigkeit, Vorlieben und Sicherheit.",quellen:["Q106"],staerke:"Konsensus aus Evidenz und Expertenmeinung"},{id:"NE03_AUSDAUER",name:"Ausdauertraining",text:"Ausdauertraining",angabe:"Strukturiertes Ausdauer- und Krafttraining mit Gleichgewicht und Beweglichkeit geht mit dem Erhalt der Selbstständigkeit einher.",quellen:["Q107"],staerke:"narrative Übersicht, keine Grade"},{id:"NE03_KRAFT",name:"Krafttraining",text:"Krafttraining",angabe:"Wie oben, Q107.",quellen:["Q107"],staerke:"narrative Übersicht, keine Grade"},{id:"NE03_BALANCE",name:"Gleichgewichtstraining",text:"Gleichgewichtstraining",angabe:"Wie oben, Q107.",quellen:["Q107"],staerke:"narrative Übersicht, keine Grade"},{id:"NE03_BEWEG",name:"Beweglichkeitsübungen",text:"Beweglichkeitsübungen",angabe:"Wie oben, Q107.",quellen:["Q107"],staerke:"narrative Übersicht, keine Grade"}]},NE04:{titel:"Polyneuropathie",hinweise:["Die Quelle ist von 2004 und beruht auf drei kleinen Studien von schlechter Qualität. Für die Alltagsfunktion ist ein Nutzen nicht belegt."],vorschlaege:[{id:"NE04_KRAFT",name:"Fortschreitendes Krafttraining",text:"fortschreitendes Krafttraining der betroffenen Muskeln",angabe:"Kann die Kraft der betroffenen Muskeln verbessern.",quellen:["Q108"],staerke:"begrenzte Evidenz"}]},NE05:{titel:"Schädel-Hirn-Trauma",hinweise:["Von Q31 ist nur die Zusammenfassung gelesen. Einzelempfehlungen und Hinweise je Gruppe stehen im Volltext (JNPT 2020)."],vorschlaege:[{id:"NE05_GEHEN",name:"Aufgabenspezifisches Gehtraining",text:"aufgabenspezifisches Gehtraining mit höherer Intensität oder zusätzlichem Feedback",angabe:"Mit höherer Intensität oder mit zusätzlichem Feedback, für Gehgeschwindigkeit und Gehstrecke.",quellen:["Q31"],staerke:"„Suggests“, keine Stufe genannt"}]},NE06:{titel:"Inkomplette Querschnittlähmung",hinweise:["Von Q31 ist nur die Zusammenfassung gelesen. Einzelempfehlungen und Hinweise je Gruppe stehen im Volltext (JNPT 2020)."],vorschlaege:[{id:"NE06_GEHEN",name:"Aufgabenspezifisches Gehtraining",text:"aufgabenspezifisches Gehtraining mit höherer Intensität oder zusätzlichem Feedback",angabe:"Mit höherer Intensität oder mit zusätzlichem Feedback, für Gehgeschwindigkeit und Gehstrecke.",quellen:["Q31"],staerke:"„Suggests“, keine Stufe genannt"}]},WS02:{titel:"Bandscheibenvorfall LWS",herkunft:"Vorschläge aus dem Wissensbasis-Eintrag WS02 (Stand 09.10.2026), dort aus den genannten Leitlinien zusammengefasst. Die Leitlinien selbst habe ich dafür nicht neu gelesen. Welche Quelle zu welcher Maßnahme gehört, ist im Eintrag nicht einzeln angegeben. Entwurf, fachlich prüfen, kein Ersatz für klinisches Urteil.",hinweise:["Nicht empfohlen: Traktion als alleinige Maßnahme, längere Bettruhe.","Belastung erst steigern, wenn der Beinschmerz zentralisiert oder abnimmt. Kraftgrade bei jedem Termin kurz kontrollieren.","Warnzeichen (Cauda-equina-Zeichen, fortschreitende Lähmung, Kraftgrad 3 oder schlechter): sofort ärztlich abklären.","Die Leitlinie Q03 ist vermutlich abgelaufen, ihre Gültigkeit ist zu prüfen."],vorschlaege:[{id:"WS02_EDU",name:"Edukation zur Prognose",text:"Edukation zur günstigen Prognose",angabe:"Spontanverlauf meist günstig: Viele Vorfälle bilden sich in Wochen bis Monaten zurück. Konservative Therapie ist ohne schwere oder fortschreitende Ausfälle der Standard.",quellen:["Q03"],staerke:"aus der Wissensbasis, Stärke je Maßnahme dort nicht angegeben"},{id:"WS02_AKTIV",name:"Aktiv bleiben, Lagerung",text:"Aktivität im Alltag erhalten, schmerzorientierte Lagerung in der akuten Phase",angabe:"Aktiv bleiben, in der akuten Phase schmerzorientiert lagern.",quellen:["Q03","Q02"],staerke:"aus der Wissensbasis, Stärke je Maßnahme dort nicht angegeben"},{id:"WS02_RICHTUNG",name:"Richtungsspezifische Bewegung",text:"wiederholte Bewegung in die zentralisierende Richtung",angabe:"Wenn sich der Beinschmerz zentralisiert. Beispiel aus dem Eintrag: Extension in Bauchlage, 10 Wiederholungen, mehrfach täglich.",quellen:["Q03","Q51"],staerke:"aus der Wissensbasis, Stärke je Maßnahme dort nicht angegeben"},{id:"WS02_NEURODYN",name:"Neurodynamik (Slider)",text:"Neurodynamik als Gleitübung (Slider)",angabe:"Gleiten statt Spannen, 2 bis 3 Serien à 10 Wiederholungen, schmerzfrei.",quellen:["Q03"],staerke:"aus der Wissensbasis, Stärke je Maßnahme dort nicht angegeben"},{id:"WS02_GEHEN",name:"Gehen in kurzen Einheiten",text:"Gehen in kurzen Einheiten, mehrmals täglich",angabe:"Kurze Einheiten, mehrmals täglich.",quellen:["Q03"],staerke:"aus der Wissensbasis, Stärke je Maßnahme dort nicht angegeben"},{id:"WS02_KRAFT",name:"Kraft und Rumpfstabilität",text:"Kraft- und Rumpfstabilitätstraining nach Abklingen der Akutphase",angabe:"Ab Abklingen der Akutphase, Inhalte wie im Eintrag zum unspezifischen Rückenschmerz (WS01).",quellen:["Q03","Q51"],staerke:"aus der Wissensbasis, Stärke je Maßnahme dort nicht angegeben"}]},WS06:{titel:"Bandscheibenvorfall HWS",herkunft:"Vorschläge aus dem Wissensbasis-Eintrag WS06 (Stand 09.10.2026), dort aus den genannten Leitlinien zusammengefasst. Die Leitlinien selbst habe ich dafür nicht neu gelesen. Welche Quelle zu welcher Maßnahme gehört, ist im Eintrag nicht einzeln angegeben. Entwurf, fachlich prüfen, kein Ersatz für klinisches Urteil.",hinweise:["Belastung steigern und Krafttraining des Arms, sobald die Ausstrahlung zurückgeht.","Warnzeichen für eine Myelopathie (Gangunsicherheit, Ungeschicklichkeit beider Hände, Hoffmann positiv, Kloni): sofort ärztlich abklären.","Die Leitlinie Q04 ist verlängert, ihre Gültigkeit ist zu prüfen."],vorschlaege:[{id:"WS06_ENTLAST",name:"Entlastende Positionen",text:"entlastende Positionen, Schulterabduktion, Schlafposition besprochen",angabe:"Entlastende Positionen, Schulterabduktion, Schlafposition.",quellen:["Q04"],staerke:"aus der Wissensbasis, Stärke je Maßnahme dort nicht angegeben"},{id:"WS06_MOBI",name:"Mobilisation HWS und BWS",text:"Mobilisation von HWS und BWS",angabe:"Mobilisation der HWS und der BWS.",quellen:["Q04"],staerke:"aus der Wissensbasis, Stärke je Maßnahme dort nicht angegeben"},{id:"WS06_NEURODYN",name:"Neurodynamik (Slider)",text:"neurodynamische Slider für den betroffenen Nerv",angabe:"Für den betroffenen Nerv, 2 bis 3 Serien à 10 Wiederholungen, ohne Symptomverstärkung.",quellen:["Q04"],staerke:"aus der Wissensbasis, Stärke je Maßnahme dort nicht angegeben"},{id:"WS06_KRAFT",name:"Halsflexoren und Schulterblatt",text:"Training der tiefen Halsflexoren und der Schulterblattmuskulatur",angabe:"Inhalte wie im Eintrag zu Nackenschmerz (WS05).",quellen:["Q04","Q05"],staerke:"aus der Wissensbasis, Stärke je Maßnahme dort nicht angegeben"},{id:"WS06_TRAKTION",name:"Intermittierende Traktion",text:"intermittierende Traktion als Ergänzung",angabe:"Als Ergänzung möglich.",quellen:["Q50"],staerke:"Evidenz gemischt (Q50)"}]}},fortbildung:[]};var Fb=[{id:"WS01",titel:"Nicht-spezifischer Kreuzschmerz",bereich:"Wirbelsäule",icd10:["M54.5"],quellen:["Q01","Q51"],evidenz:"hoch",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"01_Wirbelsaeule/01_Nicht-spezifischer_Kreuzschmerz.md",abschnitte:[{titel:"Kurz",text:"Schmerz zwischen Rippenbogen und Gesäßfalte ohne eindeutige körperliche Ursache. Rund 85 % aller Kreuzschmerzen. Akut unter 6 Wochen, subakut 6–12 Wochen, chronisch über 12 Wochen. Die meisten akuten Episoden bessern sich in wenigen Wochen deutlich."},{titel:"Anamnese – worauf achten",text:`- Beginn, Auslöser, frühere Episoden
- Ausstrahlung bis höchstens Knie spricht eher für nicht-spezifisch, unterhalb des Knies an Radikulopathie denken (WS02)
- Yellow Flags ab 4 Wochen Dauer systematisch erfassen (Q01)`},{titel:"Warnzeichen",text:"Siehe G02, besonders Cauda equina, Fraktur, Tumor, Infektion, entzündlich (WS10)."},{titel:"Befund",text:`- Bewegungsprüfung LWS, Richtungspräferenz (Schmerz zentralisiert sich bei wiederholter Bewegung in eine Richtung?)
- Neurologischer Basisstatus: Lasègue/SLR, Slump, Kennmuskeln L4–S1, Reflexe, Sensibilität
- Hüftbeweglichkeit, ISG-Provokationstests nur ergänzend
- Bildgebung ist ohne Red Flags nicht nötig (Q01)`},{titel:"Messinstrumente",text:"NPRS, ODI oder RMDQ, PSFS, STarT Back zur Einteilung."},{titel:"Typische Ziele",text:`- Alltagsaktivitäten (Sitzen, Heben, Gehen) wieder ohne Vermeidung
- Rückkehr zur Arbeit
- Selbstmanagement: weiß, was bei einem neuen Schub zu tun ist`},{titel:"Therapieplanung",text:`- **Akut**: aufklären, beruhigen, aktiv bleiben, Bettruhe vermeiden (Q01). Physiotherapie nicht routinemäßig nötig, bei Bedarf kurz und aktiv.
- **Subakut und chronisch**: Bewegungstherapie als Kern (Q01, Q51). Bei hohem Risiko nach STarT Back multimodale Behandlung erwägen (Bewegung, Edukation, psychologische Anteile).
- Manuelle Therapie, Massage nur in Kombination mit Übungen.`},{titel:"Durchführung",text:`- Edukation: Schmerz bedeutet nicht Schaden, Prognose ist gut, Bewegung hilft
- Übungen nach Richtungspräferenz (zum Beispiel wiederholte Extension in Bauchlage 10x, alle 2–3 Stunden), wenn eine vorhanden ist
- Rumpfkraft und Motorkontrolle: Bird-Dog, Seitstütz, Brücke, je 3x 8–12 bzw. 3x 20–30 s
- Krafttraining für Beine und Rücken: Kreuzheben mit leichtem Gewicht, Kniebeugen, Rudern, 2–3x pro Woche, 3x 8–12 (G05)
- Ausdauer: Gehen, Radfahren, Schwimmen, langsam steigern
- Graded Activity bzw. Graded Exposure bei Bewegungsangst: gefürchtete Bewegung in kleinen Schritten üben
- Heimprogramm: 2–3 Übungen, täglich`},{titel:"Progression",text:"Von Liegen über Vierfüßler zu Stehen und Alltagsbewegung. Last erhöhen, sobald 12 Wiederholungen sauber gehen und der Schmerz bis zum nächsten Morgen abklingt."},{titel:"Nicht empfohlen",text:"Passive Maßnahmen allein, Bettruhe, Kinesiotape, Ultraschall, TENS, Kurzwelle (Q01: keine Empfehlung bzw. Empfehlung dagegen, im Original prüfen)."}],quellenKurz:{Q01:"NVL Nicht-spezifischer Kreuzschmerz, 2. Aufl.",Q51:"JOSPT Low Back Pain 2021"},stichworte:["lumbalgie","lumbago","kreuzschmerz","lws syndrom","lws-syndrom","rueckenschmerz","low back pain","hexenschuss","lumbale rueckenschmerzen","isg syndrom","isg blockade"]},{id:"WS02",titel:"Lumbale Radikulopathie und Bandscheibenvorfall",bereich:"Wirbelsäule",icd10:["M51.1","M54.1"],quellen:["Q03","Q02","Q51"],evidenz:"mittel",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"01_Wirbelsaeule/02_Lumbale_Radikulopathie.md",abschnitte:[{titel:"Kurz",text:"Reizung oder Kompression einer Nervenwurzel, meist L5 oder S1 durch einen Bandscheibenvorfall. Beinschmerz oft stärker als Rückenschmerz. Spontanverlauf meist günstig: Viele Vorfälle bilden sich in Wochen bis Monaten zurück."},{titel:"Anamnese",text:`- Ausstrahlung ins Bein unterhalb des Knies, entlang eines Dermatoms
- Kribbeln, Taubheit, Schwäche (Fußheber L5, Zehenstand S1, Knie strecken L3/L4)
- Husten, Niesen, Pressen verstärken
- Verlauf der neurologischen Ausfälle: besser, gleich, schlechter?`},{titel:"Warnzeichen",text:"Cauda-equina-Zeichen, fortschreitende Lähmung, Kraftgrad 3 oder schlechter → sofort ärztlich (G02, Q03)."},{titel:"Befund",text:`- Neurologischer Status: Dermatome, Kennmuskeln (L4 Tibialis anterior/Quadrizeps, L5 Extensor hallucis longus, S1 Gastrocnemius/Peronäen), PSR (L4), ASR (S1)
- SLR/Lasègue (sensitiv bei Bandscheibenvorfall), gekreuzter Lasègue (spezifisch), Slump-Test
- Femoralisdehnungstest bei hohen Wurzeln (L2–L4)
- Bewegungsprüfung und Richtungspräferenz`},{titel:"Messinstrumente",text:"NPRS Bein und Rücken getrennt, ODI, PSFS, Kraftgrade dokumentieren (Verlaufskontrolle!)."},{titel:"Ziele",text:`- Beinschmerz reduzieren, neurologische Ausfälle nicht verschlechtern
- Gehen, Sitzen, Arbeit wieder möglich`},{titel:"Therapieplanung",text:`- Konservativ ist ohne schwere oder fortschreitende Ausfälle der Standard (Q03)
- Aktiv bleiben, schmerzorientierte Lagerung in der akuten Phase
- Richtungsspezifische Übungen, wenn sich Beinschmerz zentralisiert
- Nach OP (Nukleotomie): Nachbehandlung nach Vorgabe des Operateurs, meist frühe Mobilisation, keine starren Bewegungsverbote nötig (prüfen mit Operateur)`},{titel:"Durchführung",text:`- Edukation zur guten Prognose
- Wiederholte Bewegung in die Richtung, die zentralisiert (zum Beispiel Extension in Bauchlage, 10x, mehrfach täglich)
- Neurodynamik: Gleiten (Slider) statt Spannen, 2–3x 10 Wiederholungen, schmerzfrei
- Gehen in kurzen Einheiten, mehrmals täglich
- Ab Abklingen der Akutphase Kraft und Rumpfstabilität wie WS01`},{titel:"Progression",text:"Erst wenn Beinschmerz zentralisiert oder abnimmt, Belastung steigern. Kraftgrade bei jedem Termin kurz kontrollieren."},{titel:"Nicht empfohlen",text:"Traktion als alleinige Maßnahme, längere Bettruhe."}],quellenKurz:{Q03:"S2k Lumbale Radikulopathie (2018, Gültigkeit prüfen)",Q02:"S2k Spezifischer Kreuzschmerz 2024",Q51:""},stichworte:["bandscheibenvorfall lws","lumbaler bandscheibenvorfall","bandscheibenprolaps lws","ischialgie","ischias","lumboischialgie","radikulopathie l","nps lws","bandscheibenvorfall"]},{id:"WS03",titel:"Lumbale Spinalkanalstenose",bereich:"Wirbelsäule",icd10:["M48.06"],quellen:["Q02"],evidenz:"niedrig bis mittel",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"01_Wirbelsaeule/03_Lumbale_Spinalkanalstenose.md",abschnitte:[{titel:"Kurz",text:"Einengung des Wirbelkanals, meist degenerativ, ab etwa 60 Jahren. Leitsymptom ist die neurogene Claudicatio: Beinschmerz, Schwere oder Taubheit beim Gehen und Stehen, Besserung beim Sitzen oder Vorbeugen."},{titel:"Anamnese",text:`- Gehstrecke, nach der Beschwerden kommen
- Besserung beim Vorneigen (Einkaufswagen-Zeichen), beim Radfahren kaum Beschwerden
- Abgrenzung zur vaskulären Claudicatio (pAVK, IM05): bei pAVK Besserung auch im Stehen, Pulse schwach`},{titel:"Warnzeichen",text:"Blasen- und Mastdarmstörung, schnell zunehmende Schwäche (G02)."},{titel:"Befund",text:`- Neurologischer Status, oft unauffällig in Ruhe
- Fußpulse tasten
- Gehtest bis Symptombeginn, Wiederholung nach Sitzen
- Hüftbeweglichkeit (Hüftbeugekontraktur verstärkt Lordose)`},{titel:"Messinstrumente",text:"NPRS, ODI, Gehstrecke in Metern bzw. 6-Minuten-Gehtest, Zeit bis Symptombeginn."},{titel:"Ziele",text:"Gehstrecke verlängern, Einkauf oder Spaziergang wieder möglich."},{titel:"Therapieplanung",text:"Konservative Therapie zuerst (Q02). Schwerpunkte: Flexionsorientierte Übungen, Ausdauertraining in Vorneigung, Kraft der Beine, Gleichgewicht."},{titel:"Durchführung",text:`- Ausdauer: Fahrradergometer oder Laufband mit Steigung bzw. Rollator, 20–30 min, 3x pro Woche, RPE 12–14
- Flexion: Knie zur Brust in Rückenlage, Sitz mit Vorneigen, 2–3x 10
- Hüftbeuger dehnen, 3x 30 s
- Kraft: Sit-to-Stand, Brücke, Step-ups, 3x 10–12
- Gleichgewicht und Sturzprävention (G05)

- Sensomotorik: Kopf auf Laserziel ausrichten, Blickfixation mit Kopfbewegung, Augenbewegung bei ruhigem Kopf

- Haltungstraining: aufrichten, Schulterblätter zurück

- Nach Stabilisierung progressives Krafttraining, sofern Ärztin oder Arzt zustimmt`},{titel:"Nicht empfohlen",text:"Ruckartige Flexion unter Last (zum Beispiel Sit-ups) bei bekannter Osteoporose, Manipulation der Wirbelsäule."}],quellenKurz:{Q07:"DVO S3 Osteoporose 2023"},stichworte:["wirbelkoerperfraktur","osteoporotische fraktur","sinterungsfraktur","wirbelkoerpereinbruch","lwk fraktur","bwk fraktur"]},{id:"WS09",titel:"Idiopathische Skoliose",bereich:"Wirbelsäule",icd10:["M41.1","M41.2"],quellen:[],evidenz:"niedrig bis mittel",stand:"2026-10-09",status:"Entwurf, fachlich prüfen; keine aktuelle Leitlinie gefunden",datei:"01_Wirbelsaeule/09_Idiopathische_Skoliose.md",abschnitte:[{titel:"Kurz",text:"Dreidimensionale Verkrümmung der Wirbelsäule ohne bekannte Ursache, meist im Jugendalter (adoleszente idiopathische Skoliose). Behandlung richtet sich nach Cobb-Winkel, Wachstumsreserve (Risser) und Progression: Beobachten, Korsett, Operation. Bei Erwachsenen stehen Schmerz und Funktion im Vordergrund."},{titel:"Anamnese",text:`- Alter, Wachstumsschub, Menarche, Cobb-Winkel und Risser laut Arzt, Korsett und Tragezeit

- Stabilisation der korrigierten Haltung im Alltag

- Bei Korsett: Hautkontrolle, Übungen im und außerhalb des Korsetts nach Vorgabe`},{titel:"Hinweis",text:"Keine aktuelle deutsche Leitlinie im AWMF-Register gefunden. Internationale Empfehlungen (SOSORT) vor Nutzung prüfen."}],quellenKurz:{},stichworte:["skoliose"]},{id:"WS10",titel:"Axiale Spondyloarthritis (Morbus Bechterew)",bereich:"Wirbelsäule",icd10:["M45"],quellen:["Q06","Q62"],evidenz:"hoch",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"01_Wirbelsaeule/10_Axiale_Spondyloarthritis.md",abschnitte:[{titel:"Kurz",text:"Entzündlich-rheumatische Erkrankung von Wirbelsäule und Iliosakralgelenken. Beginn meist vor dem 40. Lebensjahr. Ohne Behandlung zunehmende Steifigkeit. Medikamentöse Therapie ärztlich, Bewegungstherapie ist ein fester Baustein (Q06)."},{titel:"Anamnese",text:`- Entzündlicher Rückenschmerz: Beginn vor 40, schleichend, Morgensteifigkeit über 30 Minuten, Besserung durch Bewegung, nicht durch Ruhe, nächtliches Erwachen

- Ausdauer: Schwimmen, Radfahren, Nordic Walking

- Überkopfarbeit, Sport mit Wurf oder Schwimmen, Laststeigerung

- Painful Arc (bestätigt eher), Hawkins-Kennedy (schließt eher aus) (Q10)
- Kraft mit Handdynamometer: Außenrotation, Abduktion
- HWS screenen (Q10)
- Bildgebung erst nach 12 Wochen erfolgloser Therapie, dann Ultraschall bevorzugt (Q10)`},{titel:"Messinstrumente",text:"NPRS, SPADI oder QuickDASH, Kraft in kg, Bewegungsausmaß mit Goniometer oder App (Q10)."},{titel:"Ziele",text:"Arm schmerzarm über Kopf bewegen, Schlafen auf der Seite, Arbeit und Sport."},{titel:"Therapieplanung",text:"Übungstherapie ist die Kernbehandlung mit starker Empfehlung (Q10). Progressives Widerstandstraining plus Motorkontrolle, angepasst an Schmerztoleranz. Bei anhaltend starken Beschwerden nach 12 Wochen Überweisung an Facharzt (Q10). Operation (subakromiale Dekompression) bringt im Vergleich zu Übungen meist keinen Zusatznutzen."},{titel:"Durchführung",text:`- Edukation: Belastung anpassen statt Ruhe
- Isometrie Außenrotation und Abduktion bei hoher Reizbarkeit, 5x 30–45 s
- Außenrotation mit Theraband oder Hantel in Seitlage, 3x 10–15, später schwerer
- Abduktion in Skapulaebene, Rudern, Schulterpresse
- Schulterblattkontrolle
- 12 Wochen Übungsprogramm einplanen, Schmerz während der Übung bis 5/10 erlaubt (G05)
- Manuelle Therapie nur ergänzend`},{titel:"Progression",text:"Von unterhalb Schulterhöhe über Schulterhöhe zu Überkopf. Last erhöhen bei 3x 15 sauber."}],quellenKurz:{Q10:"JOSPT 2025 Rotator cuff tendinopathy",Q09:"S2e Subakromiales Impingement 2021"},stichworte:["impingement","subakromial","subacromial","rotatorenmanschettentendinopathie","supraspinatussehnensyndrom","supraspinatus tendinopathie","supraspinatussyndrom","periarthropathia humeroscapularis","pa hs","bursitis subacromialis","rotatorenmanschettenlaesion","rotatorenmanschettensyndrom"]},{id:"SH02",titel:"Rotatorenmanschettenruptur",bereich:"Schulter",icd10:["M75.1","S46.0"],quellen:["Q08"],evidenz:"mittel",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"02_Schulter/02_Rotatorenmanschettenruptur.md",abschnitte:[{titel:"Kurz",text:"Teil- oder Komplettriss einer oder mehrerer Sehnen, meist Supraspinatus. Degenerativ ab etwa 50 Jahren oft ohne Beschwerden, traumatisch nach Sturz oder Luxation. Bei traumatischen Rissen jüngerer Patienten wird eher früh operiert, bei degenerativen oft erst konservativ (Q08)."},{titel:"Anamnese",text:`- Trauma ja oder nein, Kraftverlust, Nachtschmerz

- Lag-Signs (Außenrotations-Lag, Drop-Arm) bei großer Ruptur
- Aktive vs. passive Beweglichkeit (Pseudoparalyse?)`},{titel:"Messinstrumente",text:"NPRS, SPADI oder QuickDASH, Kraft in kg, Beweglichkeit."},{titel:"Ziele",text:"Arm im Alltag einsetzen (Haare kämmen, Regal), Kraft für Beruf."},{titel:"Therapieplanung",text:`**Konservativ**: Kräftigung der verbleibenden Rotatorenmanschette und des Deltoideus, Schulterblattkontrolle, 3 Monate.
**Nach Rekonstruktion** (Freigaben des Operateurs gehen vor):
- Phase 1, etwa Woche 0–6: Schutz der Naht, Schlinge, passive Bewegung im erlaubten Rahmen, Ellenbogen, Hand, Schulterblatt aktiv
- Phase 2, etwa Woche 6–12: aktiv-assistiv, dann aktiv, leichte Isometrie
- Phase 3, ab etwa Woche 12: Kräftigung, steigend
- Phase 4, ab etwa Monat 4–6: Arbeit und Sport`},{titel:"Durchführung",text:`- Pendelübungen, passive Flexion und Außenrotation nach Freigabe
- Aktiv-assistiv mit Stab, Tisch-Rutschen, Wand
- Später Theraband Außen- und Innenrotation, Abduktion in Skapulaebene
- Deltoideus-Training bei konservativer Therapie großer Rupturen (Anterior-Deltoid-Programm)`}],quellenKurz:{Q08:"S2k Rotatorenmanschettenruptur 2025"},stichworte:["rotatorenmanschettenruptur","supraspinatusruptur","rm ruptur","rotatorenmanschettenrekonstruktion","rotatorenmanschettennaht","rotatorenmanschettenlaesion","supraspinatussehnenriss"]},{id:"SH03",titel:"Tendinosis calcarea (Kalkschulter)",bereich:"Schulter",icd10:["M75.3"],quellen:["Q10"],evidenz:"niedrig",stand:"2026-10-09",status:"Entwurf, fachlich prüfen; keine spezifische Leitlinie",datei:"02_Schulter/03_Tendinosis_calcarea.md",abschnitte:[{titel:"Kurz",text:"Kalkablagerung in der Rotatorenmanschette, meist Supraspinatus, häufiger bei Frauen zwischen 30 und 60. Verlauf in Phasen. In der Auflösungsphase sehr starke, akute Schmerzen. Kalk löst sich oft spontan auf."},{titel:"Anamnese",text:`- Plötzlicher, sehr starker Schmerz, Nacht, kaum Bewegung möglich (Resorptionsphase)

gelenk.md",abschnitte:[{titel:"Kurz",text:"Vorne: Schmerz bei Dorsalextension (Kniebeuge, Bergauf), Osteophyten oder Weichteil. Hinten: Schmerz bei Plantarflexion (Ballett, Fußball), Os trigonum."},{titel:"Therapieplanung",text:"Belastungsanpassung, Mobilisation des Talus nach hinten (vorne) bzw. Belastungssteuerung bei Plantarflexion (hinten), Kraft und Kontrolle. Bei Versagen arthroskopisch."}],quellenKurz:{},stichworte:["impingement osg","impingement sprunggelenk","osg impingement"]},{id:"SG09",titel:"Peronealsehnen-Pathologie",bereich:"Sprunggelenk",icd10:["M76.7"],quellen:[],evidenz:"niedrig",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"08_Sprunggelenk/09_Peronealsehnen.md",abschnitte:[{titel:"Kurz",text:"Tendinopathie, Längsriss oder Subluxation der Peronealsehnen hinter dem Außenknöchel. Häufig mit chronischer Instabilität und Rückfuß-Varus."},{titel:"Therapieplanung",text:"Tendinopathie-Prinzipien (G05): Isometrie Eversion, dann Kräftigung mit Band und unter Last, Gleichgewicht. Bei Subluxation oder Riss ärztlich."}],quellenKurz:{},stichworte:["peronealsehne","peroneus sehne"]},{id:"SG10",titel:"Osteochondrale Läsion des Talus",bereich:"Sprunggelenk",icd10:["M93.2"],quellen:[],evidenz:"niedrig",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"08_Sprunggelenk/10_Osteochondrale_Laesion_Talus.md",abschnitte:[{titel:"Kurz",text:"Knorpel-Knochen-Schaden am Sprungbein, oft nach Distorsion. Tiefer Gelenkschmerz, Schwellung, wenn „Verstauchung“ nicht abheilt."},{titel:"Warnzeichen",text:"Anhaltende Beschwerden über 6 Wochen nach Distorsion → ärztlich, MRT."},{titel:"Therapieplanung",text:"Konservativ Belastungsanpassung, Kraft und Gleichgewicht. Nach Mikrofrakturierung oder Knorpeltransplantation: Teilbelastung nach Vorgabe (oft 6 Wochen), Bewegung früh."}],quellenKurz:{},stichworte:["osteochondrosis dissecans talus","osteochondrale laesion","talusflake","od talus"]},{id:"FU01",titel:"Plantarfasziopathie (Fersenschmerz)",bereich:"Fuß",icd10:["M72.2"],quellen:["Q24"],evidenz:"hoch",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"09_Fuss/01_Plantarfasziopathie.md",abschnitte:[{titel:"Kurz",text:"Häufigster Fersenschmerz bei Erwachsenen. Stechender Schmerz an der Fußsohle innen an der Ferse, besonders bei den ersten Schritten morgens und nach dem Sitzen. Fersensporn im Röntgen ist oft Nebenbefund."},{titel:"Anamnese",text:"- Anlaufschmerz morgens, Belastungsumfang, Schuhe, Gewicht, Stehberuf, Laufsport"},{titel:"Befund",text:`- Druckschmerz am medialen Kalkaneus-Tuberkel

- Low-Dye-Tape in der Akutphase`}],quellenKurz:{Q24:"JOSPT Heel Pain 2023"},stichworte:["plantarfasziitis","plantarfasziopathie","fersensporn","fasciitis plantaris","fersenschmerz"]},{id:"FU02",titel:"Tibialis-posterior-Dysfunktion / erworbener Plattfuß",bereich:"Fuß",icd10:["M76.8","M21.4"],quellen:[],evidenz:"niedrig bis mittel",stand:"2026-10-09",status:"Entwurf, fachlich prüfen; keine aktuelle Leitlinie gefunden",datei:"09_Fuss/02_Tibialis-posterior-Dysfunktion.md",abschnitte:[{titel:"Kurz",text:"Schwäche und Tendinopathie der Tibialis-posterior-Sehne, häufig bei Frauen ab 50 mit Übergewicht. Folge: zunehmender Knick-Plattfuß (heute „progressive collapsing foot deformity“). Einteilung nach Johnson/Strom."},{titel:"Befund",text:`- Schwellung hinter dem Innenknöchel

 ärztlich, oft längere Entlastung."},{titel:"Therapieplanung",text:"Entlastung nach Schmerz (Walker), 4–8 Wochen, Alternativtraining (Rad, Schwimmen), dann Laufaufbau in kleinen Schritten. Ursachen klären (Energiezufuhr, Umfang, Schuhe)."}],quellenKurz:{},stichworte:["ermuedungsfraktur","stressfraktur","marschfraktur"]},{id:"FU06",titel:"Fraktur der Basis des Metatarsale V",bereich:"Fuß",icd10:["S92.3"],quellen:[],evidenz:"niedrig bis mittel",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"09_Fuss/06_Fraktur_Basis_MT5.md",abschnitte:[{titel:"Kurz",text:"Zone 1 (Abrissfraktur, häufig mit Supinationstrauma): heilt meist gut, funktionell mit Belastung nach Toleranz. Zone 2 (Jones-Fraktur): schlechtere Durchblutung, oft längere Entlastung oder OP."},{titel:"Therapieplanung",text:"Nach Zone und Vorgabe. Danach wie SG01: Beweglichkeit, Kraft, Gleichgewicht, Laufaufbau."}],quellenKurz:{},stichworte:["metatarsale v","metatarsale 5","jones fraktur","basisfraktur mt v"]},{id:"FU07",titel:"Diabetisches Fußsyndrom",bereich:"Fuß",icd10:["E11.74","E10.74"],quellen:["Q44"],evidenz:"mittel",stand:"2026-10-09",status:"Entwurf, fachlich prüfen; NVL/Leitlinie Diabetisches Fußsyndrom im Register prüfen",datei:"09_Fuss/07_Diabetisches_Fusssyndrom.md",abschnitte:[{titel:"Kurz",text:"Folge von Neuropathie und Durchblutungsstörung bei Diabetes. Druckstellen, Ulzera, Charcot-Fuß. Hohe Amputationsgefahr. Physiotherapie: Prävention, Kraft und Gleichgewicht, Gangschulung, sichere Bewegung."},{titel:"Warnzeichen",text:"Wunde, Rötung, Überwärmung, Schwellung ohne Schmerz (Charcot!) → sofort ärztlich, Fußambulanz."},{titel:"Befund",text:`- Inspektion beider Füße bei jedem Termin (Druckstellen, Hornhaut, Verletzungen)

- Schulung: tägliche Fußkontrolle, nie barfuß, passende Schuhe`},{titel:"Durchführung",text:"Sitzende und liegende Kraftübungen bei Ulkus, Fahrradergometer mit Schutzschuh, Gleichgewicht gesichert."}],quellenKurz:{Q44:"NVL Typ-2-Diabetes (Fußkapitel prüfen)"},stichworte:["diabetisches fusssyndrom","dfs","diabetischer fuss"]},{id:"FU08",titel:"Tarsaltunnelsyndrom",bereich:"Fuß",icd10:["G57.5"],quellen:[],evidenz:"niedrig",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"09_Fuss/08_Tarsaltunnelsyndrom.md",abschnitte:[{titel:"Kurz",text:"Engpass des N. tibialis hinter dem Innenknöchel. Brennen und Kribbeln an der Fußsohle, oft nachts."},{titel:"Befund",text:"Tinel hinter dem Innenknöchel, Dorsalextensions-Eversionstest, Sensibilität Fußsohle, LWS (S1) abgrenzen."},{titel:"Therapieplanung",text:"Einlage bei Knick-Senkfuß, neurodynamische Gleitübungen, Belastungsanpassung. Ärztlich bei Ausfällen."}],quellenKurz:{},stichworte:["tarsaltunnel"]},{id:"FU09",titel:"Lisfranc-Verletzung",bereich:"Fuß",icd10:["S93.3"],quellen:[],evidenz:"niedrig",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"09_Fuss/09_Lisfranc-Verletzung.md",abschnitte:[{titel:"Kurz",text:"Verletzung der Tarsometatarsalgelenke, wird oft übersehen. Hämatom an der Fußsohle, Schmerz am Mittelfuß."},{titel:"Warnzeichen",text:"Plantares Hämatom, kann nicht auf Zehenspitzen stehen → ärztlich, Belastungsaufnahmen."},{titel:"Therapieplanung",text:"Stabil: Entlastung 6 Wochen (Vorgabe). Instabil: OP, Teilbelastung oft 6–12 Wochen. Danach Gang, Kraft, Einlage."}],quellenKurz:{},stichworte:["lisfranc"]},{id:"FU10",titel:"Kindlicher Knick-Senkfuß",bereich:"Fuß",icd10:["Q66.6","M21.4"],quellen:[],evidenz:"niedrig",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"09_Fuss/10_Kindlicher_Knick-Senkfuss.md",abschnitte:[{titel:"Kurz",text:"Bei Kleinkindern normal und meist von selbst rückläufig. Behandlungsbedürftig nur, wenn starr, schmerzhaft oder einseitig."},{titel:"Befund",text:"Zehenstand (Längsgewölbe richtet sich auf, Ferse dreht nach innen = flexibel), Jack-Test, Wadenlänge."},{titel:"Therapieplanung",text:"Flexibel und schmerzfrei: Aufklärung, barfuß gehen, Spiel- und Bewegungsangebote. Starr oder schmerzhaft: ärztlich (Coalitio ausschließen)."}],quellenKurz:{},stichworte:["kindlicher knicksenkfuss","knicksenkfuss kind"]},{id:"ZE01",titel:"Hallux valgus",bereich:"Zehen",icd10:["M20.1"],quellen:["Q25"],evidenz:"mittel",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"10_Zehen/01_Hallux_valgus.md",abschnitte:[{titel:"Kurz",text:"Abweichung der Großzehe nach außen mit Ballen am Mittelfußköpfchen I. Häufig bei Frauen, familiär gehäuft. Konservative Maßnahmen lindern Beschwerden, korrigieren die Fehlstellung aber nicht. Bei Schmerzen und Leidensdruck OP (Q25)."},{titel:"Anamnese",text:"Schmerz am Ballen, Schuhprobleme, Metatarsalgie, Zehen II–V betroffen?"},{titel:"Befund",text:"Winkel (klinisch, Röntgen ärztlich), Beweglichkeit MTP I, Transfermetatarsalgie, Gangbild (Abrollen)."},{titel:"Messinstrumente",text:"NPRS, MOxFQ oder FFI (prüfen), Beweglichkeit MTP I."},{titel:"Therapieplanung",text:`- Konservativ: breite Schuhe, Polster, Einlagen bei Metatarsalgie, Fußmuskelübungen (Wirkung auf Winkel nicht belegt, Q25 prüfen)
