idekantendistanz bei maximaler aktiver und passiv unterstützter Öffnung mit Lineal messen.", "ziel": "Bewegungseinschränkung des Kiefers objektivieren.", "norm": ["Positiv, wenn die maximale Öffnung (inkl. vertikalem Überbiss) unter 40 mm liegt (DC/TMD); der CMD-Kurzbefund nennt deutlich unter 38 mm.", "Diskusverlagerung ohne Reposition mit eingeschränkter Öffnung (DC/TMD-Kriterium): Sens. 80 %, Spez. 97 % (Schiffman 2014)."], "durch": "Sitz. Der Patient öffnet maximal, gemessen wird die Distanz zwischen den Schneidekanten der oberen und unteren mittleren Inzisivi plus vertikalem Überbiss. Danach unterstützt der Therapeut die Öffnung passiv mit Daumen und Zeigefinger (assistierte Öffnung). Positiv bei weniger als 40 mm assistierter Öffnung; Schmerz dabei zusätzlich notieren.", "position": "Sitz", "quellen": ["Schiffman 2014 (DC/TMD) – https://pmc.ncbi.nlm.nih.gov/articles/PMC4884471", "CMD-Kurzbefund nach Ahlers/Jakstat (ZWP 2015) – https://www.zwp-online.info/fachgebiete/kieferorthopaedie/diagnostik/cmd-screening-erkennt-untersuchungsbedarf"]},"gelenkgeraeusche":{"name": "Kiefergelenkgeräusche", "was": "Diskusverlagerung mit Reposition, Arthrose", "einheit": "positiv oder negativ", "kurz": "Beim Öffnen und Schließen die Kiefergelenke palpieren und auf Knacken oder Reiben achten.", "ziel": "Gelenkgeräusche als Hinweis auf Diskus- oder Gelenkflächenveränderung erfassen.", "norm": ["Positiv bei Knacken (Reposition des Diskus) oder Reiben/Krepitation während Öffnung, Schluss oder Lateralbewegung.", "Diskusverlagerung mit Reposition (DC/TMD): Sens. 34 %, Spez. 92 %; degenerative Gelenkerkrankung: Sens. 55 %, Spez. 61 % (Schiffman 2014)."], "durch": "Sitz. Der Therapeut legt die Zeigefinger direkt vor dem Tragus auf beide Kiefergelenke. Der Patient öffnet und schließt mehrfach und bewegt den Unterkiefer zur Seite und nach vorn. Positiv bei tastbarem oder hörbarem Knacken oder Reiben. Geräusche allein sind kein Behandlungsgrund.", "position": "Sitz", "quellen": ["Schiffman 2014 (DC/TMD) – https://pmc.ncbi.nlm.nih.gov/articles/PMC4884471", "CMD-Kurzbefund nach Ahlers/Jakstat (ZWP 2015) – https://www.zwp-online.info/fachgebiete/kieferorthopaedie/diagnostik/cmd-screening-erkennt-untersuchungsbedarf"]},"okklgeraeusche":{"name": "Okklusale Geräusche", "was": "Ungleichmäßige Zahnkontakte beim Zubeißen", "einheit": "positiv oder negativ", "kurz": "Patient beißt mehrmals kräftig auf die Seitenzähne, Therapeut achtet auf das Klopfgeräusch.", "ziel": "Hinweis auf okklusale Störungen als CMD-Faktor.", "norm": ["Positiv, wenn das Zubeißen kein klares, einphasiges, sondern ein mehrphasiges oder unsauberes Geräusch ergibt (CMD-Kurzbefund).", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Sitz, Mund leicht geöffnet. Der Patient klappert mehrmals zügig auf die Zähne. Ein gesundes Gebiss erzeugt ein helles, einzelnes Klopfgeräusch. Mehrphasige oder dumpfe Geräusche deuten auf ungleichmäßige Kontakte; die weitere Abklärung erfolgt zahnärztlich.", "position": "Sitz", "quellen": ["CMD-Kurzbefund nach Ahlers/Jakstat (ZWP 2015) – https://www.zwp-online.info/fachgebiete/kieferorthopaedie/diagnostik/cmd-screening-erkennt-untersuchungsbedarf"]},"palpkaumuskel":{"name": "Palpation Kaumuskulatur", "was": "Myalgie des M. masseter und temporalis", "einheit": "positiv oder negativ", "kurz": "M. masseter, M. temporalis (anterior) und hinteren Digastricus mit standardisiertem Druck palpieren.", "ziel": "Muskulär bedingten Kieferschmerz nachweisen.", "norm": ["Positiv, wenn die Palpation den bekannten Schmerz des Patienten auslöst (DC/TMD: \"familiar pain\").", "Myalgie nach DC/TMD-Kriterien: Sens. 90 %, Spez. 99 % (Schiffman 2014)."], "durch": "Sitz, Kiefer entspannt. Der Therapeut palpiert M. masseter (Ursprung, Bauch, Ansatz) und M. temporalis anterior mit gleichmäßigem Druck (im DC/TMD-Protokoll etwa 1 kg) für einige Sekunden. Gefragt wird, ob der Schmerz bekannt ist und ob er ausstrahlt. Positiv bei Reproduktion des bekannten Schmerzes.", "position": "Sitz", "quellen": ["Schiffman 2014 (DC/TMD) – https://pmc.ncbi.nlm.nih.gov/articles/PMC4884471", "CMD-Kurzbefund nach Ahlers/Jakstat (ZWP 2015) – https://www.zwp-online.info/fachgebiete/kieferorthopaedie/diagnostik/cmd-screening-erkennt-untersuchungsbedarf"]},"palpkiefergelenk":{"name": "Palpation Kiefergelenk", "was": "Arthralgie des Kiefergelenks", "einheit": "positiv oder negativ", "kurz": "Lateralen Kondylenpol vor dem Tragus palpieren, auch während leichter Protrusion.", "ziel": "Gelenkbedingten Kieferschmerz nachweisen.", "norm": ["Positiv, wenn Druck auf den lateralen Pol oder um den Kondylus den bekannten Schmerz auslöst.", "Arthralgie nach DC/TMD-Kriterien: Sens. 89 %, Spez. 98 % (Schiffman 2014)."], "durch": "Sitz. Der Therapeut tastet den lateralen Kondylenpol direkt vor dem Tragus, bei leicht geöffnetem Mund oder Protrusion. Druck geringer als bei der Muskulatur (im DC/TMD-Protokoll etwa 0,5 kg). Positiv bei bekanntem Schmerz; Seitenvergleich.", "position": "Sitz", "quellen": ["Schiffman 2014 (DC/TMD) – https://pmc.ncbi.nlm.nih.gov/articles/PMC4884471"]},"gangbild":{"name": "Gangbild/Tandemgang", "was": "Gangstörung bei zervikaler Myelopathie", "einheit": "positiv oder negativ", "kurz": "Normales Gehen und Seiltänzergang beobachten.", "ziel": "Gangunsicherheit als Myelopathie-Zeichen erfassen.", "norm": ["Positiv bei breitbasigem, ataktischem oder spastischem Gang oder Unsicherheit im Tandemgang.", "Teil des Myelopathie-Clusters nach Cook 2010 (Kennwerte siehe Cluster)."], "durch": "Stand. Der Patient geht einige Meter in normalem Tempo, danach Fuß vor Fuß auf einer Linie. Beobachtet werden Spurbreite, Rhythmus, Steifigkeit und Gleichgewicht. Positiv bei breitbasigem, ataktischem oder spastischem Gangbild.", "position": "Stand", "quellen": ["Cook 2010 – https://www.physiotutors.com/wiki/cervical-myelopathy-cluster"]},"hoffmann":{"name": "Hoffmann-Zeichen", "was": "Pyramidenbahnzeichen, zervikale Myelopathie", "einheit": "positiv oder negativ", "kurz": "Endglied des Mittelfingers schnell nach palmar schnipsen und Daumen/Zeigefinger beobachten.", "ziel": "Läsion des ersten Motoneurons erkennen.", "norm": ["Positiv bei reflektorischer Beugung von Daumen und Zeigefinger.", "Einzelkennwerte nicht gelesen; Teil des Myelopathie-Clusters (Cook 2010)."], "durch": "Sitz, Hand entspannt, Handgelenk leicht extendiert. Der Therapeut hält den Mittelfinger im Mittelglied und schnippt den Fingernagel des Endglieds nach palmar. Positiv bei Flexion/Adduktion von Daumen und Zeigefinger. Seitenvergleich.", "position": "Sitz", "quellen": ["Cook 2010 – https://www.physiotutors.com/wiki/cervical-myelopathy-cluster"]},"supinatorzeichen":{"name": "Inverses Supinatorzeichen", "was": "Myelopathie auf Höhe C5/C6", "einheit": "positiv oder negativ", "kurz": "Sehne des M. brachioradialis am distalen Radius beklopfen.", "ziel": "Pathologische Reflexantwort als Myelopathie-Zeichen erkennen.", "norm": ["Positiv, wenn statt Ellbogenbeugung eine Fingerflexion oder ein abgeschwächter Brachioradialisreflex mit Fingerbeugung auftritt.", "Einzelkennwerte nicht gelesen; Teil des Myelopathie-Clusters (Cook 2010)."], "durch": "Sitz, Unterarm entspannt in Mittelstellung auf dem Oberschenkel. Der Therapeut beklopft die Sehne des M. brachioradialis knapp proximal des Processus styloideus radii. Positiv, wenn die Finger beugen und die normale Ellbogenbeugung ausbleibt oder schwach ist.", "position": "Sitz", "quellen": ["Cook 2010 – https://www.physiotutors.com/wiki/cervical-myelopathy-cluster"]},"babinski":{"name": "Babinski-Zeichen", "was": "Pyramidenbahnzeichen, Läsion erstes Motoneuron", "einheit": "positiv oder negativ", "kurz": "Lateralen Fußsohlenrand von der Ferse bis zum Großzehenballen bestreichen.", "ziel": "Zentrale neurologische Störung erkennen.", "norm": ["Positiv bei Dorsalextension der Großzehe, oft mit Spreizen der übrigen Zehen.", "Einzelkennwerte nicht gelesen; Teil des Myelopathie-Clusters (Cook 2010)."], "durch": "Rückenlage, Bein entspannt. Mit einem stumpfen Gegenstand wird der laterale Fußsohlenrand von der Ferse nach distal und dann quer zum Großzehenballen bestrichen. Normal ist eine Plantarflexion der Zehen. Positiv bei tonischer Dorsalextension der Großzehe.", "position": "Rückenlage", "quellen": ["Cook 2010 – https://www.physiotutors.com/wiki/cervical-myelopathy-cluster"]},"sharppurser":{"name": "Sharp-Purser-Test", "was": "Instabilität atlantoaxial (Lig. transversum)", "einheit": "positiv oder negativ", "kurz": "Dornfortsatz C2 fixieren, Stirn bei leicht flektierter HWS nach dorsal schieben.", "ziel": "Obere zervikale Instabilität vor Mobilisation ausschließen helfen.", "norm": ["Positiv bei spürbarem Gleiten oder Klunk des Kopfes nach dorsal oder bei Nachlassen von Symptomen, die in Flexion bestanden.", "Sens. 19-69 %, Spez. 71-98 % in Einzelstudien, Reliabilität Kappa 0,06-0,67 (Hutting 2013); als Screening schwach."], "durch": "Sitz, HWS entspannt leicht flektiert. Der Therapeut fixiert mit Daumen und Zeigefinger den Dornfortsatz von C2 und schiebt mit der anderen Hand über die Stirn den Kopf nach dorsal. Positiv bei vermehrtem Gleiten, Klunk oder Rückgang von Flexionssymptomen. Bei Verdacht keine weiteren provozierenden Tests, ärztliche Abklärung.", "position": "Sitz", "quellen": ["Hutting 2013 – https://www.physiotutors.com/wiki/sharp-purser-test/"]},"flexionrotation":{"name": "Flexions-Rotations-Test", "was": "Zervikogener Kopfschmerz, Dysfunktion C1/C2", "einheit": "positiv oder negativ", "kurz": "HWS passiv maximal flektieren, dann Kopf passiv nach rechts und links rotieren.", "ziel": "Eingeschränkte Rotation im Segment C1/C2 erfassen.", "norm": ["Positiv bei Rotation von etwa 10° weniger als die erwartete Norm von rund 44° oder deutlicher Seitendifferenz, meist mit bekanntem Kopfschmerz.", "Zervikogener Kopfschmerz: Sens. 91 %, Spez. 90 % (Ogince 2007)."], "durch": "Rückenlage, Kopf über der Liege. Der Therapeut flektiert die HWS passiv maximal und rotiert den Kopf in dieser Stellung zu beiden Seiten bis zum festen Stopp oder Schmerz. Rotationsweg schätzen oder messen und Seiten vergleichen.", "position": "Rückenlage", "quellen": ["Ogince 2007 – https://www.physiotutors.com/wiki/flexion-rotation-test/"]},"faustperkussion":{"name": "Faustschlag-Perkussion", "was": "Wirbelkörperfraktur, z. B. osteoporotisch", "einheit": "positiv oder negativ", "kurz": "Handfläche auf die Dornfortsätze legen und mit der Faust leicht daraufklopfen, segmentweise.", "ziel": "Hinweis auf Wirbelkörperfraktur (Red Flag) finden.", "norm": ["Positiv bei scharfem, lokalisiertem Schmerz auf einer Höhe.", "Sens. 87,5 %, Spez. 90 % (Langdon 2010)."], "durch": "Sitz oder Stand, Rücken frei. Der Therapeut legt eine Hand flach auf die Dornfortsätze und klopft mit der Faust der anderen Hand auf den Handrücken, beginnend thorakal, Segment für Segment nach kaudal. Positiv bei scharfem, punktuellem Schmerz. Bei positivem Befund ärztliche Abklärung.", "position": "Sitz", "quellen": ["Langdon 2010 – https://www.physio-pedia.com/Closed_Fist_Percussion_Sign"]},"rueckenlagezeichen":{"name": "Rückenlage-Zeichen (Supine Sign)", "was": "Wirbelkörperfraktur", "einheit": "positiv oder negativ", "kurz": "Patient soll sich mit einem Kissen flach auf den Rücken legen.", "ziel": "Hinweis auf symptomatische Wirbelkörperfraktur.", "norm": ["Positiv, wenn der Patient wegen starker Schmerzen nicht flach auf dem Rücken liegen kann.", "Sens. 81 %, Spez. 93 % (Langdon 2010)."], "durch": "Der Patient legt sich mit einem Kopfkissen auf den Rücken. Positiv, wenn das wegen starker Schmerzen nicht möglich ist. Anamnestisch passt dazu oft, dass im Sessel geschlafen wird.", "position": "Rückenlage", "quellen": ["Langdon 2010 – https://www.physiotutors.com/wiki/supine-sign/"]},"ersterippe":{"name": "Zervikaler Rotations-Lateralflexions-Test", "was": "Blockierung der ersten Rippe", "einheit": "positiv oder negativ", "kurz": "HWS maximal von der Seite weg rotieren, dann zur Brust lateralflektieren.", "ziel": "Bewegungseinschränkung der ersten Rippe erkennen.", "norm": ["Positiv, wenn die Lateralflexion im Seitenvergleich deutlich eingeschränkt ist.", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Sitz. Der Therapeut rotiert die HWS passiv maximal von der zu testenden Seite weg und führt dann eine Lateralflexion so, dass das Ohr Richtung Brust geht. Positiv bei festem, früherem Stopp im Seitenvergleich.", "position": "Sitz", "quellen": []},"slrgekreuzt":{"name": "Gekreuzter Lasègue (Crossed SLR)", "was": "Lumbale Radikulopathie bei Bandscheibenvorfall", "einheit": "positiv oder negativ", "kurz": "Das nicht betroffene Bein gestreckt anheben und auf Schmerz im betroffenen Bein achten.", "ziel": "Radikuläre Ursache bestätigen.", "norm": ["Positiv, wenn Anheben des gesunden Beins einschießenden Schmerz im betroffenen Bein im Dermatom auslöst.", "Sens. 28 %, Spez. 90 %, LR+ 2,8 (van der Windt 2010, Cochrane); eher zum Bestätigen."], "durch": "Rückenlage. Der Therapeut hebt das nicht betroffene Bein gestreckt im Hüftgelenk an, etwa bis 60-70°. Positiv, wenn im betroffenen Bein der bekannte, ausstrahlende Schmerz auftritt.", "position": "Rückenlage", "quellen": ["van der Windt 2010 (Cochrane) – https://www.physiotutors.com/wiki/crossed-straight-leg-raise-test/"]},"femoralisdehnung":{"name": "Femoralis-Dehnungstest (Prone Knee Bend)", "was": "Hohe lumbale Radikulopathie L2-L4", "einheit": "positiv oder negativ", "kurz": "In Bauchlage Knie passiv beugen, Ferse Richtung Gesäß.", "ziel": "Mechanosensitivität des N. femoralis prüfen.", "norm": ["Positiv bei Schmerz oder Parästhesie an der Oberschenkelvorderseite oder in die Leiste, im Seitenvergleich.", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Bauchlage, Becken stabilisiert. Der Therapeut beugt das Kniegelenk passiv, bis die Ferse Richtung Gesäß geht; bei Bedarf zusätzlich Hüftextension. Positiv bei bekanntem Schmerz an der Oberschenkelvorderseite. Reine Dehnung des M. rectus femoris abgrenzen.", "position": "Bauchlage", "quellen": []},"plet":{"name": "Passiver lumbaler Extensionstest", "was": "Strukturelle lumbale Instabilität", "einheit": "positiv oder negativ", "kurz": "Beide gestreckten Beine in Bauchlage etwa 30 cm anheben und leicht ziehen.", "ziel": "Lumbale Instabilität erkennen.", "norm": ["Positiv bei starkem Kreuzschmerz, Schweregefühl oder Gefühl, dass der Rücken nachgibt, das beim Absenken verschwindet.", "Sens. 84,2 %, Spez. 90,4 % (Kasai 2006); Sens. 43 %, Spez. 86 % (Ferrari 2014)."], "durch": "Bauchlage. Der Therapeut hebt beide gestreckten Beine gleichzeitig etwa 30 cm von der Liege an und übt leichten Zug aus. Positiv bei starkem Kreuzschmerz, Schweregefühl oder dem Gefühl, der Rücken gebe nach, das beim Zurücklegen nachlässt.", "position": "Bauchlage", "quellen": ["Kasai 2006, Ferrari 2014 – https://www.physiotutors.com/wiki/passive-lumbar-extension-test/"]},"bauchlageinstab":{"name": "Prone Instability Test", "was": "Segmentale lumbale Instabilität, Stabilisationsübungen", "einheit": "positiv oder negativ", "kurz": "Oberkörper liegt auf der Liege, Füße am Boden; PA-Druck auf schmerzhaftes Segment, dann mit angehobenen Beinen wiederholen.", "ziel": "Schmerz durch aktive Stabilisierung beeinflussen.", "norm": ["Positiv, wenn der PA-Druck mit Füßen am Boden schmerzt und der Schmerz bei angehobenen Beinen (Muskelspannung) verschwindet.", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Der Oberkörper liegt bäuchlings auf der Liege, die Füße stehen auf dem Boden. Der Therapeut gibt PA-Druck auf das schmerzhafte Segment. Danach hebt der Patient die Beine vom Boden und der Druck wird wiederholt. Positiv, wenn der Schmerz nur in der ersten Position auftritt.", "position": "Bauchlage", "quellen": []},"isgdistraktion":{"name": "ISG-Distraktionstest", "was": "Schmerzhaftes Iliosakralgelenk", "einheit": "positiv oder negativ", "kurz": "Beidseits Druck auf die medialen SIAS nach dorsolateral.", "ziel": "ISG-Schmerz provozieren.", "norm": ["Positiv bei Reproduktion des bekannten Gesäß-/ISG-Schmerzes.", "Einzelkennwerte nicht gelesen; Teil des Laslett-Clusters."], "durch": "Rückenlage. Der Therapeut legt die Handballen gekreuzt auf die medialen Ränder beider SIAS und drückt nach dorsal-lateral, etwa 30 Sekunden oder mehrmals federnd. Positiv bei bekanntem Schmerz im ISG-Bereich.", "position": "Rückenlage", "quellen": ["Laslett 2005 – https://www.physiotutors.com/wiki/cluster-of-laslett/"]},"thighthrust":{"name": "Thigh-Thrust-Test", "was": "Schmerzhaftes Iliosakralgelenk", "einheit": "positiv oder negativ", "kurz": "Hüfte 90° gebeugt, axialer Druck über den Femur nach dorsal.", "ziel": "ISG-Schmerz provozieren.", "norm": ["Positiv bei Reproduktion des bekannten Schmerzes im Gesäß/ISG.", "Einzelkennwerte nicht gelesen; Teil des Laslett-Clusters."], "durch": "Rückenlage, Hüfte der Testseite 90° flektiert und leicht adduziert. Eine Hand liegt unter dem Sakrum, die andere gibt über das Knie axialen Druck entlang des Femurs nach dorsal. Positiv bei bekanntem ISG-Schmerz.", "position": "Rückenlage", "quellen": ["Laslett 2005 – https://www.physiotutors.com/wiki/cluster-of-laslett/"]},"isgkompression":{"name": "ISG-Kompressionstest", "was": "Schmerzhaftes Iliosakralgelenk", "einheit": "positiv oder negativ", "kurz": "In Seitenlage Druck von oben auf die Crista iliaca Richtung Liege.", "ziel": "ISG-Schmerz provozieren.", "norm": ["Positiv bei Reproduktion des bekannten Schmerzes.", "Einzelkennwerte nicht gelesen; Teil des Laslett-Clusters."], "durch": "Seitenlage, schmerzhafte Seite oben, Hüften und Knie leicht gebeugt. Der Therapeut gibt über die obere Crista iliaca senkrechten Druck Richtung Liege. Positiv bei bekanntem ISG-Schmerz.", "position": "Seitlage", "quellen": ["Laslett 2005 – https://www.physiotutors.com/wiki/cluster-of-laslett/"]},"gaenslen":{"name": "Gaenslen-Test", "was": "Schmerzhaftes Iliosakralgelenk", "einheit": "positiv oder negativ", "kurz": "Ein Bein maximal gebeugt halten, das andere über die Liegekante in Hüftextension führen.", "ziel": "ISG durch Torsion provozieren.", "norm": ["Positiv bei Reproduktion des bekannten Schmerzes.", "Einzelkennwerte nicht gelesen; trägt laut Laslett-Algorithmus kaum zur Genauigkeit bei."], "durch": "Rückenlage am Liegenrand. Der Patient hält das liegenferne Knie an die Brust. Der Therapeut führt das liegennahe Bein über die Kante in Hüftextension und gibt am Ende Überdruck. Beide Seiten testen. Positiv bei bekanntem ISG-Schmerz.", "position": "Rückenlage", "quellen": ["Laslett 2005 – https://www.physiotutors.com/wiki/cluster-of-laslett/"]},"sakralthrust":{"name": "Sacral-Thrust-Test", "was": "Schmerzhaftes Iliosakralgelenk", "einheit": "positiv oder negativ", "kurz": "In Bauchlage Druck senkrecht auf die Mitte des Sakrums.", "ziel": "ISG-Schmerz provozieren.", "norm": ["Positiv bei Reproduktion des bekannten Schmerzes.", "Einzelkennwerte nicht gelesen; Teil des Laslett-Clusters."], "durch": "Bauchlage. Der Therapeut legt den Handballen auf die Mitte des Sakrums und gibt senkrecht nach ventral Druck, mehrfach federnd. Positiv bei bekanntem ISG-Schmerz.", "position": "Bauchlage", "quellen": ["Laslett 2005 – https://www.physiotutors.com/wiki/cluster-of-laslett/"]},"infraspinatus":{"name": "Infraspinatus-Test (Außenrotation gegen Widerstand)", "was": "Läsion der Außenrotatoren, RM-Ruptur", "einheit": "positiv oder negativ", "kurz": "Arm am Körper, Ellbogen 90°, Außenrotation gegen Widerstand.", "ziel": "Kraft und Schmerz der Außenrotatoren prüfen.", "norm": ["Positiv bei Schwäche (Nachgeben) gegen Widerstand, mit oder ohne Schmerz.", "Komplette RM-Ruptur: Sens. 50,5 %, Spez. 84 % (Park 2005)."], "durch": "Stand oder Sitz, Oberarm am Rumpf, Ellbogen 90° gebeugt, Unterarm in Neutralstellung. Der Patient drückt nach außen, der Therapeut gibt Widerstand am distalen Unterarm. Positiv bei Kraftminderung im Seitenvergleich.", "position": "Sitz", "quellen": ["Park 2005 (zit. in Hospitalist-Review) – https://community.the-hospitalist.org/index.php/content/which-history-and-physical-findings-are-most-useful-identifying-rotator-cuff-tears"]},"relocation":{"name": "Relocation-Test", "was": "Vordere Schulterinstabilität", "einheit": "positiv oder negativ", "kurz": "Aus der Apprehension-Position den Humeruskopf nach dorsal drücken.", "ziel": "Apprehension durch Zentrierung des Kopfes beeinflussen.", "norm": ["Positiv, wenn Angstgefühl oder Schmerz unter dorsalem Druck nachlassen.", "Vordere Instabilität: Sens. 65 %, Spez. 90 %, LR+ 5,48, LR- 0,55 (Hegedus 2012, gepoolt)."], "durch": "Rückenlage, Arm 90° abduziert und außenrotiert wie beim Apprehension-Test. Der Therapeut drückt den Humeruskopf von ventral nach dorsal und rotiert weiter nach außen. Positiv, wenn die Angst oder der Schmerz deutlich nachlässt.", "position": "Rückenlage", "quellen": ["Hegedus 2012 – https://upload.orthobullets.com/journalclub/free_pdf/22773322_BrJSportsMed-2012-Hegedus-bjsports-2012-091066.pdf"]},"surprise":{"name": "Surprise-/Release-Test", "was": "Vordere Schulterinstabilität", "einheit": "positiv oder negativ", "kurz": "Im Relocation-Test die dorsale Hand plötzlich lösen.", "ziel": "Instabilitätsgefühl gezielt provozieren.", "norm": ["Positiv bei plötzlichem Schmerz oder Angst beim Loslassen.", "Vordere Instabilität: Sens. 82 %, Spez. 86 %, LR+ 5,42, LR- 0,25 (Hegedus 2012, gepoolt)."], "durch": "Rückenlage, Fortsetzung des Relocation-Tests. Nach Außenrotation unter dorsalem Druck lässt der Therapeut die Hand am Humeruskopf plötzlich los. Positiv bei Angst oder plötzlichem Schmerz. Vorsicht bei frischer Luxation.", "position": "Rückenlage", "quellen": ["Hegedus 2012 – https://upload.orthobullets.com/journalclub/free_pdf/22773322_BrJSportsMed-2012-Hegedus-bjsports-2012-091066.pdf"]},"crossbody":{"name": "Cross-Body-Adduktionstest", "was": "Schmerzhaftes AC-Gelenk", "einheit": "positiv oder negativ", "kurz": "Arm 90° flektiert passiv horizontal über den Körper adduzieren.", "ziel": "AC-Gelenk durch Kompression provozieren.", "norm": ["Positiv bei Schmerz lokal über dem AC-Gelenk.", "Sens. 75 %, Spez. 61 % (Chew, zit. in Hegedus 2012, Einzelstudie)."], "durch": "Sitz oder Stand. Der Therapeut führt den 90° flektierten Arm passiv in horizontale Adduktion Richtung gegenüberliegende Schulter, mit leichtem Überdruck. Positiv bei Schmerz genau über dem AC-Gelenk; Schmerz hinten in der Schulter zählt nicht.", "position": "Sitz", "quellen": ["Hegedus 2012 – https://upload.orthobullets.com/journalclub/free_pdf/22773322_BrJSportsMed-2012-Hegedus-bjsports-2012-091066.pdf", "Chronopoulos 2004 – https://www.physiotutors.com/wiki/ac-joint-cluster/"]},"obrien":{"name": "O'Brien-Test (Active Compression)", "was": "AC-Gelenk oder SLAP-Läsion", "einheit": "positiv oder negativ", "kurz": "Arm 90° flektiert, 10-15° adduziert, innenrotiert; Widerstand nach kaudal, dann in Außenrotation wiederholen.", "ziel": "AC-Gelenk und Labrum superior provozieren.", "norm": ["Positiv bei Schmerz in Innenrotation, der in Außenrotation/Supination nachlässt; oben über AC = AC-Gelenk, tief innen = Labrum.", "SLAP: Sens. 67 %, Spez. 37 %, LR+ 1,06 (Hegedus 2012) - für SLAP kaum aussagekräftig.", "AC-Cluster (Cross-Body, AC-Resisted-Extension, O'Brien alle positiv): Sens. 25 %, Spez. 97 % (Chronopoulos 2004)."], "durch": "Stand oder Sitz. Arm 90° flektiert, 10-15° horizontal adduziert, Daumen nach unten. Der Patient hält gegen Druck des Therapeuten nach kaudal. Danach gleiche Prüfung mit Handfläche nach oben. Positiv, wenn die erste Position schmerzt und die zweite deutlich weniger.", "position": "Sitz", "quellen": ["Hegedus 2012 – https://upload.orthobullets.com/journalclub/free_pdf/22773322_BrJSportsMed-2012-Hegedus-bjsports-2012-091066.pdf", "Chronopoulos 2004 – https://www.physiotutors.com/wiki/ac-joint-cluster/"]},"ellbogenstreckung":{"name": "Ellbogen-Extensionstest", "was": "Fraktur nach Ellbogentrauma ausschließen", "einheit": "positiv oder negativ", "kurz": "Patient streckt den Ellbogen aktiv vollständig.", "ziel": "Knöcherne Verletzung nach Trauma ausschließen.", "norm": ["Positiv, wenn die volle Streckung nicht möglich ist; dann Röntgen.", "Sens. 96,8 %, Spez. 48,5 % (Appelboam 2008); negativ macht eine Fraktur unwahrscheinlich."], "durch": "Sitz, Schultern frei. Der Patient beugt beide Schultern auf 90° und streckt beide Ellbogen vollständig. Positiv bei fehlender voller Streckung im Seitenvergleich. Bei vollständiger Streckung kann bei sicherer klinischer Lage auf Röntgen verzichtet werden, Wiedervorstellung bei anhaltenden Beschwerden.", "position": "Sitz", "quellen": ["Appelboam 2008 – https://www.physiotutors.com/wiki/elbow-extension-test/"]},"hooktest":{"name": "Hook-Test", "was": "Distale Bizepssehnenruptur", "einheit": "positiv oder negativ", "kurz": "Ellbogen 90° gebeugt, Unterarm supiniert; mit dem Zeigefinger lateral unter die Bizepssehne haken.", "ziel": "Intakte distale Bizepssehne nachweisen.", "norm": ["Positiv, wenn sich die Sehne nicht von lateral unterhaken lässt.", "Sens. 100 %, Spez. 100 % (O'Driscoll 2007, n = 45); Sens. 81 %, Spez. 100 % (Devereaux 2013)."], "durch": "Sitz, Schulter abduziert, Ellbogen 90° gebeugt, Unterarm aktiv supiniert. Der Therapeut versucht mit dem Zeigefinger von lateral unter die gespannte distale Bizepssehne zu haken. Positiv, wenn keine Sehne tastbar ist und der Finger keine Struktur umgreift.", "position": "Sitz", "quellen": ["O'Driscoll 2007, Devereaux 2013 – https://www.physiotutors.com/wiki/hook-test/"]},"movingvalgus":{"name": "Moving-Valgus-Stresstest", "was": "Läsion des medialen Kollateralbandes (UCL)", "einheit": "positiv oder negativ", "kurz": "Valgusstress halten und den Ellbogen zügig von voller Beugung zur Streckung führen.", "ziel": "Mediale Bandinsuffizienz provozieren.", "norm": ["Positiv bei bekanntem medialen Schmerz, meist zwischen 120° und 70° Beugung.", "Sens. 100 %, Spez. 75 % (O'Driscoll 2005, n = 21)."], "durch": "Sitz oder Stand, Schulter 90° abduziert und maximal außenrotiert. Der Therapeut gibt konstanten Valgusstress und führt den Ellbogen schnell aus voller Flexion in Extension. Positiv bei Reproduktion des medialen Schmerzes im mittleren Bewegungsbogen.", "position": "Sitz", "quellen": ["O'Driscoll 2005 – https://www.physiotutors.com/wiki/moving-valgus-stress-test/"]},"lateralpivot":{"name": "Lateraler Pivot-Shift-Test", "was": "Posterolaterale Rotationsinstabilität des Ellbogens", "einheit": "positiv oder negativ", "kurz": "Supination, Valgus und axiale Kompression, dann Ellbogen aus Streckung beugen.", "ziel": "Posterolaterale Instabilität erkennen.", "norm": ["Positiv bei Apprehension, Subluxationsgefühl oder tastbarem Reponieren bei etwa 40° Beugung.", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Rückenlage, Arm über Kopf, Schulter außenrotiert. Der Therapeut supiniert den Unterarm, gibt Valgusstress und axiale Kompression und beugt den Ellbogen langsam aus der Streckung. Positiv bei Angst des Patienten oder spürbarem Zurückspringen des Radiuskopfes. Am wachen Patienten oft nur Apprehension auslösbar.", "position": "Rückenlage", "quellen": []},"cozen":{"name": "Cozen-Test", "was": "Laterale Epikondylopathie", "einheit": "positiv oder negativ", "kurz": "Faust, Handgelenkextension und Radialduktion gegen Widerstand bei gebeugtem Ellbogen.", "ziel": "Schmerz am lateralen Epikondylus provozieren.", "norm": ["Positiv bei bekanntem Schmerz am Epicondylus lateralis.", "Keine Sens./Spez. gelesen; Übereinstimmung mit Ultraschall Kappa 0,73-0,80 (Soares 2023)."], "durch": "Sitz, Ellbogen gebeugt, Unterarm proniert, Faust geschlossen. Der Patient extendiert das Handgelenk mit Radialduktion gegen Widerstand des Therapeuten, der den Epicondylus lateralis palpiert. Positiv bei bekanntem lateralem Ellbogenschmerz.", "position": "Sitz", "quellen": ["Soares 2023 – https://www.mdpi.com/1660-4601/20/3/1794"]},"mill":{"name": "Mill-Test", "was": "Laterale Epikondylopathie", "einheit": "positiv oder negativ", "kurz": "Handgelenk passiv flektieren, Unterarm pronieren, Ellbogen strecken.", "ziel": "Handgelenkextensoren dehnen und Schmerz provozieren.", "norm": ["Positiv bei bekanntem Schmerz am Epicondylus lateralis.", "Keine Sens./Spez. gelesen; Übereinstimmung mit Ultraschall Kappa 0,82-1,0 (Soares 2023)."], "durch": "Sitz. Der Therapeut palpiert den lateralen Epikondylus, proniert den Unterarm, flektiert das Handgelenk passiv voll und streckt dann langsam den Ellbogen. Positiv bei bekanntem lateralem Schmerz.", "position": "Sitz", "quellen": ["Soares 2023 – https://www.mdpi.com/1660-4601/20/3/1794"]},"maudsley":{"name": "Maudsley-Test", "was": "Laterale Epikondylopathie (M. extensor digitorum)", "einheit": "positiv oder negativ", "kurz": "Streckung des Mittelfingers gegen Widerstand bei gestrecktem Ellbogen.", "ziel": "Schmerz am lateralen Epikondylus provozieren.", "norm": ["Positiv bei bekanntem Schmerz am Epicondylus lateralis.", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Sitz, Ellbogen gestreckt, Unterarm proniert. Der Patient streckt den Mittelfinger gegen Widerstand des Therapeuten am Grundglied. Positiv bei bekanntem lateralem Ellbogenschmerz.", "position": "Sitz", "quellen": []},"medialepi":{"name": "Test Epicondylopathia medialis", "was": "Mediale Epikondylopathie (Golferellbogen)", "einheit": "positiv oder negativ", "kurz": "Handgelenkflexion und Pronation gegen Widerstand bei gestrecktem Ellbogen.", "ziel": "Schmerz am medialen Epikondylus provozieren.", "norm": ["Positiv bei bekanntem Schmerz am Epicondylus medialis.", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Sitz, Ellbogen gestreckt, Unterarm supiniert. Der Patient beugt das Handgelenk und proniert gegen Widerstand des Therapeuten, der den medialen Epikondylus palpiert. Alternativ passive Dehnung in Handgelenkextension und Supination. Positiv bei bekanntem medialem Schmerz.", "position": "Sitz", "quellen": []},"ulnarisdruck":{"name": "Druckprovokationstest Kubitaltunnel", "was": "Kubitaltunnelsyndrom (N. ulnaris)", "einheit": "positiv oder negativ", "kurz": "Ellbogen 20° gebeugt, Unterarm supiniert; Druck auf den N. ulnaris proximal des Kubitaltunnels für 60 s.", "ziel": "Kompression des N. ulnaris nachweisen.", "norm": ["Positiv bei Kribbeln oder Taubheit im Versorgungsgebiet des N. ulnaris.", "30 s: Sens. 55 %, Spez. 98 %; 60 s: Sens. 89 % (Novak 1994)."], "durch": "Sitz, Ellbogen 20° gebeugt, Unterarm supiniert. Der Therapeut drückt mit Zeige- und Mittelfinger auf den N. ulnaris knapp proximal des Kubitaltunnels, bis zu 60 Sekunden. Beide Seiten testen. Positiv bei Parästhesien im 4. und 5. Finger.", "position": "Sitz", "quellen": ["Novak 1994 – https://www.physiotutors.com/wiki/pressure-provocation-test"]},"ellbeugetest":{"name": "Ellbogen-Flexionstest", "was": "Kubitaltunnelsyndrom (N. ulnaris)", "einheit": "positiv oder negativ", "kurz": "Ellbogen maximal beugen, Handgelenk extendiert, bis 60 s halten.", "ziel": "Kubitaltunnelsyndrom durch Dehnung/Kompression provozieren.", "norm": ["Positiv bei Parästhesien im Versorgungsgebiet des N. ulnaris.", "Einzelkennwerte nicht gelesen; Novak 1994 untersuchte ihn zusammen mit dem Druckprovokationstest."], "durch": "Sitz. Der Patient beugt den Ellbogen maximal, Unterarm supiniert, Handgelenk extendiert, und hält bis zu 60 Sekunden. Positiv bei Kribbeln oder Taubheit im 4. und 5. Finger.", "position": "Sitz", "quellen": ["Novak 1994 – https://www.physiotutors.com/wiki/pressure-provocation-test"]},"tabatiere":{"name": "Druckschmerz Tabatière", "was": "Skaphoidfraktur", "einheit": "positiv oder negativ", "kurz": "Tabatière zwischen den Sehnen des EPL und EPB palpieren.", "ziel": "Skaphoidfraktur nach Sturz erkennen.", "norm": ["Positiv bei Druckschmerz in der Tabatière im Seitenvergleich.", "Sens. 100 %, Spez. 19 % (Parvizi 1998); Sens. 87 %, Spez. 38 % (Waizenegger 1994). Kombination Tabatière + axiale Kompression + Tuberculum: Sens. 100 %, Spez. 74 % (Parvizi 1998)."], "durch": "Sitz, Hand in Neutralstellung, leichte Ulnarduktion. Der Therapeut palpiert die Grube zwischen den Sehnen des M. extensor pollicis longus und brevis. Positiv bei deutlichem Druckschmerz. Bei Verdacht ärztliche Abklärung, Bildgebung.", "position": "Sitz", "quellen": ["Parvizi 1998, Chen 1989, Waeckerle 1987 (BestBETs) – https://www.bestbets.org/?p=5060"]},"tuberculumscaphoidei":{"name": "Druckschmerz Tuberculum ossis scaphoidei", "was": "Skaphoidfraktur", "einheit": "positiv oder negativ", "kurz": "Tuberculum scaphoidei palmar an der distalen Handgelenksfalte palpieren.", "ziel": "Skaphoidfraktur erkennen.", "norm": ["Positiv bei Druckschmerz am Tuberculum im Seitenvergleich.", "Sens. 100 %, Spez. 30 % (Parvizi 1998)."], "durch": "Sitz, Handgelenk leicht extendiert. Der Therapeut palpiert palmar radial an der distalen Beugefalte das Tuberculum ossis scaphoidei. Positiv bei Druckschmerz.", "position": "Sitz", "quellen": ["Parvizi 1998, Chen 1989, Waeckerle 1987 (BestBETs) – https://www.bestbets.org/?p=5060"]},"scaphoidkompression":{"name": "Axiale Daumenkompression", "was": "Skaphoidfraktur", "einheit": "positiv oder negativ", "kurz": "Axialen Druck über den Daumen-Längsstrahl Richtung Skaphoid geben.", "ziel": "Skaphoidfraktur erkennen.", "norm": ["Positiv bei Schmerz im Bereich des Skaphoids.", "Sens. 70,5 %, Spez. 91 % (Chen 1989)."], "durch": "Sitz. Der Therapeut fasst den Daumen und gibt über das erste Metakarpale axialen Druck nach proximal. Positiv bei Schmerz im radialen Handgelenk/Skaphoid.", "position": "Sitz", "quellen": ["Parvizi 1998, Chen 1989, Waeckerle 1987 (BestBETs) – https://www.bestbets.org/?p=5060"]},"schuettelzeichen":{"name": "Schüttelzeichen (Flick Sign)", "was": "Karpaltunnelsyndrom", "einheit": "positiv oder negativ", "kurz": "Fragen, ob Schütteln der Hand die Beschwerden lindert.", "ziel": "Typisches KTS-Symptom erfassen.", "norm": ["Positiv, wenn Schütteln oder Ausschlagen der Hand Kribbeln/Taubheit lindert.", "Teil der Prädiktionsregel nach Wainner 2005 (Kennwerte siehe Cluster)."], "durch": "Sitz. Der Patient wird gefragt bzw. zeigt, ob Schütteln der Hand die nächtlichen oder belastungsabhängigen Beschwerden bessert. Positiv bei klarer Linderung.", "position": "Sitz", "quellen": ["Wainner 2005 – https://www.physiotutors.com/wiki/carpal-tunnel-syndrome-cluster/"]},"phalen":{"name": "Phalen-Test", "was": "Karpaltunnelsyndrom", "einheit": "positiv oder negativ", "kurz": "Handrücken aneinander, Handgelenke maximal flektiert, 60 s halten.", "ziel": "N. medianus im Karpaltunnel provozieren.", "norm": ["Positiv bei Kribbeln oder Taubheit im Medianusgebiet innerhalb von 60 s.", "LR+ 2,68, LR- 0,54 (Valdes 2013); Aussagekraft gering."], "durch": "Sitz. Der Patient legt die Handrücken aneinander, sodass beide Handgelenke maximal flektiert sind, und hält 60 Sekunden. Positiv bei Parästhesien in Daumen, Zeige-, Mittelfinger und radialem Ringfinger.", "position": "Sitz", "quellen": ["Valdes 2013 – https://www.physiotutors.com/wiki/phalens-test/"]},"tinelhandgelenk":{"name": "Tinel-Zeichen Karpaltunnel", "was": "Karpaltunnelsyndrom", "einheit": "positiv oder negativ", "kurz": "Über dem Karpaltunnel auf den N. medianus klopfen.", "ziel": "Mechanosensibilität des N. medianus prüfen.", "norm": ["Positiv bei Kribbeln in das Versorgungsgebiet des N. medianus.", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Sitz, Handgelenk leicht extendiert. Der Therapeut klopft mit Finger oder Reflexhammer palmar über dem Karpaltunnel. Positiv bei elektrisierendem Kribbeln in die radialen Finger.", "position": "Sitz", "quellen": []},"durkan":{"name": "Karpalkompressionstest (Durkan)", "was": "Karpaltunnelsyndrom", "einheit": "positiv oder negativ", "kurz": "Daumendruck direkt über dem Karpaltunnel für bis zu 30 s.", "ziel": "Kompression des N. medianus provozieren.", "norm": ["Positiv bei Kribbeln oder Taubheit im Medianusgebiet.", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Sitz, Unterarm supiniert, Handgelenk neutral. Der Therapeut drückt mit beiden Daumen gleichmäßig auf den Karpaltunnel, bis zu 30 Sekunden. Positiv bei Parästhesien im Medianusgebiet.", "position": "Sitz", "quellen": []},"whattest":{"name": "WHAT-Test", "was": "Tendovaginitis de Quervain", "einheit": "positiv oder negativ", "kurz": "Handgelenk maximal flektiert, Daumen gestreckt und abduziert halten gegen Widerstand.", "ziel": "de-Quervain-Tendovaginitis erkennen.", "norm": ["Positiv bei Schmerz am ersten Strecksehnenfach während des Widerstands.", "Sens. 99 %, Spez. 29 % gegen Ultraschall (Goubau 2014)."], "durch": "Sitz. Der Patient flektiert das Handgelenk maximal (bis zur Schmerzgrenze) und hält den Daumen gestreckt und abduziert. Der Therapeut gibt zunehmend Widerstand gegen die Abduktion. Positiv bei Schmerz über dem ersten Strecksehnenfach.", "position": "Sitz", "quellen": ["Goubau 2014 – https://www.physiotutors.com/wiki/what-test/"]},"finkelstein":{"name": "Finkelstein-Test", "was": "Tendovaginitis de Quervain", "einheit": "positiv oder negativ", "kurz": "Daumen passiv fassen und Handgelenk nach ulnar duzieren.", "ziel": "Sehnen des ersten Strecksehnenfachs dehnen.", "norm": ["Positiv bei Schmerz über dem Processus styloideus radii/erstem Strecksehnenfach.", "Keine Sens./Spez. gelesen. Die Variante nach Eichhoff (Daumen in der Faust) gilt als stark provozierend mit vielen falsch Positiven (Physiotutors)."], "durch": "Sitz, Unterarm in Neutralstellung. Der Therapeut fasst den Daumen und führt das Handgelenk passiv in Ulnarduktion. Positiv bei bekanntem Schmerz radial am Handgelenk; Seitenvergleich.", "position": "Sitz", "quellen": ["Goubau 2014 – https://www.physiotutors.com/wiki/what-test/"]},"foveazeichen":{"name": "Ulnares Foveazeichen", "was": "Läsion des TFCC oder ulnotriquetralen Bandes", "einheit": "positiv oder negativ", "kurz": "Druck in die Fovea ulnaris zwischen Processus styloideus ulnae und FCU-Sehne.", "ziel": "Ulnare Handgelenkverletzung (TFCC) erkennen.", "norm": ["Positiv, wenn der Druck den bekannten ulnaren Schmerz auslöst, im Seitenvergleich.", "Sens. 95,2 %, Spez. 86,5 % gegen Arthroskopie, n = 272 (Tay 2007)."], "durch": "Sitz, Unterarm in Neutralrotation. Der Therapeut drückt mit dem Daumen in die weiche Stelle zwischen Processus styloideus ulnae, Sehne des M. flexor carpi ulnaris und Os pisiforme. Positiv bei bekanntem Schmerz. Unterscheidet nicht zwischen foveolärer TFCC-Läsion und ulnotriquetralem Band.", "position": "Sitz", "quellen": ["Tay 2007 – https://www.patientcareonline.com/view/ulnar-fovea-test-unlocks-tricky-wrist-pain-diagnosis"]},"watson":{"name": "Watson-Test (Scaphoid-Shift)", "was": "Skapholunäre Instabilität", "einheit": "positiv oder negativ", "kurz": "Daumen auf Tuberculum scaphoidei, Handgelenk von ulnar nach radial führen.", "ziel": "Skapholunäre Bandläsion erkennen.", "norm": ["Positiv bei schmerzhaftem Klunk oder dorsaler Subluxation des Skaphoids, die beim Lösen zurückspringt.", "Spezifität 96 % bei Gesunden; Sensitivität nicht bestimmt (Golubev 2023)."], "durch": "Sitz, Unterarm leicht proniert. Der Therapeut drückt mit dem Daumen palmar auf das Tuberculum ossis scaphoidei und führt das Handgelenk aus Ulnarduktion in Radialduktion. Positiv bei Schmerz dorsal und spürbarem Klunk beim Lösen des Daumens. Seitenvergleich, da auch Gesunde ein Schnappen zeigen können.", "position": "Sitz", "quellen": ["Golubev 2023 – https://journals.rcsi.science/0869-8678/article/view/254209"]},"fdptest":{"name": "FDP-Test (tiefe Beugesehne)", "was": "Ruptur der tiefen Fingerbeugesehne", "einheit": "positiv oder negativ", "kurz": "Mittelglied fixieren, Patient beugt das Endglied.", "ziel": "Funktion des M. flexor digitorum profundus prüfen.", "norm": ["Positiv, wenn das Endgelenk bei fixiertem Mittelglied nicht aktiv gebeugt werden kann.", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Sitz, Hand supiniert auf der Unterlage. Der Therapeut fixiert das Mittelglied in Streckung, der Patient beugt das Endgelenk. Positiv bei fehlender aktiver DIP-Flexion (z. B. Jersey Finger).", "position": "Sitz", "quellen": []},"fdstest":{"name": "FDS-Test (oberflächliche Beugesehne)", "was": "Ruptur der oberflächlichen Fingerbeugesehne", "einheit": "positiv oder negativ", "kurz": "Nachbarfinger in Streckung halten, Patient beugt den Testfinger im Mittelgelenk.", "ziel": "Funktion des M. flexor digitorum superficialis isoliert prüfen.", "norm": ["Positiv, wenn das Mittelgelenk bei gehaltenen Nachbarfingern nicht aktiv gebeugt werden kann.", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Sitz, Hand supiniert. Der Therapeut hält alle anderen Finger in voller Streckung (blockiert so die tiefe Beugesehne), der Patient beugt den Testfinger. Positiv bei fehlender aktiver PIP-Flexion. Am Kleinfinger kann der FDS physiologisch schwach sein.", "position": "Sitz", "quellen": []},"elson":{"name": "Elson-Test", "was": "Ruptur des Tractus intermedius (Central Slip)", "einheit": "positiv oder negativ", "kurz": "PIP 90° über die Tischkante gebeugt, Mittelglied gegen Widerstand strecken.", "ziel": "Frühe Ruptur des Mittelzügels vor Knopflochdeformität erkennen.", "norm": ["Positiv, wenn das Mittelgelenk nicht gestreckt werden kann und das Endgelenk dabei steif in Streckung geht.", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Sitz, Finger über eine Tischkante, PIP 90° gebeugt. Der Patient streckt das Mittelglied gegen Widerstand des Therapeuten. Normal: Streckkraft im PIP, DIP bleibt locker. Positiv: keine Streckkraft im PIP, DIP wird steif gestreckt.", "position": "Sitz", "quellen": ["ALiEM 2018 – https://www.aliem.com/elsons-test/"]},"pipseitenband":{"name": "Seitenbandtest Fingermittelgelenk", "was": "Läsion Kollateralband PIP", "einheit": "positiv oder negativ", "kurz": "Grundglied fixieren, Varus- und Valgusstress im PIP in Streckung und leichter Beugung.", "ziel": "Seitenbandstabilität der Fingergelenke prüfen.", "norm": ["Positiv bei vermehrter Aufklappbarkeit oder Schmerz im Seitenvergleich.", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Sitz. Der Therapeut fixiert das Grundglied und gibt über das Mittelglied radialen und ulnaren Stress, in voller Streckung und in etwa 30° Beugung. Positiv bei Aufklappbarkeit im Vergleich zum gleichen Finger der Gegenseite oder bei lokalem Schmerz.", "position": "Sitz", "quellen": []},"ucldaumen":{"name": "Valgusstresstest Daumengrundgelenk", "was": "Ruptur ulnares Seitenband Daumen (Skidaumen)", "einheit": "positiv oder negativ", "kurz": "Daumen-MCP in Streckung und 30° Beugung nach radial aufklappen.", "ziel": "Ulnare Seitenbandruptur am Daumengrundgelenk erkennen.", "norm": ["Positiv bei deutlich vermehrter Aufklappbarkeit oder fehlendem festen Endpunkt im Seitenvergleich.", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Sitz. Der Therapeut fixiert das erste Metakarpale und gibt über das Grundglied radial gerichteten Stress, einmal in Streckung und einmal in etwa 30° MCP-Beugung. Positiv bei vermehrter Aufklappbarkeit ohne festen Stopp. Bei Verdacht auf Fraktur vorher Röntgen.", "position": "Sitz", "quellen": []},"cmcgrind":{"name": "Grind-Test Daumensattelgelenk", "was": "Rhizarthrose (Daumensattelgelenk-Arthrose)", "einheit": "positiv oder negativ", "kurz": "Axiale Kompression des ersten Metakarpale mit gleichzeitiger Rotation.", "ziel": "Arthrotische Veränderungen im Daumensattelgelenk provozieren.", "norm": ["Positiv bei Schmerz oder Krepitation im Daumensattelgelenk.", "Sens. 30-53 %, Spez. 80-97 % in Einzelstudien (zusammengestellt bei Model 2016)."], "durch": "Sitz. Der Therapeut fixiert das Trapezium und gibt über das erste Metakarpale axialen Druck mit Rotation. Positiv bei bekanntem Schmerz oder Reiben an der Daumenbasis.", "position": "Sitz", "quellen": ["Model 2016 – https://www.physio-pedia.com/Thumb_CMC_Grind_Test"]},"einbeinstand30":{"name": "Einbeinstand 30 Sekunden", "was": "Gluteale Tendinopathie (laterale Hüftschmerzen)", "einheit": "positiv oder negativ", "kurz": "Auf dem betroffenen Bein bis 30 s stehen, Finger leicht an der Wand.", "ziel": "Gluteale Tendinopathie durch Belastung provozieren.", "norm": ["Positiv bei lateralem Hüftschmerz über dem Trochanter von mindestens 2/10 innerhalb von 30 s.", "Sens. 100 %, Spez. 97,3 % (Lequesne 2008); Sens. 38 %, Spez. 100 % gegen MRT (Grimaldi 2017)."], "durch": "Stand neben einer Wand, betroffenes Bein wandfern. Ein Finger berührt zur Balance die Wand. Das andere Knie wird 90° angehoben, die Hüfte bleibt neutral, bis zu 30 Sekunden halten. Positiv bei bekanntem Schmerz über dem Trochanter major ab 2/10.", "position": "Stand", "quellen": ["Lequesne 2008, Grimaldi 2017 – https://www.physiotutors.com/wiki/single-leg-stance-test/"]},"trendelenburg":{"name": "Trendelenburg-Zeichen", "was": "Insuffizienz der Hüftabduktoren", "einheit": "positiv oder negativ", "kurz": "Einbeinstand beobachten, Becken auf der Spielbeinseite.", "ziel": "Schwäche der Hüftabduktoren erkennen.", "norm": ["Positiv, wenn das Becken auf der Spielbeinseite absinkt oder der Rumpf ausweicht.", "Gluteale Pathologie: Sens. 61 %, Spez. 92 %, LR+ 6,83 (gepoolt, 3 Studien); Hüftarthrose: Sens. 55 %, Spez. 70 % (Reiman 2015)."], "durch": "Stand. Der Patient steht etwa 30 Sekunden auf dem Testbein. Der Therapeut beobachtet das Becken von hinten. Positiv bei Absinken des Beckens zur Gegenseite (Trendelenburg) oder Rumpfneigung zur Standbeinseite (Duchenne).", "position": "Stand", "quellen": ["Reiman 2015 – https://bjsm.bmj.com/content/49/6/357.full"]},"hockschmerz":{"name": "Schmerz bei tiefer Hocke", "was": "Hüftarthrose (Sutlive-Kriterium)", "einheit": "positiv oder negativ", "kurz": "Patient geht in die tiefe Hocke.", "ziel": "Belastungsschmerz des Hüftgelenks erfassen.", "norm": ["Positiv bei bekanntem Hüftschmerz in der Hocke.", "Kriterium der Prädiktionsregel nach Sutlive 2008 (Kennwerte siehe Cluster)."], "durch": "Stand. Der Patient geht so tief wie möglich in die Hocke, Fersen möglichst am Boden. Positiv bei bekanntem Leisten- oder Hüftschmerz.", "position": "Stand", "quellen": ["Sutlive 2008 – https://www.physiotutors.com/wiki/cluster-of-sutlive/"]},"hueftflexionaktiv":{"name": "Aktive Hüftflexion mit lateralem Schmerz", "was": "Hüftarthrose (Sutlive-Kriterium)", "einheit": "positiv oder negativ", "kurz": "Patient beugt die Hüfte aktiv maximal.", "ziel": "Bewegungsschmerz des Hüftgelenks erfassen.", "norm": ["Positiv bei lateralem Hüftschmerz während aktiver Flexion.", "Kriterium der Prädiktionsregel nach Sutlive 2008 (Kennwerte siehe Cluster)."], "durch": "Rückenlage. Der Patient zieht das Knie aktiv so weit wie möglich zur Brust. Positiv bei Schmerz an der lateralen Hüfte.", "position": "Rückenlage", "quellen": ["Sutlive 2008 – https://www.physiotutors.com/wiki/cluster-of-sutlive/"]},"irpassiv":{"name": "Passive Hüftinnenrotation ≤ 25°", "was": "Hüftarthrose (Sutlive-Kriterium)", "einheit": "positiv oder negativ", "kurz": "Passive Innenrotation in 90° Hüft- und Knieflexion messen.", "ziel": "Kapselmuster der Hüfte erfassen.", "norm": ["Positiv, wenn die passive Innenrotation 25° oder weniger beträgt.", "Kriterium der Prädiktionsregel nach Sutlive 2008 (Kennwerte siehe Cluster)."], "durch": "Rückenlage, Hüfte und Knie 90° gebeugt. Der Therapeut führt das Bein passiv in Innenrotation bis zum Bewegungsende und misst mit dem Goniometer. Positiv bei 25° oder weniger.", "position": "Rückenlage", "quellen": ["Sutlive 2008 – https://www.physiotutors.com/wiki/cluster-of-sutlive/"]},"scour":{"name": "Scour-Test", "was": "Hüftarthrose, intraartikuläre Pathologie", "einheit": "positiv oder negativ", "kurz": "Hüfte gebeugt und adduziert, axialer Druck über das Knie bei kreisender Bewegung.", "ziel": "Intraartikulären Hüftschmerz provozieren.", "norm": ["Positiv bei Leistenschmerz (bei Sutlive in Adduktion gewertet).", "Kriterium der Prädiktionsregel nach Sutlive 2008 (Kennwerte siehe Cluster)."], "durch": "Rückenlage, Hüfte etwa 90° gebeugt. Der Therapeut gibt axialen Druck über das Knie in den Femur und bewegt die Hüfte kreisend von Adduktion in Abduktion. Positiv bei bekanntem Leistenschmerz, besonders in Adduktion.", "position": "Rückenlage", "quellen": ["Sutlive 2008 – https://www.physiotutors.com/wiki/cluster-of-sutlive/"]},"fadir":{"name": "FADIR-Test", "was": "Femoroazetabuläres Impingement, Labrumläsion", "einheit": "positiv oder negativ", "kurz": "Hüfte 90° flektieren, dann adduzieren und innenrotieren.", "ziel": "FAI oder Labrumläsion ausschließen helfen.", "norm": ["Positiv bei bekanntem Leistenschmerz.", "Gepoolte Sens. 99 %, Spez. 5 % (Reiman 2015); gegen Arthroskopie Sens. 99 %, Spez. 7 %, LR- 0,15. Negativ spricht gegen FAI, positiv beweist nichts."], "durch": "Rückenlage. Der Therapeut flektiert Hüfte und Knie auf 90°, führt dann in Adduktion und Innenrotation bis zum Bewegungsende. Positiv bei Reproduktion des bekannten Leistenschmerzes.", "position": "Rückenlage", "quellen": ["Reiman 2015 – https://www.physiotutors.com/wiki/faddir-test/", "Reiman 2015 – https://bjsm.bmj.com/content/49/6/357.full"]},"faber":{"name": "FABER-Test (Patrick)", "was": "Hüft- oder ISG-Pathologie", "einheit": "positiv oder negativ", "kurz": "Ferse aufs gegenseitige Knie (Viererzeichen), Knie Richtung Liege drücken.", "ziel": "Hüftgelenk und ISG provozieren und Beweglichkeit vergleichen.", "norm": ["Positiv bei Leistenschmerz (Hüfte) oder Schmerz im ISG-Bereich (ISG) oder deutlicher Seitendifferenz.", "ISG-Schmerz: Sens. 50 %, Spez. 56 % (Schneider 2020); Interrater-Reliabilität Kappa 0,47 (Sutlive 2008)."], "durch": "Rückenlage. Die Ferse des Testbeins liegt auf dem gegenseitigen Knie. Der Therapeut fixiert die gegenseitige SIAS und drückt das Knie des Testbeins Richtung Liege. Positiv bei bekanntem Schmerz; Lokalisation notieren (Leiste vs. ISG).", "position": "Rückenlage", "quellen": ["Schneider 2020 – https://www.physiotutors.com/wiki/patricks-test/"]},"fader":{"name": "FADER-R-Test", "was": "Gluteale Tendinopathie", "einheit": "positiv oder negativ", "kurz": "Hüfte 90° flektiert, adduziert, außenrotiert; dann Innenrotation gegen Widerstand.", "ziel": "Gluteale Sehnen durch Kompression und Spannung provozieren.", "norm": ["Positiv bei lateralem Hüftschmerz über dem Trochanter von mindestens 2/10.", "FADER: Sens. 30 %, Spez. 86,7 %; FADER-R: Sens. 44 %, Spez. 93,3 % gegen MRT (Grimaldi 2017)."], "durch": "Rückenlage. Der Therapeut flektiert die Hüfte auf 90°, adduziert und rotiert sie nach außen bis zum Ende. Danach drückt der Patient isometrisch in Innenrotation gegen Widerstand. Positiv bei bekanntem lateralem Schmerz.", "position": "Rückenlage", "quellen": ["Grimaldi 2017 – https://www.physiotutors.com/wiki/fader-test/"]},"thomas":{"name": "Thomas-Test", "was": "Verkürzung der Hüftbeuger, Hüftpathologie", "einheit": "positiv oder negativ", "kurz": "Ein Knie zur Brust ziehen, das andere Bein hängt entspannt; Abheben des Oberschenkels beobachten.", "ziel": "Hüftflexionskontraktur erkennen.", "norm": ["Positiv, wenn der Oberschenkel des gestreckten Beins von der Liege abhebt.", "Sens. 89 %, Spez. 92 %, LR+ 11,1 (Einzelstudie, zit. in Reiman 2015) - mit Vorsicht verwenden."], "durch": "Rückenlage am Liegenende. Der Patient zieht ein Knie an die Brust, bis die LWS flach aufliegt. Das andere Bein hängt frei. Positiv, wenn der Oberschenkel abhebt (M. iliopsoas) oder das Knie sich streckt (M. rectus femoris).", "position": "Rückenlage", "quellen": ["Reiman 2015 – https://bjsm.bmj.com/content/49/6/357.full"]},"hueftextensionaktiv":{"name": "Aktive Hüftextension schmerzhaft", "was": "Hüftarthrose (Sutlive-Kriterium)", "einheit": "positiv oder negativ", "kurz": "In Bauchlage das gestreckte Bein aktiv anheben.", "ziel": "Bewegungsschmerz des Hüftgelenks erfassen.", "norm": ["Positiv bei bekanntem Hüftschmerz während aktiver Extension.", "Kriterium der Prädiktionsregel nach Sutlive 2008 (Kennwerte siehe Cluster)."], "durch": "Bauchlage. Der Patient hebt das gestreckte Bein aktiv von der Liege. Positiv bei bekanntem Schmerz in Hüfte oder Leiste.", "position": "Bauchlage", "quellen": ["Sutlive 2008 – https://www.physiotutors.com/wiki/cluster-of-sutlive/"]},"ottawaknie":{"name": "Ottawa Knee Rules", "was": "Fraktur nach Knietrauma ausschließen", "einheit": "positiv oder negativ", "kurz": "Fünf Kriterien prüfen: Alter ab 55, isolierter Patelladruckschmerz, Fibulakopf-Druckschmerz, Flexion unter 90°, keine 4 Schritte möglich.", "ziel": "Röntgenbedarf nach akutem Knietrauma bestimmen.", "norm": ["Positiv, wenn mindestens ein Kriterium zutrifft; dann Röntgen.", "Sens. 98,5 %, Spez. 48,6 %, LR- 0,03 (Bachmann 2004)."], "durch": "Stand und Rückenlage. Abgefragt bzw. geprüft werden: Alter ab 55, isolierter Druckschmerz der Patella, Druckschmerz am Fibulakopf, aktive Flexion unter 90°, Unfähigkeit, direkt nach dem Unfall und bei der Untersuchung 4 Schritte zu gehen. Ein zutreffendes Kriterium reicht für Röntgen.", "position": "Stand", "quellen": ["Bachmann 2004 – https://book.physiotutors.com/?p=125"]},"tanzendepatella":{"name": "Tanzende Patella / Erguss-Test", "was": "Kniegelenkerguss", "einheit": "positiv oder negativ", "kurz": "Recessus suprapatellaris ausstreichen, Patella nach dorsal drücken.", "ziel": "Intraartikulären Erguss erkennen.", "norm": ["Positiv, wenn die Patella spürbar auf den Femur aufschlägt und zurückfedert.", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Rückenlage, Knie gestreckt, Muskulatur entspannt. Der Therapeut streicht mit einer Hand den Recessus suprapatellaris nach distal aus und drückt mit der anderen die Patella nach dorsal. Positiv bei federndem Anschlagen der Patella. Kleine Ergüsse eher mit dem Ausstreichtest (Wischtest) erfassen.", "position": "Rückenlage", "quellen": []},"thessaly":{"name": "Thessaly-Test", "was": "Meniskusläsion", "einheit": "positiv oder negativ", "kurz": "Einbeinstand mit 20° Knieflexion, Rumpf dreimal nach innen und außen rotieren.", "ziel": "Meniskusläsion unter Belastung provozieren.", "norm": ["Positiv bei Gelenkspaltschmerz oder Blockierungs-/Schnappgefühl.", "20° Flexion: Sens. 75 %, Spez. 87 % (Smith 2015, gepoolt)."], "durch": "Stand auf dem Testbein, Knie 20° gebeugt, der Therapeut hält beide Hände des Patienten. Der Patient dreht Knie und Körper dreimal nach innen und außen. Zuerst das gesunde Bein testen. Positiv bei Schmerz im Gelenkspalt oder Blockierungsgefühl.", "position": "Stand", "quellen": ["Smith 2015 – https://ebm.bmj.com/content/20/3/88"]},"gelenkspalt":{"name": "Druckschmerz Gelenkspalt", "was": "Meniskusläsion", "einheit": "positiv oder negativ", "kurz": "Medialen und lateralen Gelenkspalt bei gebeugtem Knie palpieren.", "ziel": "Meniskusläsion lokalisieren.", "norm": ["Positiv bei Druckschmerz im medialen oder lateralen Gelenkspalt.", "Sens. 83 %, Spez. 83 % (Smith 2015, gepoolt)."], "durch": "Rückenlage oder Sitz, Knie etwa 90° gebeugt. Der Therapeut palpiert den medialen und lateralen Gelenkspalt von ventral nach dorsal. Positiv bei bekanntem, lokalem Druckschmerz.", "position": "Rückenlage", "quellen": ["Smith 2015 – https://ebm.bmj.com/content/20/3/88"]},"valgusstress":{"name": "Valgusstresstest Knie", "was": "Läsion des medialen Kollateralbandes", "einheit": "positiv oder negativ", "kurz": "Valgusstress in voller Streckung und in 20-30° Beugung.", "ziel": "Mediale Bandstabilität prüfen.", "norm": ["Positiv bei vermehrter medialer Aufklappbarkeit oder Schmerz; Aufklappbarkeit in Streckung spricht für zusätzliche Kapsel-/Kreuzbandläsion.", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Rückenlage. Der Therapeut fixiert den Oberschenkel, gibt am distalen Unterschenkel Valgusstress und palpiert den medialen Gelenkspalt. Zuerst in 20-30° Flexion, dann in voller Streckung. Seitenvergleich.", "position": "Rückenlage", "quellen": []},"varusstress":{"name": "Varusstresstest Knie", "was": "Läsion des lateralen Kollateralbandes", "einheit": "positiv oder negativ", "kurz": "Varusstress in voller Streckung und in 20-30° Beugung.", "ziel": "Laterale Bandstabilität prüfen.", "norm": ["Positiv bei vermehrter lateraler Aufklappbarkeit oder Schmerz im Seitenvergleich.", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Rückenlage. Der Therapeut fixiert den Oberschenkel, gibt am distalen Unterschenkel Varusstress und palpiert den lateralen Gelenkspalt. In 20-30° Flexion und in voller Streckung. Seitenvergleich.", "position": "Rückenlage", "quellen": []},"hinteresag":{"name": "Hinteres Schubladenzeichen in Ruhe (Sag Sign)", "was": "Ruptur des hinteren Kreuzbandes", "einheit": "positiv oder negativ", "kurz": "Hüfte und Knie 90° gebeugt, Tibiaplateau von der Seite beobachten.", "ziel": "Spontane hintere Tibiasubluxation erkennen.", "norm": ["Positiv, wenn die Tibia im Vergleich zur Gegenseite nach dorsal durchhängt.", "Keine eigenen Kennwerte gelesen; verbessert laut EBM Consult die Treffsicherheit der hinteren Schublade."], "durch": "Rückenlage, Hüften und Knie beidseits 90° gebeugt, Unterschenkel unterstützt oder Füße aufgestellt (45°). Der Therapeut vergleicht die Kontur der Tuberositas tibiae von der Seite. Positiv bei sichtbarem Durchhängen. Vor der vorderen Schublade prüfen, sonst wird eine hintere Instabilität als vordere fehlgedeutet.", "position": "Rückenlage", "quellen": ["Rubinstein 1994 – https://ebmconsult.com/articles/physical-exam-posterior-drawer-test"]},"hintereschublade":{"name": "Hintere Schublade", "was": "Ruptur des hinteren Kreuzbandes", "einheit": "positiv oder negativ", "kurz": "Knie 90° gebeugt, Fuß fixiert, Tibia nach dorsal schieben.", "ziel": "Hintere Kreuzbandstabilität prüfen.", "norm": ["Positiv bei vermehrter dorsaler Verschiebung der Tibia ohne festen Anschlag.", "Sens. 90 %, Spez. 99 %, LR+ 90, LR- 0,1 (Rubinstein 1994, n = 39)."], "durch": "Rückenlage, Hüfte 45°, Knie 90° gebeugt, Fuß fixiert. Der Therapeut umfasst den proximalen Unterschenkel und schiebt die Tibia nach dorsal. Positiv bei vermehrter Translation und weichem Endgefühl im Seitenvergleich.", "position": "Rückenlage", "quellen": ["Rubinstein 1994 – https://ebmconsult.com/articles/physical-exam-posterior-drawer-test"]},"leversign":{"name": "Lever-Sign-Test (Lelli)", "was": "Ruptur des vorderen Kreuzbandes", "einheit": "positiv oder negativ", "kurz": "Faust unter proximalen Unterschenkel, Druck auf distalen Oberschenkel, Ferse beobachten.", "ziel": "VKB-Ruptur auch bei abwehrgespanntem Patienten erkennen.", "norm": ["Positiv, wenn die Ferse bei Druck auf den Oberschenkel nicht von der Liege abhebt.", "Sens. 0,77, Spez. 0,90, LR+ 6,6, LR- 0,22 (Metaanalyse 2019, zit. nach Physiotutors); Sens. 61,2 % in akuter Skiunfall-Kohorte (Bucher 2022)."], "durch": "Rückenlage, Bein gestreckt. Der Therapeut legt eine Faust unter das proximale Drittel des Unterschenkels und drückt mit der anderen Hand auf das distale Drittel des Oberschenkels. Bei intaktem VKB hebt die Ferse ab. Positiv, wenn die Ferse liegen bleibt.", "position": "Rückenlage", "quellen": ["Metaanalyse 2019 (zit. nach Physiotutors) – https://www.physiotutors.com/research/lever-sign-test-for-acl-tears/"]},"ottawafuss":{"name": "Ottawa Ankle Rules", "was": "Fraktur Sprunggelenk/Mittelfuß ausschließen", "einheit": "positiv oder negativ", "kurz": "Druckschmerz an Malleolen-Hinterkante, Os naviculare, Basis Metatarsale V und Gehfähigkeit prüfen.", "ziel": "Röntgenbedarf nach Supinationstrauma bestimmen.", "norm": ["Positiv bei Knochendruckschmerz an einem Prüfpunkt oder Unfähigkeit, 4 Schritte zu gehen; dann Röntgen.", "Gepoolte Sens. 97,6 % (Bachmann 2003); bei negativem Test unter 2 % Frakturrisiko bei 15 % Prävalenz."], "durch": "Stand und Sitz. Palpiert werden die hinteren 6 cm und die Spitze von Außen- und Innenknöchel, die Basis des Metatarsale V und das Os naviculare. Zusätzlich wird geprüft, ob der Patient direkt nach dem Unfall und jetzt 4 Schritte gehen kann. Ein positiver Punkt reicht für Röntgen.", "position": "Stand", "quellen": ["Bachmann 2003 – https://www.aafp.org/pubs/afp/issues/2003/0815/p745a.html"]},"lfapalpation":{"name": "Druckschmerz Lig. fibulotalare anterius", "was": "Läsion des Außenbandes (LFTA)", "einheit": "positiv oder negativ", "kurz": "Lig. fibulotalare anterius vor dem Außenknöchel palpieren, Hämatom beobachten.", "ziel": "Außenbandverletzung lokalisieren.", "norm": ["Positiv bei Druckschmerz über dem LFTA, besonders mit Hämatom.", "Verzögerte Untersuchung nach 4-5 Tagen (Druckschmerz, Hämatom, vordere Schublade zusammen): Sens. 96 %, Spez. 84 % (van Dijk 1996)."], "durch": "Sitz oder Rückenlage. Der Therapeut palpiert das Band vom Vorderrand des Außenknöchels zum Talushals. Zusätzlich auf Hämatomverfärbung achten. Positiv bei lokalem Druckschmerz.", "position": "Sitz", "quellen": ["van Dijk 1996 – https://boneandjoint.org.uk/Article/10.1302/0301-620X.78B6.0780958"]},"schubladeosg":{"name": "Vordere Schublade OSG", "was": "Ruptur Lig. fibulotalare anterius", "einheit": "positiv oder negativ", "kurz": "Unterschenkel fixieren, Ferse in leichter Plantarflexion nach ventral ziehen.", "ziel": "Anteriore Instabilität des OSG prüfen.", "norm": ["Positiv bei vermehrter Ventralverschiebung des Talus, oft mit Sulcus-Zeichen, im Seitenvergleich.", "Sens. 86 %, Spez. 74 % gegen Arthrografie (van Dijk 1996); gegen Ultraschall Sens. 74-83 %, Spez. 38-40 % (Croy 2013)."], "durch": "Sitz mit hängendem Unterschenkel oder Rückenlage, Fuß in etwa 10-20° Plantarflexion. Der Therapeut fixiert die distale Tibia und zieht die Ferse nach ventral. Positiv bei vermehrter Verschiebung und weichem Endgefühl. Am besten 4-5 Tage nach dem Trauma, wenn die Schwellung abnimmt.", "position": "Sitz", "quellen": ["van Dijk 1996, Croy 2013 – https://www.physio-pedia.com/Anterior_Drawer_of_the_Ankle", "van Dijk 1996 – https://boneandjoint.org.uk/Article/10.1302/0301-620X.78B6.0780958"]},"squeeze":{"name": "Squeeze-Test (Syndesmose)", "was": "Läsion der Syndesmose", "einheit": "positiv oder negativ", "kurz": "Tibia und Fibula in Unterschenkelmitte zusammendrücken.", "ziel": "Syndesmosenverletzung provozieren.", "norm": ["Positiv bei Schmerz distal im Bereich der Syndesmose.", "Sens. 26 %, Spez. 88 % (Sman 2013); Studienlage widersprüchlich, kein Einzeltest sicher."], "durch": "Rückenlage oder Sitz. Der Therapeut umfasst den Unterschenkel in der Mitte und drückt Fibula und Tibia zusammen. Positiv bei Schmerz distal über der Syndesmose, nicht an der Druckstelle.", "position": "Rückenlage", "quellen": ["Sman 2013 – https://www.physiotutors.com/wiki/syndesmosis-squeeze-test/", "Sman 2013 – https://bjsm.bmj.com/content/47/10/620.abstract"]},"kleiger":{"name": "Außenrotations-Stresstest (Kleiger)", "was": "Läsion der Syndesmose", "einheit": "positiv oder negativ", "kurz": "Unterschenkel fixieren, Fuß in Dorsalextension nach außen rotieren.", "ziel": "Syndesmosenverletzung provozieren.", "norm": ["Positiv bei Schmerz über der Syndesmose.", "Keine Sens./Spez. gelesen; gute Interrater-Reliabilität (ICC > 0,70) laut Sman 2013."], "durch": "Sitz mit hängendem Unterschenkel, Knie 90° gebeugt. Der Therapeut fixiert den Unterschenkel, bringt den Fuß in Neutral- bis Dorsalextension und rotiert ihn nach außen. Positiv bei Schmerz an der vorderen Syndesmose.", "position": "Sitz", "quellen": ["Sman 2013 – https://bjsm.bmj.com/content/47/10/620.abstract"]},"raldt":{"name": "Reverse anterolateraler Schubladentest", "was": "Chronische laterale Sprunggelenksinstabilität", "einheit": "positiv oder negativ", "kurz": "Fuß fixieren, Tibia und Fibula nach dorsal schieben, Delle vor dem LFTA tasten.", "ziel": "Insuffizienz des LFTA erkennen.", "norm": ["Positiv bei vermehrter Verschiebung mit tastbarer Delle anterolateral.", "Sens. 87-91 %, Spez. 88-92 % gegen Bildgebung, je nach Untersucher (Li 2020, Einzelstudie)."], "durch": "Rückenlage, Ferse auf der Liege, Fuß in leichter Plantarflexion fixiert. Der Therapeut schiebt Tibia und Fibula nach dorsal und tastet anterolateral eine Delle zwischen Fibula und Talus. Positiv bei vermehrter Translation und tastbarer Einziehung im Seitenvergleich.", "position": "Rückenlage", "quellen": ["Übersicht chron. Instabilität (Li 2020, Jolman 2017) – https://aoj.amegroups.org/article/view/8912/html"]},"taluskippung":{"name": "Talar-Tilt-Test", "was": "Läsion Lig. calcaneofibulare, Außenbandinstabilität", "einheit": "positiv oder negativ", "kurz": "Kalkaneus in Neutralstellung umfassen und in Inversion kippen.", "ziel": "Stabilität des Lig. calcaneofibulare prüfen.", "norm": ["Positiv bei vermehrter Inversionskippung oder weichem Endgefühl im Seitenvergleich.", "Gemessen per Stressradiografie: Sens. 49 %, Spez. 82 % (Rosen 2015); Sens. 66,1 %, Spez. 97,3 % (Jolman 2017). Für den manuellen Test allein keine Werte gelesen."], "durch": "Rückenlage oder Sitz, OSG in Neutralstellung. Der Therapeut fixiert den distalen Unterschenkel, umfasst den Kalkaneus und kippt Rückfuß und Talus in Inversion. Positiv bei vermehrter Aufklappbarkeit lateral.", "position": "Rückenlage", "quellen": ["Übersicht chron. Instabilität (Li 2020, Jolman 2017) – https://aoj.amegroups.org/article/view/8912/html"]},"toomanytoes":{"name": "Too-many-toes-Zeichen", "was": "Insuffizienz der Tibialis-posterior-Sehne, Plattfuß", "einheit": "positiv oder negativ", "kurz": "Stehenden Patienten von hinten betrachten und sichtbare Zehen lateral der Ferse zählen.", "ziel": "Rückfußvalgus und Vorfußabduktion erkennen.", "norm": ["Positiv, wenn lateral des Unterschenkels mehr Zehen sichtbar sind als auf der Gegenseite.", "Keine Kennwerte gelesen; Teil der in Reviews untersuchten PTTD-Tests (Lubcke 2019)."], "durch": "Stand, Füße hüftbreit. Der Therapeut steht hinter dem Patienten und zählt die lateral der Ferse sichtbaren Zehen. Positiv bei mehr sichtbaren Zehen als auf der Gegenseite.", "position": "Stand", "quellen": ["Lubcke 2019 (Review-Abstract) – https://apodc-2019.p.asnevents.com.au/days/2019-05-22/abstract/59729"]},"einbeinfersenstand":{"name": "Einbeiniger Fersenstand", "was": "Tibialis-posterior-Dysfunktion", "einheit": "positiv oder negativ", "kurz": "Einbeinig auf die Zehenspitzen gehen, Rückfußbewegung und Wiederholungen beobachten.", "ziel": "Funktion der Tibialis-posterior-Sehne prüfen.", "norm": ["Positiv, wenn das Anheben nicht gelingt, Schmerz auftritt oder die Ferse dabei nicht in Varus geht.", "Keine Sens./Spez. gelesen; höchste Interrater-Reliabilität und deutlichster Zusammenhang mit Ultraschallbefund unter den untersuchten Tests (Ross 2021)."], "durch": "Stand auf einem Bein, Hände leicht an der Wand. Der Patient hebt die Ferse so hoch wie möglich, mehrere Wiederholungen. Der Therapeut beobachtet von hinten, ob die Ferse in Varus dreht. Positiv bei Unfähigkeit, ausbleibender Varisierung oder bekanntem medialem Schmerz.", "position": "Stand", "quellen": ["Ross 2021 (Reliabilität) – https://www.physio-network.com/?p=45243", "Lubcke 2019 (Review-Abstract) – https://apodc-2019.p.asnevents.com.au/days/2019-05-22/abstract/59729"]},"jacktest":{"name": "Jack-Test (Hubscher)", "was": "Flexibler versus rigider Plattfuß", "einheit": "positiv oder negativ", "kurz": "Im Stand die Großzehe passiv dorsalextendieren und Längsgewölbe beobachten.", "ziel": "Flexibilität des Längsgewölbes beurteilen.", "norm": ["Auffällig, wenn sich das Längsgewölbe bei Großzehenextension nicht aufrichtet (eher rigider Plattfuß).", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Stand, Gewicht auf beiden Füßen. Der Therapeut hebt die Großzehe passiv in Dorsalextension. Normal richtet sich das Längsgewölbe über den Windlass-Mechanismus auf und die Tibia rotiert nach außen. Positiv (rigide), wenn das ausbleibt.", "position": "Stand", "quellen": []},"colemanblock":{"name": "Coleman-Block-Test", "was": "Flexibilität des Rückfußvarus beim Hohlfuß", "einheit": "positiv oder negativ", "kurz": "Patient steht mit Ferse und lateralem Fußrand auf einem Brettchen, erster Strahl frei.", "ziel": "Prüfen, ob der Rückfußvarus vorfußbedingt und flexibel ist.", "norm": ["Positiv (flexibel), wenn sich der Rückfußvarus auf dem Block in Neutral- oder Valgusstellung korrigiert.", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Stand. Ein 2-3 cm hohes Brettchen liegt unter Ferse und lateralem Fußrand, der erste Strahl hängt frei nach medial. Der Therapeut beobachtet den Rückfuß von hinten. Korrigiert er sich, ist der Rückfuß flexibel und der Varus vorfußbedingt.", "position": "Stand", "quellen": []},"sinustarsi":{"name": "Druckschmerz Sinus tarsi", "was": "Sinus-tarsi-Syndrom, Läsion subtalarer Bänder", "einheit": "positiv oder negativ", "kurz": "Weichteilgrube vor dem Außenknöchel über dem Sinus tarsi palpieren.", "ziel": "Subtalare Schmerzquelle lokalisieren.", "norm": ["Positiv bei bekanntem Druckschmerz im Sinus tarsi, im Seitenvergleich.", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Sitz oder Rückenlage, Fuß leicht invertiert. Der Therapeut palpiert die Grube anterior-inferior des Außenknöchels. Positiv bei lokalem, bekanntem Schmerz.", "position": "Sitz", "quellen": []},"peronealsubluxation":{"name": "Peronealsehnen-Subluxationstest", "was": "Instabilität der Peronealsehnen", "einheit": "positiv oder negativ", "kurz": "Eversion und Dorsalextension gegen Widerstand, Retromalleolarregion beobachten.", "ziel": "Luxierende Peronealsehnen erkennen.", "norm": ["Positiv bei tastbarem oder sichtbarem Herausspringen der Sehnen über den Außenknöchel.", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Bauchlage oder Sitz, Knie gebeugt. Der Patient führt den Fuß gegen Widerstand in Dorsalextension und Eversion. Der Therapeut palpiert hinter dem Außenknöchel. Positiv bei Subluxation oder Schnappen der Sehnen, oft mit Schmerz.", "position": "Sitz", "quellen": []},"fersenpalpation":{"name": "Druckschmerz medialer Kalkaneus", "was": "Plantarfasziopathie", "einheit": "positiv oder negativ", "kurz": "Ansatz der Plantarfaszie am Tuberculum mediale calcanei palpieren.", "ziel": "Plantarfasziopathie lokalisieren.", "norm": ["Positiv bei bekanntem Druckschmerz am medialen Fersenhöcker.", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Rückenlage oder Sitz, Zehen leicht dorsalextendiert. Der Therapeut palpiert plantar-medial am Fersenbein den Ursprung der Plantarfaszie. Positiv bei bekanntem Schmerz, oft typisch mit Anlaufschmerz morgens.", "position": "Rückenlage", "quellen": []},"windlass":{"name": "Windlass-Test", "was": "Plantarfasziopathie", "einheit": "positiv oder negativ", "kurz": "Im Stand die Großzehe passiv maximal dorsalextendieren.", "ziel": "Plantarfaszie unter Spannung provozieren.", "norm": ["Positiv bei Reproduktion des bekannten Fersenschmerzes.", "Sens. 32 %, Spez. 100 % (De Garceau 2003) - gut zum Bestätigen, nicht zum Ausschließen."], "durch": "Stand, Gewicht auf dem Testbein (z. B. auf einem Hocker). Der Therapeut dorsalextendiert die Großzehe im Grundgelenk passiv bis zum Ende oder bis Schmerz auftritt. Positiv bei bekanntem plantarem Fersenschmerz.", "position": "Stand", "quellen": ["De Garceau 2003 – https://www.physiotutors.com/wiki/windlass-test/"]},"dorsalextevers":{"name": "Dorsalextensions-Eversions-Test", "was": "Tarsaltunnelsyndrom", "einheit": "positiv oder negativ", "kurz": "Fuß maximal dorsalextendiert und evertiert, Zehen extendiert, 5-10 s halten.", "ziel": "Kompression des N. tibialis im Tarsaltunnel provozieren.", "norm": ["Positiv bei vermehrter Druckdolenz des N. tibialis hinter dem Innenknöchel.", "Zunahme der Druckdolenz: Sens. 98 %, Spez. 100 %; Schmerz: Sens. 57 %; Taubheit: Sens. 25 % (Kinoshita 2001, einzige Studie)."], "durch": "Seitenlage oder Sitz. Der Therapeut bringt das OSG in maximale Dorsalextension, den Fuß in maximale Eversion und die Zehen in Extension und hält 5-10 Sekunden. Gleichzeitig palpiert er den N. tibialis hinter dem Innenknöchel. Positiv bei Zunahme der Druckdolenz.", "position": "Seitlage", "quellen": ["Kinoshita 2001 – https://www.physiotutors.com/wiki/dorsiflexion-eversion-test/"]},"tineltarsal":{"name": "Tinel-Zeichen Tarsaltunnel", "was": "Tarsaltunnelsyndrom", "einheit": "positiv oder negativ", "kurz": "Hinter dem Innenknöchel auf den N. tibialis klopfen.", "ziel": "Mechanosensibilität des N. tibialis prüfen.", "norm": ["Positiv bei Kribbeln in die Fußsohle.", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Seitenlage oder Sitz. Der Therapeut klopft hinter und unter dem Innenknöchel entlang des N. tibialis. Positiv bei Parästhesien plantar.", "position": "Seitlage", "quellen": []},"achillespalpation":{"name": "Palpation Achillessehne", "was": "Achillestendinopathie", "einheit": "positiv oder negativ", "kurz": "Achillessehne im Verlauf zwischen den Fingern palpieren.", "ziel": "Tendinopathie der mittleren Sehne oder des Ansatzes lokalisieren.", "norm": ["Positiv bei bekanntem lokalem Druckschmerz, oft mit tastbarer Verdickung.", "Sens. 0,64, Spez. 0,81, LR+ 3,15 (Reiman 2014, gepoolt)."], "durch": "Bauchlage, Füße über dem Liegenende. Der Therapeut palpiert die Sehne von 2-6 cm über dem Ansatz bis zum Kalkaneus. Positiv bei bekanntem Schmerz.", "position": "Bauchlage", "quellen": ["Reiman 2014 – https://nata.kglmeridian.com/view/journals/attr/49/6/article-p820.xml"]},"arcsign":{"name": "Arc Sign", "was": "Achillestendinopathie (Midportion)", "einheit": "positiv oder negativ", "kurz": "Verdickung der Sehne tasten, Patient bewegt das OSG aktiv.", "ziel": "Intratendinöse Verdickung von Paratenon-Schwellung abgrenzen.", "norm": ["Positiv, wenn die tastbare Verdickung bei Fußbewegung mit der Sehne mitwandert.", "Sens. 0,42, Spez. 0,88, LR- 0,68 (Reiman 2014, gepoolt)."], "durch": "Bauchlage, Füße über dem Liegenende. Der Therapeut tastet die Verdickung und der Patient bewegt den Fuß aktiv in Dorsalextension und Plantarflexion. Positiv, wenn die Verdickung mitwandert (Sehne), negativ, wenn sie ortsfest bleibt (Paratenon).", "position": "Bauchlage", "quellen": ["Reiman 2014 – https://nata.kglmeridian.com/view/journals/attr/49/6/article-p820.xml"]},"royallondon":{"name": "Royal-London-Hospital-Test", "was": "Achillestendinopathie (Midportion)", "einheit": "positiv oder negativ", "kurz": "Schmerzpunkt in leichter Plantarflexion palpieren, dann in Dorsalextension erneut.", "ziel": "Tendinopathie bestätigen.", "norm": ["Positiv, wenn der Druckschmerz in Dorsalextension deutlich nachlässt oder verschwindet.", "LR+ 3,84 (Reiman 2014, gepoolt)."], "durch": "Bauchlage. Der Therapeut sucht in leichter Plantarflexion den schmerzhaftesten Punkt. Danach dorsalextendiert der Patient aktiv maximal und der Punkt wird erneut palpiert. Positiv bei deutlich weniger Schmerz in Dorsalextension.", "position": "Bauchlage", "quellen": ["Reiman 2014 – https://nata.kglmeridian.com/view/journals/attr/49/6/article-p820.xml"]},"thompson":{"name": "Thompson-Test (Wadenkompression)", "was": "Achillessehnenruptur", "einheit": "positiv oder negativ", "kurz": "Wade in Bauchlage zusammendrücken und Plantarflexion beobachten.", "ziel": "Vollständige Achillessehnenruptur erkennen.", "norm": ["Positiv, wenn beim Zusammendrücken der Wade keine Plantarflexion auftritt.", "Sens. 0,96, Spez. 0,93, LR+ 13,71, LR- 0,04 (Maffulli 1998 in Reiman 2014)."], "durch": "Bauchlage, Füße über dem Liegenende. Der Therapeut drückt den Wadenbauch kräftig zusammen. Normal bewegt sich der Fuß in Plantarflexion. Positiv, wenn sie ausbleibt. Seitenvergleich.", "position": "Bauchlage", "quellen": ["Reiman 2014 – https://nata.kglmeridian.com/view/journals/attr/49/6/article-p820.xml"]},"matles":{"name": "Matles-Test", "was": "Achillessehnenruptur", "einheit": "positiv oder negativ", "kurz": "Knie in Bauchlage auf 90° beugen und Fußstellung vergleichen.", "ziel": "Achillessehnenruptur erkennen.", "norm": ["Positiv, wenn der Fuß der betroffenen Seite in Neutral- oder Dorsalextension fällt statt in leichter Plantarflexion zu bleiben.", "Sens. 0,88, Spez. 0,85, LR+ 6,29, LR- 0,14 (Maffulli 1998 in Reiman 2014)."], "durch": "Bauchlage. Der Patient beugt beide Knie aktiv auf 90°. Der Therapeut vergleicht die Fußstellung. Positiv, wenn der betroffene Fuß nicht in leichter Plantarflexion bleibt.", "position": "Bauchlage", "quellen": ["Reiman 2014 – https://nata.kglmeridian.com/view/journals/attr/49/6/article-p820.xml"]},"achillesdelle":{"name": "Tastbare Delle Achillessehne", "was": "Achillessehnenruptur", "einheit": "positiv oder negativ", "kurz": "Sehnenverlauf auf eine Lücke abtasten.", "ziel": "Ruptur lokalisieren.", "norm": ["Positiv bei tastbarer Lücke im Sehnenverlauf.", "Sens. 0,73, Spez. 0,89, LR+ 6,64 (Maffulli 1998 in Reiman 2014)."], "durch": "Bauchlage, Füße über dem Liegenende. Der Therapeut tastet die Sehne vom Muskel-Sehnen-Übergang bis zum Ansatz. Positiv bei einer Lücke, typischerweise 2-6 cm über dem Ansatz. Frühe Schwellung kann die Lücke verdecken.", "position": "Bauchlage", "quellen": ["Reiman 2014 – https://nata.kglmeridian.com/view/journals/attr/49/6/article-p820.xml"]},"fingerkompression":{"name": "Daumen-Zeigefinger-Kompression", "was": "Morton-Neurom", "einheit": "positiv oder negativ", "kurz": "Zwischenmetatarsalraum dorsal und plantar zwischen Daumen und Zeigefinger zusammendrücken.", "ziel": "Morton-Neurom lokalisieren.", "norm": ["Positiv bei bekanntem Schmerz im betroffenen Zwischenraum.", "Sens. 96 %, Spez. 100 % (Mahadevan 2015); Sens. 95 % (Owens 2011); laut Pitcher 2024 gut zum Ausschließen, Daten aus Einzelstudien."], "durch": "Rückenlage oder Sitz. Der Therapeut drückt den Intermetatarsalraum (meist 3/4 oder 2/3) zwischen Daumen plantar und Zeigefinger dorsal zusammen. Positiv bei bekanntem, oft brennendem Schmerz.", "position": "Rückenlage", "quellen": ["Pitcher 2024 – https://uhra.herts.ac.uk/id/eprint/9649/1/pitcher-et-al-2024-diagnostic-accuracy-of-subjective-features-and-physical-examination-tests-for-morton-neuroma-a.pdf"]},"mulder":{"name": "Mulder-Klick", "was": "Morton-Neurom", "einheit": "positiv oder negativ", "kurz": "Mittelfußköpfchen seitlich zusammendrücken und gleichzeitig den Zwischenraum plantar drücken.", "ziel": "Morton-Neurom durch tastbaren Klick bestätigen.", "norm": ["Positiv bei tastbarem Klick mit bekanntem Schmerz.", "Sens. 0,29-0,94, Spez. 0,17-1,00 je nach Studie; LR insgesamt schwach (Pitcher 2024)."], "durch": "Rückenlage. Eine Hand drückt die Mittelfußköpfchen von medial und lateral zusammen, die andere drückt plantar in den betroffenen Zwischenraum. Positiv bei tastbarem Klick und bekanntem Schmerz.", "position": "Rückenlage", "quellen": ["Pitcher 2024 – https://uhra.herts.ac.uk/id/eprint/9649/1/pitcher-et-al-2024-diagnostic-accuracy-of-subjective-features-and-physical-examination-tests-for-morton-neuroma-a.pdf"]},"plantarplatte":{"name": "Vertikaler Stresstest MTP (Schublade)", "was": "Läsion der Plantarplatte", "einheit": "positiv oder negativ", "kurz": "Mittelfußknochen fixieren, Grundglied der Zehe nach dorsal schieben.", "ziel": "Instabilität der Plantarplatte erkennen.", "norm": ["Positiv bei vermehrter dorsaler Verschiebung (über 50 % Subluxation) oder bekanntem Schmerz im Seitenvergleich.", "Sens. 80,6 %, Spez. 99,8 % (Studie zitiert in Knight-Übersicht; Primärquelle dort nicht namentlich genannt)."], "durch": "Rückenlage oder Sitz. Der Therapeut fixiert das Metatarsale, hält das Grundglied in leichter Dorsal
