- Ärztlich: Cheilektomie (danach früh mobilisieren), Arthrodese (Abrollen dann über Schuh)`}],quellenKurz:{},stichworte:["hallux rigidus","grosszehengrundgelenksarthrose"]},{id:"ZE03",titel:"Krallen- und Hammerzehen",bereich:"Zehen",icd10:["M20.4"],quellen:[],evidenz:"niedrig",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"10_Zehen/03_Krallen_Hammerzehen.md",abschnitte:[{titel:"Kurz",text:"Hammerzehe: Beugung im Mittelgelenk. Krallenzehe: zusätzlich Überstreckung im Grundgelenk. Ursachen: enge Schuhe, Muskelungleichgewicht, Neuropathie, Hallux valgus."},{titel:"Therapieplanung",text:"Flexibel: Zehenübungen (Handtuch greifen, Zehenspreizen), Polster, weite Schuhe. Starr: ärztlich, OP (Drahtfixation, danach Schonung der Zehen nach Vorgabe)."}],quellenKurz:{},stichworte:["hammerzehe","krallenzehe"]},{id:"ZE04",titel:"Turf Toe",bereich:"Zehen",icd10:["S93.5"],quellen:[],evidenz:"niedrig",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"10_Zehen/04_Turf_Toe.md",abschnitte:[{titel:"Kurz",text:"Überstreckungsverletzung der plantaren Kapsel am Großzehengrundgelenk, typisch auf Kunstrasen. Grad I–III."},{titel:"Therapieplanung",text:"Tape oder Schuh mit steifer Sohle, Entlastung nach Grad, dann Beweglichkeit und Kraft, Sprint und Absprung zuletzt. Grad III oft OP."}],quellenKurz:{},stichworte:["turf toe"]},{id:"ZE05",titel:"Sesamoiditis",bereich:"Zehen",icd10:["M25.57"],quellen:[],evidenz:"niedrig",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"10_Zehen/05_Sesamoiditis.md",abschnitte:[{titel:"Kurz",text:"Reizung der Sesambeine unter dem Großzehengrundgelenk bei Läufern und Tänzern. Stressfraktur abgrenzen."},{titel:"Therapieplanung",text:"Druckentlastung (Einlage mit Aussparung), Belastungsanpassung, Kraft der Fußmuskeln, Laufaufbau."}],quellenKurz:{},stichworte:["sesamoiditis","sesambein"]},{id:"ZE06",titel:"Gicht (Podagra)",bereich:"Zehen",icd10:["M10"],quellen:[],evidenz:"niedrig",stand:"2026-10-09",status:"Entwurf, fachlich prüfen; Leitlinie im Register prüfen",datei:"10_Zehen/06_Gicht.md",abschnitte:[{titel:"Kurz",text:"Akuter Gichtanfall, oft am Großzehengrundgelenk: plötzlich, hochrot, heiß, extrem schmerzhaft. Behandlung ärztlich."},{titel:"Warnzeichen",text:"Erstes Auftreten oder Fieber → ärztlich, septische Arthritis ausschließen (G02)."},{titel:"Therapieplanung",text:"Im Anfall keine Physiotherapie am Gelenk, Kühlung nach ärztlicher Anweisung. Danach Beweglichkeit, Bewegung und Gewichtskontrolle als Teil der Lebensstiländerung."}],quellenKurz:{},stichworte:["gicht","podagra","arthritis urica"]},{id:"ZE07",titel:"Zehenfraktur",bereich:"Zehen",icd10:["S92.4","S92.5"],quellen:[],evidenz:"niedrig",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"10_Zehen/07_Zehenfraktur.md",abschnitte:[{titel:"Kurz",text:"Meist konservativ mit Buddy-Taping und steifem Schuh. Großzehe mit Gelenkbeteiligung ärztlich beurteilen lassen."},{titel:"Therapieplanung",text:"Belastung nach Schmerz, Schuh mit fester Sohle 3–6 Wochen, danach Beweglichkeit und Abrollen."}],quellenKurz:{},stichworte:["zehenfraktur"]},{id:"ZE08",titel:"Digitus quintus varus (Schneiderballen)",bereich:"Zehen",icd10:["M20.5"],quellen:[],evidenz:"niedrig",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"10_Zehen/08_Schneiderballen.md",abschnitte:[{titel:"Kurz",text:"Vorstehendes Mittelfußköpfchen V mit Druckschmerz im Schuh. Spiegelbild zum Hallux valgus."},{titel:"Therapieplanung",text:"Weite Schuhe, Polster. Nach Korrektur-OP Belastung nach Vorgabe, Ödem, Gang."}],quellenKurz:{},stichworte:["schneiderballen","digitus quintus varus","bunionette"]},{id:"ZE09",titel:"Plantarplattenläsion MTP II",bereich:"Zehen",icd10:["M24.27"],quellen:[],evidenz:"niedrig",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"10_Zehen/09_Plantarplattenlaesion.md",abschnitte:[{titel:"Kurz",text:"Riss der plantaren Platte am zweiten Zehengrundgelenk, oft bei Hallux valgus oder langem Metatarsale II. Schmerz unter dem Köpfchen, Zehe weicht nach oben und innen ab („crossover toe“)."},{titel:"Befund",text:"Vertikaler Schubladentest (Lachman des MTP II), Druckschmerz plantar."},{titel:"Therapieplanung",text:"Tape in Plantarflexion, Pelotte, steife Sohle, Belastungsanpassung. Bei Fortschreiten OP."}],quellenKurz:{},stichworte:["plantarplatte"]},{id:"ZE10",titel:"Morbus Köhler II (Freiberg)",bereich:"Zehen",icd10:["M92.7"],quellen:[],evidenz:"niedrig",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"10_Zehen/10_Morbus_Koehler_II.md",abschnitte:[{titel:"Kurz",text:"Aseptische Knochennekrose des Mittelfußköpfchens II, meist junge Frauen. Belastungsschmerz unter dem Vorfuß."},{titel:"Therapieplanung",text:"Druckentlastung (Einlage, steife Sohle), Belastungsanpassung, ärztliche Verlaufskontrolle. Nach OP Vorgaben."}],quellenKurz:{},stichworte:["koehler","freiberg"]},{id:"NE01",titel:"Schlaganfall",bereich:"Neurologie",icd10:["I63","I61","I69"],quellen:["Q29","Q30","Q31","Q48"],evidenz:"hoch",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"11_Neurologie/01_Schlaganfall.md",abschnitte:[{titel:"Kurz",text:"Häufigste Ursache für bleibende Behinderung im Erwachsenenalter. Folgen: Halbseitenlähmung, Spastik, Sensibilitätsstörung, Gleichgewicht, Neglect, Sprache, Schlucken, Kognition. Die größte Erholung in den ersten 3–6 Monaten, Verbesserungen aber auch Jahre später möglich."},{titel:"Anamnese",text:`- Datum, Art (Infarkt, Blutung), betroffene Seite, Begleiterkrankungen, Medikamente (Blutverdünner)
- Mobilität vor dem Schlaganfall, Wohnung, Hilfsmittel, Angehörige
- Sturzereignisse, Schmerzen (Schulter!), Schlucken, Kognition`},{titel:"Warnzeichen",text:"Neue neurologische Ausfälle (FAST) → Notruf. Blutdruck vor Belastung messen (G05)."},{titel:"Befund",text:`- Motorik: Fugl-Meyer (Arm, Bein), Kraft, Spastik (Modifizierte Ashworth)
- Sensibilität, Neglect (Linienhalbierung), Pusher-Symptomatik
- Rumpfkontrolle, Transfers, Sitz- und Stehbalance
- Gang: FAC, Gehgeschwindigkeit, 6MWT
- Schulter: Subluxation, Schmerz
- Kognition und Aufmerksamkeit grob einschätzen`},{titel:"Messinstrumente",text:"FAC, 10-m-Gehtest, 6MWT, Berg Balance, TUG, Fugl-Meyer, ARAT, Box-and-Block, Modifizierte Ashworth."},{titel:"Ziele",text:"Selbstständige Transfers, Gehen in der Wohnung und draußen, Arm im Alltag einsetzen, Stürze vermeiden."},{titel:"Therapieplanung",text:`**Gehen und Mobilität** (Q30, Q31)
- Intensives, aufgabenorientiertes Gehtraining, hohe Wiederholungszahl
- Laufbandtraining, auch mit Gewichtsentlastung; Gehtraining mit moderater bis hoher Intensität (Q31: hohe Intensität, 60–80 % HFR, wird für chronische Phase empfohlen)
- Elektromechanische Gangtrainer bei nicht gehfähigen Patienten (Q30)
- Kraft- und Ausdauertraining
- Funktionelle Elektrostimulation oder Peronäusorthese bei Fußheberschwäche
- Statisches Gleichgewicht und Gangtraining mit Aufgaben

**Arm und Hand** (Q29)
- Aufgabenorientiertes Training mit hoher Wiederholung
- Constraint-Induced Movement Therapy (CIMT) bei ausreichender Restfunktion (aktive Handgelenk- und Fingerstreckung)
- Spiegeltherapie, Arm-Robotik, Elektrostimulation je nach Schweregrad
- Mentales Training ergänzend

**Spastik**: Dehnung, Lagerung, Training; ärztlich Botulinumtoxin mit anschließender Therapie

**Schulter**: Subluxation vermeiden (Lagerung, Unterstützung), keine Zugbelastung am gelähmten Arm`},{titel:"Durchführung",text:`- Sitz-Stand-Transfers 10–20x pro Einheit, mit zunehmender Schwierigkeit
- Gehen: so viele Schritte wie möglich, Steigerung von Geschwindigkeit und Strecke
- Arm: gezielte Alltagsaufgaben (Greifen, Becher, Besteck), mehrere hundert Wiederholungen pro Tag als Ziel, Heimprogramm mit Angehörigen
- Gleichgewicht im Stand mit Störungen, Schritt-Strategien
- Intensität dokumentieren: Anzahl Schritte, Wiederholungen, Minuten`}],quellenKurz:{Q29:"S3 Armparese 2020",Q30:"ReMoS 2015",Q31:"Hornby 2020",Q48:"S2k sensomotorische Störungen 2023"},stichworte:["schlaganfall","apoplex","hirninfarkt","hirnblutung","hemiparese","insult","mediainfarkt","zns ischaemie","stroke"]},{id:"NE02",titel:"Morbus Parkinson",bereich:"Neurologie",icd10:["G20"],quellen:["Q26","Q27","Q67"],evidenz:"hoch",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"11_Neurologie/02_Morbus_Parkinson.md",abschnitte:[{titel:"Kurz",text:"Fortschreitende Erkrankung mit Bradykinese, Rigor, Ruhetremor, später Haltungsinstabilität, Freezing und Stürzen. Physiotherapie hat in allen Stadien einen festen Platz (Q26, Q27)."},{titel:"Anamnese",text:`- Stadium (Hoehn & Yahr), Medikamente und Wirkzeiten (On/Off), Dyskinesien
- Stürze, Freezing, Alltagsprobleme, Ziele`},{titel:"Befund",text:`- Gang (Schrittlänge, Freezing, Umdrehen), Transfers, Aufstehen vom Boden
- Gleichgewicht (Mini-BESTest, Pull-Test vorsichtig), Haltung
- Ausdauer und Kraft
- Termin möglichst in der On-Phase, Medikamenteneinnahme dokumentieren`},{titel:"Messinstrumente",text:"10-m-Gehtest, 6MWT, TUG (auch mit Doppelaufgabe), Mini-BESTest, Berg Balance, 5x Sit-to-Stand, Freezing of Gait Questionnaire (prüfen), Sturztagebuch."},{titel:"Ziele",text:"Sicher gehen, Stürze vermeiden, Aktivität und Fitness erhalten."},{titel:"Therapieplanung (Q27)",text:`- Aerobes Training mit moderater bis hoher Intensität (Laufband, Rad), 3x pro Woche
- Progressives Krafttraining
- Gleichgewichtstraining
- Externe Hinweisreize (Cueing) für Gang und Freezing: rhythmisch akustisch, visuell (Linien am Boden)
- Aufgabenspezifisches Training (Transfers, Umdrehen, Aufstehen vom Boden)
- Große Bewegungen (zum Beispiel LSVT BIG) als Option
- Tanz, Tai Chi als ergänzende Angebote
- In Spätstadien Sturzprävention, Kontrakturen vermeiden, Angehörige anleiten`},{titel:"Durchführung",text:`- Laufband mit steigendem Tempo, 30 min, RPE 13–15
- Kraft: Beine, Rumpf, Rückenstrecker, 2–3x pro Woche
- Gang mit Metronom (Taktfrequenz leicht über der eigenen), Linien am Boden
- Strategien bei Freezing: Gewicht verlagern, auf Zielpunkt schauen, laut zählen
- Doppelaufgaben dosiert einbauen`}],quellenKurz:{Q26:"S2k Parkinson 2023",Q27:"APTA 2022",Q67:"Europäische Leitlinie 2014"},stichworte:["parkinson","ips"]},{id:"NE03",titel:"Multiple Sklerose",bereich:"Neurologie",icd10:["G35"],quellen:["Q28"],evidenz:"mittel bis hoch",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"11_Neurologie/03_Multiple_Sklerose.md",abschnitte:[{titel:"Kurz",text:"Chronisch-entzündliche Erkrankung des zentralen Nervensystems, meist schubförmig beginnend. Typisch: Fatigue, Spastik, Gangstörung, Ataxie, Sensibilitätsstörungen, Blasenprobleme, Hitzeempfindlichkeit (Uhthoff). Bewegung ist sicher und wirksam."},{titel:"Anamnese",text:`- Verlaufsform, letzter Schub, EDSS (ärztlich), Medikamente
- Fatigue (Tageszeit), Hitzeempfindlichkeit, Stürze, Blase`},{titel:"Warnzeichen",text:"Neuer Schub (neue Symptome über 24 Stunden) → ärztlich, Training anpassen."},{titel:"Befund",text:"Kraft, Spastik, Koordination (Ataxie), Gleichgewicht, Gang, Ausdauer, Fatigue."},{titel:"Messinstrumente",text:"Timed 25-Foot Walk (prüfen) oder 10-m-Gehtest, 6MWT, Berg Balance, MSWS-12 (prüfen), FSS oder MFIS, TUG."},{titel:"Ziele",text:"Gehfähigkeit erhalten, Fatigue managen, Stürze vermeiden, Beruf und Familie."},{titel:"Therapieplanung",text:`- Ausdauer- und Krafttraining 2–3x pro Woche, moderat (Q28 Bewegungskapitel prüfen)
- Gleichgewichts- und Gangtraining
- Spastik: Dehnung, Bewegung, Training
- Fatigue: Energiemanagement, Pausen, Training eher morgens, Kühlung (Kühlweste, kühler Raum)
- Hilfsmittel (Fußheberorthese, Stöcke) rechtzeitig`},{titel:"Durchführung",text:`- Fahrradergometer 20–30 min, RPE 11–13
- Kraft Beine und Rumpf, 3x 10–15
- Gleichgewicht: steigernd, gesichert
- Bei Hitzeempfindlichkeit kurze Intervalle, Kühlung`}],quellenKurz:{Q28:"S2k MS 2023"},stichworte:["multiple sklerose","encephalomyelitis disseminata","ms"]},{id:"NE04",titel:"Polyneuropathie",bereich:"Neurologie",icd10:["G62","G63"],quellen:["Q32"],evidenz:"mittel",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"11_Neurologie/04_Polyneuropathie.md",abschnitte:[{titel:"Kurz",text:"Schädigung vieler peripherer Nerven, häufigste Ursachen Diabetes und Alkohol. Strumpfförmige Sensibilitätsstörung, Brennen, Gangunsicherheit besonders im Dunkeln, später Schwäche. Hohes Sturzrisiko."},{titel:"Anamnese",text:"- Ursache bekannt?, Verlauf, Schmerzen (neuropathisch), Stürze, Fußverletzungen"},{titel:"Befund",text:`- Sensibilität (Monofilament, Stimmgabel, Lagesinn), Reflexe (ASR)
- Romberg, Gleichgewicht, Gang
- Kraft Fußheber, Zehen
- Füße inspizieren (FU07)`},{titel:"Messinstrumente",text:"TUG, Berg Balance oder Mini-BESTest, Einbeinstand, 10-m-Gehtest, Sturztagebuch, NPRS."},{titel:"Ziele",text:"Sicher gehen, Stürze vermeiden, Schmerz lindern."},{titel:"Therapieplanung",text:`- Gleichgewichtstraining mit sensorischen Herausforderungen (Augen zu, weiche Unterlage) – gesichert
- Kraft Unterschenkel und Hüfte
- Ausdauer
- Sturzprävention und Wohnraumberatung, Licht in der Nacht
- Ursachenbehandlung ärztlich`},{titel:"Durchführung",text:"Gleichgewicht 3x pro Woche über Monate, Kraft 2x pro Woche, Gehen auf unterschiedlichen Untergründen, Fußpflege und Schuhberatung."}],quellenKurz:{Q32:"S1 Diagnostik Polyneuropathien 2025 (Diagnostik; Therapieempfehlungen zur Physiotherapie dort begrenzt)"},stichworte:["polyneuropathie","pnp"]},{id:"NE05",titel:"Schädel-Hirn-Trauma (inkl. Gehirnerschütterung)",bereich:"Neurologie",icd10:["S06"],quellen:["Q38","Q66","Q31"],evidenz:"mittel",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"11_Neurologie/05_Schaedel-Hirn-Trauma.md",abschnitte:[{titel:"Kurz",text:"Spannbreite von Gehirnerschütterung (leichtes SHT) bis zu schweren Verletzungen mit langer Bewusstlosigkeit. Folgen: Kopfschmerz, Schwindel, Gleichgewicht, Konzentration, Motorik, Verhalten."},{titel:"Warnzeichen",text:"Nach frischem SHT: zunehmende Kopfschmerzen, Erbrechen, Bewusstseinstrübung, Krampfanfall, ungleiche Pupillen → Notruf."},{titel:"Leichtes SHT / Gehirnerschütterung (Q66)",text:`- Nach 24–48 Stunden relativer Ruhe frühe, leichte Aktivität unterhalb der Symptomschwelle
- Untersuchung: HWS, Gleichgewicht, vestibulär-okulomotorisch (VOMS, prüfen), Belastungstoleranz (zum Beispiel Buffalo Concussion Treadmill Test, prüfen)
- Therapie: dosiertes aerobes Training unter Symptomgrenze, vestibuläre Rehabilitation, HWS-Behandlung
- Stufenweise Rückkehr zum Sport nach Protokoll`},{titel:"Mittelschweres bis schweres SHT",text:`- Akut und Frührehabilitation nach Q38
- Später wie NE01: aufgabenorientiert, Gang, Gleichgewicht, Kraft (Q31)
- Kognitive und Verhaltensaspekte im Team berücksichtigen`},{titel:"Messinstrumente",text:"NPRS Kopfschmerz, Symptom-Checkliste (zum Beispiel SCAT, ärztlich/Sport), DHI, FGA, 6MWT, 10-m-Gehtest."}],quellenKurz:{Q38:"S3 Koma und schwere Bewusstseinsstörung 2025",Q66:"JOSPT Concussion 2020",Q31:"Hornby 2020"},stichworte:["schaedel hirn trauma","schaedelhirntrauma","sht","gehirnerschuetterung","commotio"]},{id:"NE06",titel:"Inkomplette Querschnittlähmung",bereich:"Neurologie",icd10:["G82","S14","S24","S34"],quellen:["Q37","Q31"],evidenz:"mittel",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"11_Neurologie/06_Inkomplette_Querschnittlaehmung.md",abschnitte:[{titel:"Kurz",text:"Teilweise Schädigung des Rückenmarks. Einteilung nach ASIA (AIS A–E). Bei inkompletter Lähmung (AIS C, D) ist Gehen oft ein realistisches Ziel. Ambulante Physiotherapie meist nach Akut- und Reha-Klinik."},{titel:"Warnzeichen",text:"Autonome Dysreflexie bei Läsion ab Th6 und höher: plötzlicher Blutdruckanstieg, Kopfschmerz, Schwitzen, Gesichtsrötung → Auslöser suchen (Blase, Darm, Druckstelle), aufsetzen, ärztlich. Druckstellen kontrollieren."},{titel:"Befund",text:"Kraft nach Kennmuskeln, Sensibilität, Spastik, Transfers, Gang (WISCI II, prüfen), Gleichgewicht, Hautzustand."},{titel:"Messinstrumente",text:"10-m-Gehtest, 6MWT, TUG, Berg Balance, SCIM (prüfen)."},{titel:"Therapieplanung",text:`- Intensives Gehtraining (Laufband mit Gewichtsentlastung, Überboden), hohe Intensität und viele Schritte (Q31, Q37)
- Kraft- und Ausdauertraining
- Funktionelle Elektrostimulation und Orthesen nach Bedarf (Q37)
- Spastikmanagement, Kontrakturprophylaxe`},{titel:"Durchführung",text:"Wie NE01 Gehen, angepasst an Läsionshöhe und Hilfsmittel."}],quellenKurz:{Q37:"S2e Querschnitt untere Extremität 2024"},stichworte:["querschnitt","querschnittlaehmung","paraplegie","tetraplegie","paraparese","tetraparese"]},{id:"NE07",titel:"Lagerungsschwindel (BPPV) und vestibuläre Störungen",bereich:"Neurologie",icd10:["H81.1","H81.2","H81.3"],quellen:["Q33","Q34","Q61"],evidenz:"hoch",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"11_Neurologie/07_Schwindel_BPPV_vestibulaer.md",abschnitte:[{titel:"Kurz",text:`**BPPV**: häufigste Schwindelursache. Kurzer Drehschwindel (unter 1 Minute) bei Kopfbewegung, Hinlegen, Umdrehen im Bett. Meist hinterer Bogengang. Mit Befreiungsmanöver sehr gut behandelbar.
**Einseitige vestibuläre Unterfunktion** (zum Beispiel nach Neuritis vestibularis): Schwindel bei Kopfbewegung, Gangunsicherheit. Vestibuläre Rehabilitation wirksam (Q34).`},{titel:"Warnzeichen",text:"Zentraler Schwindel (G02): Doppelbilder, Sprech- oder Schluckstörung, neue Lähmung, Ataxie, untypischer Nystagmus, plötzlicher starker Kopfschmerz → Notaufnahme. HINTS-Untersuchung ärztlich."},{titel:"Befund",text:`- Anamnese nach Dauer, Auslöser, Begleitsymptomen
- Dix-Hallpike (hinterer Bogengang), Supine Roll Test (horizontaler Bogengang)
- Nystagmus beobachten (Richtung, Dauer, Latenz)
- Kopfimpulstest, dynamische Sehschärfe, Gleichgewicht, Gang`},{titel:"Messinstrumente",text:"DHI, FGA oder DGI, Berg Balance, TUG."},{titel:"Therapieplanung",text:`- BPPV hinterer Bogengang: Epley- oder Semont-Manöver (Q33, Q61), Wirksamkeit nach 1–3 Manövern hoch
- Horizontaler Bogengang: Barbecue-Rotation (Lempert) oder Gufoni
- Keine routinemäßige Einschränkung der Bewegung nach dem Manöver nötig (Q61, prüfen)
- Vestibuläre Unterfunktion: Blickstabilisation, Habituation, Gleichgewichts- und Gangtraining (Q34)`},{titel:"Durchführung",text:`- Epley: Dix-Hallpike-Position, 30–60 s je Position bzw. bis Nystagmus abklingt, Kopfdrehung 90°, Körper zur Seite, Aufsetzen
- Blickstabilisation (VOR x1): Buchstaben fixieren, Kopf schnell hin und her drehen, 1–2 min, 3–5x täglich (Q34)
- Gleichgewicht: Stand mit reduzierter Unterstützung, Augen zu, weiche Unterlage, Gehen mit Kopfdrehung
- Dauer bei Unterfunktion mehrere Wochen (Q34: chronisch etwa 4–6 Wochen, prüfen)`}],quellenKurz:{Q33:"DEGAM S2k Schwindel 2026",Q34:"Hall 2022",Q61:"AAO-HNS BPPV 2017"},stichworte:["schwindel","bppv","lagerungsschwindel","vestibulaer","neuritis vestibularis"]},{id:"NE08",titel:"Periphere Fazialisparese",bereich:"Neurologie",icd10:["G51.0"],quellen:["Q35"],evidenz:"niedrig bis mittel",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"11_Neurologie/08_Periphere_Fazialisparese.md",abschnitte:[{titel:"Kurz",text:"Lähmung der Gesichtsmuskeln einer Seite, meist idiopathisch (Bell's Palsy). Stirn mitbetroffen (Unterschied zum zentralen Schlaganfall, bei dem die Stirn frei bleibt). Prognose meist gut, Kortison früh ärztlich (Q35)."},{titel:"Warnzeichen",text:"Stirn ausgespart, weitere neurologische Ausfälle → Schlaganfall ausschließen, Notruf. Augenschluss unvollständig → Augenschutz (ärztlich)."},{titel:"Befund",text:"House-Brackmann oder Sunnybrook, Synkinesien (später), Augenschluss."},{titel:"Messinstrumente",text:"Sunnybrook Facial Grading, House-Brackmann, Fotodokumentation."},{titel:"Therapieplanung",text:`- Aufklärung, Augenschutz
- Mimikübungen vor dem Spiegel, gezielt und symmetrisch, nicht mit maximaler Kraft (Synkinesien vermeiden)
- Elektrostimulation umstritten bzw. nicht empfohlen (Q35 prüfen)

- Gelenkschonende Ausdauer: Rad, Wasser, Gehen
- Verhaltensaspekte: realistische Ziele, Spaß, Alltag`},{titel:"Durchführung",text:"Start mit 10-min-Einheiten, Steigerung auf 30–60 min. Kraft 2x pro Woche. Schrittziel schrittweise erhöhen."}],quellenKurz:{Q45:"S3 Adipositas 2024"},stichworte:["adipositas","uebergewicht"]},{id:"IM08",titel:"Osteoporose",bereich:"Innere Medizin",icd10:["M81","M80"],quellen:["Q07"],evidenz:"hoch",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"12_Innere_Medizin/08_Osteoporose.md",abschnitte:[{titel:"Kurz",text:"Verminderte Knochenmasse und -qualität mit erhöhtem Frakturrisiko. Körperliche Aktivität, Kraft, Gleichgewicht und Sturzprophylaxe sind Basismaßnahmen (Q07). Siehe auch WS08 (Wirbelkörperfraktur)."},{titel:"Anamnese",text:"Frakturen, Stürze, Medikamente, Vitamin D und Kalzium (ärztlich), Aktivität."},{titel:"Messinstrumente",text:"TUG, 5x Sit-to-Stand, Einbeinstand, Hinterkopf-Wand-Abstand, Sturztagebuch."},{titel:"Therapieplanung",text:`- Progressives Krafttraining mit ausreichender Last für den Knochenreiz, wenn ärztlich und klinisch vertretbar

- Bewegung und Krafttraining mit Kompression sind sicher und empfohlen`},{titel:"Durchführung",text:"MLD nach Ausbildung (Zertifikat erforderlich), Entstauungsübungen in Kompression, Kraft progressiv, Hautpflege, Schulung zur Selbstbehandlung."}],quellenKurz:{Q46:"S2k Lymphödeme (abgelaufen, Nachfolger prüfen)"},stichworte:["lymphoedem","lipoedem"]},{id:"IM10",titel:"Long/Post-COVID mit Belastungsintoleranz",bereich:"Innere Medizin",icd10:["U09.9"],quellen:["Q47"],evidenz:"niedrig",stand:"2026-10-09",status:"Entwurf, fachlich prüfen; Leitlinie abgelaufen",datei:"12_Innere_Medizin/10_Post-COVID.md",abschnitte:[{titel:"Kurz",text:"Beschwerden über 4 bzw. 12 Wochen nach einer Infektion: Fatigue, Atemnot, Konzentrationsstörung, Herzrasen. Entscheidend ist, ob eine Post-Exertional Malaise (PEM) vorliegt, also eine deutliche Verschlechterung Stunden bis Tage nach Belastung. Bei PEM ist klassisches, ansteigendes Training kontraindiziert."},{titel:"Anamnese",text:`- Infektion wann, Symptome, Verlauf

- Herzrasen im Stehen (POTS), Atemnot, Schlaf`},{titel:"Warnzeichen",text:"Brustschmerz, Herzrasen in Ruhe, Ohnmacht → ärztlich (Myokarditis, Lungenembolie ausschließen)."},{titel:"Befund",text:"Puls und Blutdruck im Liegen und Stehen (Stehtest), SpO₂, Atemmuster, Belastungstoleranz vorsichtig."},{titel:"Messinstrumente",text:"FSS, DSQ-PEM, Aktivitätstagebuch, Stehtest, 1-min-Sit-to-Stand (nur ohne PEM)."},{titel:"Therapieplanung",text:`- **Mit PEM**: Pacing, Energiemanagement, unter der Belastungsgrenze bleiben, Herzfrequenzgrenze, Atemtherapie, kein Graded Exercise (Q47 prüfen)
- **Ohne PEM**: vorsichtig ansteigendes Training, Symptome eng beobachten
- Dysfunktionale Atmung: Atemschulung`},{titel:"Durchführung",text:"Aktivitätstagebuch, Aktivitäten aufteilen, Pausen vor Erschöpfung, Puls unter individueller Grenze, Atemübungen (Nasenatmung, Zwerchfell)."}],quellenKurz:{Q47:"S1 Long/Post-COVID 2024 (abgelaufen, Nachfolger prüfen)"},stichworte:["long covid","post covid","postcovid","post-covid","me cfs","fatigue nach covid"]},{id:"KI01",titel:"Craniomandibuläre Dysfunktion (CMD)",bereich:"Kiefer",icd10:["M26.6"],quellen:["Q80","Q81","Q82","Q83","Q84","Q85"],evidenz:"mittel",stand:"2026-10-09",status:"Entwurf, fachlich prüfen",datei:"14_Kiefer/01_CMD.md",abschnitte:[{titel:"Kurz",text:`Sammelbegriff für Funktionsstörungen von Kaumuskeln und Kiefergelenken. Typisch sind Schmerz, eingeschränkte oder unharmonische Kieferbewegung und Gelenkgeräusche. Die Prognose ist in der Regel gut. Die Therapie beginnt mit reversiblen oder minimalinvasiven Maßnahmen (Q80).

Die DGFDT-Mitteilung von 2022 (Q80) wertet rund 1.200 Quellen aus. Nach der Zusammenfassung in den zm (2023) gilt:
- Aufklärung, Beratung und Anleitung zur Selbsthilfe gehören immer zum Konzept.
- Bei myogenen Beschwerden ist Physiotherapie eine bewährte Ergänzung zur Schienentherapie. Physikalisch-medizinische Maßnahmen können ergänzend oder alternativ helfen.
- Kiefergelenkgeräusche allein brauchen in der Regel keine Behandlung.
- Vor Therapiebeginn werden Belastungsfaktoren erfasst (Achse-II-Screening).

Zur Wirksamkeit von manueller Therapie und Übungen bei TMD gibt es Studien. Die Gesamtstudienlage gilt als begrenzt (Q83, nur über Q85 zitiert, Original nicht geöffnet).`},{titel:"Anamnese",text:"Schmerzort und Auslöser (Kauen, Gähnen, Sprechen), Gelenkgeräusche, Kieferklemme oder Kiefersperre, Pressen und Knirschen (Bruxismus), Kopf- und Nackenschmerz, Stress und Schlaf, Zahnarzt- und Schienentherapie, Unfall."},{titel:"Befund",text:`- Mundöffnung aktiv als Schneidekantendistanz in mm, Laterotrusion rechts und links, Protrusion (Q81, Q82)
- Öffnungsbahn (gerade, Abweichung, Ausweichen), Schmerz bei Bewegung (übliche Praxis, keine Quelle geöffnet)
- Palpation von M. masseter, M. temporalis, Mundboden und Nacken
- Screening der HWS und der Kopfhaltung
- Standardisierte Untersuchung nach DC/TMD (Q84, Original nicht geöffnet)

### Messwerte

|---|---|---|
| Mundöffnung, gesunde Studierende (n = 140) | Mittel 48,8 mm, Spanne 40–68 mm; Männer 50,7, Frauen 47,4 | Q82 |
| Mundöffnung, TMD-Patienten (n = 500) | Mittel 49,3 mm | Q81 |
| Protrusion, TMD-Patienten | Mittel 8,8 mm | Q81 |
| Laterotrusion, TMD-Patienten | rechts 9,4 mm, links 11,8 mm | Q81 |
| Grenzwert gestörte Funktion (Vorschlag Türp et al.) | Mundöffnung unter 30 mm, Laterotrusion und Protrusion unter 5 mm | Q81 |
| Grenzwerte aus der Literatur | unter 40 mm bei muskulären, unter 35 mm bei gelenkbedingten Störungen | zitiert in Q82 |

Für Laterotrusion und Protrusion habe ich keine Referenzwerte gesunder Personen gefunden. Die App nutzt dort den Grenzwert 5 mm als Untergrenze und markiert beides als Platzhalter.`},{titel:"Messinstrumente",text:"NAS, Lineal oder Messschieber für die Schneidekantendistanz, DC/TMD (Q84)."},{titel:"Therapieplanung",text:`- Aufklärung und Selbstmanagement zuerst, dazu Ruheposition des Kiefers, Wahrnehmung von Pressen und Knirschen (Q80, Q85)
- Bei myogenen Beschwerden manuelle Therapie und Übungen, abgestimmt mit dem Zahnarzt, wenn eine Schiene getragen wird (Q80)
- Bei lang anhaltendem Schmerz psychologische Verfahren wie kognitive Verhaltenstherapie über den Arzt anstoßen (Q80)
- Keine Besserung nach einigen Wochen konservativer Therapie bei Gelenkschmerz: Rückmeldung an Zahnarzt oder Kieferchirurgen (Q80)`},{titel:"Durchführung",text:`- Übungen (Q85): „Ruhe im Mund“, „Zunge am Platz“, Wahrnehmungsübungen bei Wachbruxismus, Spiegelkoordinationsübungen, Progressive Muskelrelaxation
- Weichteil: funktionelle Weichteiltechnik und feuchte Wärme (Q85), Detonisierung von Kaumuskulatur, Mundboden und Nacken
- Mobilisation Kiefergelenk: Traktion, Gleiten ventral, mediolateral, dorsal. Die Griffe sind übliche Praxis ohne geöffnete Quelle, bitte gegen Kaltenborn (Q78) oder Lehrbuch prüfen.
- Weichteiltechniken allein reichen nicht, sie gehören zu einer aktiven Therapie (G05)`},{titel:"Red Flags",text:"Siehe G02. Besonders: akute Kiefersperre oder Luxation, Trauma mit Bissveränderung, Schwellung mit Fieber, neurologische Ausfälle im Gesicht. Dann ärztlich oder zahnärztlich abklären lassen."}],quellenKurz:{Q80:"DGFDT Wissenschaftliche Mitteilung 2022 (über zm 2023, Original nicht geöffnet)",Q81:"Türp et al. 2020",Q82:"Zawawi et al. 2003",Q83:"Armijo-Olivo et al. 2016 (nur zitiert)",Q84:"Schiffman et al. 2014 (nur zitiert)",Q85:"LZKS Literaturverzeichnis Physiotherapie bei CMD und Bruxismus 2025 (Sekundärquelle)"},stichworte:["cmd","craniomandibulaer","kraniomandibulaer","kiefergelenk","tmd","bruxismus","myoarthropathie"]}];var Lb={Q01:{id:"Q01",titel:"Nationale VersorgungsLeitlinie Nicht-spezifischer Kreuzschmerz",version:"NVL, nvl-007, 2. Auflage 2017",status:"geprüft 2026-10-09; Gültigkeit vor Nutzung prüfen",fundstelle:"https://www.leitlinien.de/themen/kreuzschmerz"},Q02:{id:"Q02",titel:"Spezifischer Kreuzschmerz",version:"S2k, 187-059, 2024-08",status:"geprüft 2026-10-09",fundstelle:"https://register.awmf.org/assets/guidelines/187-059l_S2k_Spezifischer-Kreuzschmerz_2024-08.pdf"},Q03:{id:"Q03",titel:"Lumbale Radikulopathie (DGN)",version:"S2k, 030-058, 2018-04",status:"geprüft 2026-10-09; vermutlich abgelaufen",fundstelle:"AWMF-Register 030-058"},Q04:{id:"Q04",titel:"Zervikale Radikulopathie (DGN)",version:"S2k, 030-082, 2018-01, verlängert",status:"geprüft 2026-10-09; Gültigkeit prüfen",fundstelle:"AWMF-Register 030-082"},Q05:{id:"Q05",titel:"Nackenschmerzen (DEGAM)",version:"S3, 053-007, 2025-08",status:"geprüft 2026-10-09",fundstelle:"https://register.awmf.org/assets/guidelines/053-007l_S3_Nackenschmerzen_2025-08.pdf"},Q06:{id:"Q06",titel:"Axiale Spondyloarthritis inkl. Morbus Bechterew",version:"S3, 060-003, 2019-10",status:"geprüft 2026-10-09; Gültigkeit prüfen",fundstelle:"https://register.awmf.org/assets/guidelines/060-003l_S3_Axiale-Spondyloa ry, 2005 (Seite auf aafp.org gelesen 2026-10-10)",Q149:"Wikipedia: Drawer test (Seite Anterior drawer test), 2026 (Seite gelesen 2026-10-10)",Q150:"Wikipedia: Pivot-shift test (nach Wheeless' Textbook of Orthopaedics), 2026 (Seite gelesen 2026-10-10)",Q151:"Wikipedia: Slump test, 2026 (Seite gelesen 2026-10-10)",Q152:"Physiotutors: Cluster of Wainner (nach Wainner RS et al. Spine 2003;28(1):52-62), 2026 (Seite gelesen 2026-10-10)",Q153:"PT Progress: Straight Leg Raise Test (Lasegue's Test); Zahlen nach van der Windt DAWM et al, 2026 (Seite gelesen 2026-10-10)",Q154:"Physiopedia: Straight Leg Raise Test, 2026 (Seite gelesen 2026-10-10)"};var Zb={stand:"2026-10-10",status:"Entwurf, Bezeichnungen sinngemäß aus Q91/Q90 übersetzt, mit amtlicher deutscher ICF (BfArM) abgleichen",hinweis:"Ziele folgen der ICF-Ebenenlogik: Partizipation/Aktivität (Patientenziel), darunter Körperfunktion (aus dem Befund). SMART-Prüfung nach Q87.",quellen:["Q86","Q87","Q88","Q89","Q90","Q91"],aktivitaeten:[{id:"d410",name:"Grundlegende Körperposition wechseln",code:"d410"},{id:"d415",name:"Körperposition halten (Sitzen, Stehen)",code:"d415"},{id:"d430",name:"Heben und Tragen von Gegenständen",code:"d430"},{id:"d440",name:"Feinmotorischer Handgebrauch",code:"d440"},{id:"d445",name:"Hand- und Armgebrauch",code:"d445"},{id:"d450",name:"Gehen",code:"d450"},{id:"d455",name:"Sich bewegen (Laufen, Klettern, Springen)",code:"d455"},{id:"d540",name:"Sich kleiden",code:"d540"},{id:"d550",name:"Essen",code:"d550"},{id:"d350",name:"Konversation",code:"d350"},{id:"d640",name:"Haushaltsführung",code:"d640"},{id:"d850",name:"Entgeltliche Beschäftigung",code:"d850"},{id:"d920",name:"Erholung und Freizeit (Sport, Hobby)",code:"d920"},{id:"d570",name:"Auf die eigene Gesundheit achten (Heimübungen)",code:"d570"}],aktivitaeten_je_region:{SCHULTER:["d445","d540","d430","d850","d920","d640","d570"],ELLENBOGEN:["d445","d430","d440","d850","d920","d570"],HANDGELENK:["d440","d445","d430","d850","d540","d570"],FINGER:["d440","d445","d540","d850","d640","d570"],HWS:["d415","d850","d410","d640","d920","d570"],BWS:["d415","d410","d430","d850","d640","d920","d570"],LWS:["d415","d410","d430","d850","d640","d920","d570"],HUEFTE:["d450","d410","d415","d850","d920","d455","d570"],KNIE:["d450","d410","d415","d850","d920","d455","d570"],OSG:["d450","d410","d415","d850","d920","d455","d570"],USG:["d450","d410","d415","d850","d920","d455","d570"],FUSS:["d450","d410","d415","d850","d920","d455","d570"],ZEHEN:["d450","d410","d415","d850","d920","d455","d570"],KIEFER:["d550","d350","d570"]},funktionsziele_manuell:[{id:"kraft",name:"Muskelkraft steigern",code:"b730"},{id:"ausdauer",name:"Muskelausdauer und Belastbarkeit steigern",code:"b740"},{id:"koord",name:"Koordination verbessern",code:"b760"},{id:"stabil",name:"Gelenkstabilität verbessern",code:"b715"},{id:"tonus",name:"Muskeltonus normalisieren",code:"b735"}],fristen:["innerhalb von 2 Wochen","innerhalb von 4 Wochen","innerhalb von 6 Wochen","innerhalb von 12 Wochen","nach 6 Behandlungen","nach 9 Behandlungen"],schlaf:{id:"schlaf",name:"Durchschlafen ermöglichen (nächtlicher Schmerz)",code:"b134"},geprueft_bruno:!1};var Ub={kategorien:[{id:"neuro",name:"Neurologisch",quelle:"Häufigkeit in Deutschland, Recherche Oktober 2026",items:["Migräne oder Spannungskopfschmerz", "Polyneuropathie", "Bandscheibenvorfall", "Demenz", "Epilepsie", "Normaldruckhydrozephalus", "Hemiparese", "Parkinson-Syndrom", "Schädel-Hirn-Trauma", "Multiple Sklerose", "Schlaganfall (Hirninfarkt)", "Zerebralparese", "Querschnittlähmung", "Hirnblutung", "Myasthenia gravis", "Fazialisparese", "Muskeldystrophie", "Chorea Huntington", "Amyotrophe Lateralsklerose (ALS)", "Hereditäre Ataxie", "Hirntumor", "Guillain-Barré-Syndrom"]},{id:"ortho",name:"Orthopädisch",quelle:"Häufigkeit in Deutschland, Recherche Oktober 2026",items:["Lumbalgie", "HWS-Syndrom", "Impingement-Syndrom der Schulter", "Kraniomandibuläre Dysfunktion (CMD)", "Plantarfasziitis", "Rotatorenmanschettenläsion", "Gonarthrose", "Skoliose", "Karpaltunnelsyndrom", "Sprunggelenksdistorsion", "Spinalkanalstenose", "Bandscheibenvorfall", "Coxarthrose", "Osteoporose", "Epicondylitis", "Tendinopathie", "Fraktur", "Z. n. Hüft-TEP", "Z. n. Knie-TEP", "Meniskusläsion", "Kreuzbandruptur"]},{id:"innere",name:"Innere Medizin",quelle:"Häufigkeit in Deutschland, Recherche Oktober 2026",items:["Adipositas", "Diabetes mellitus", "Koronare Herzkrankheit", "Asthma bronchiale", "pAVK", "COPD", "Herzinsuffizienz", "Z. n. Herzinfarkt", "Lymphödem", "Krebserkrankung", "Long COVID", "Diabetisches Fußsyndrom", "Z. n. Lungenentzündung"]}],quellen:["Q97","Q98"],hinweis:"Sortiert nach der Zahl der Betroffenen in Deutschland, die häufigste Diagnose steht oben. Bei Dauererkrankungen zählt, wie viele Menschen sie haben, bei akuten Ereignissen wie Schlaganfall, Unfall, Fraktur oder TEP die Fälle pro Jahr. Diese stehen deshalb weiter unten, als es der Zahl der Menschen mit Folgen entspricht. Fehlte eine deutsche Zahl, ist eine Schätzung aus anderen Ländern hochgerechnet, etwa beim Normaldruckhydrozephalus und bei der Rotatorenmanschette. Liegen Werte nah beieinander, ist die Reihenfolge nicht sicher."};var Vb={tests:{bbs:{name:"Berg Balance Scale",was:"Gleichgewicht im Sitzen und Stehen",einheit:"Punkte von 56",kurz:"14 Aufgaben im Sitzen und Stehen, zum Beispiel Aufstehen, Stehen mit geschlossenen Augen, Gegenstand aufheben und Einbeinstand. Jede Aufgabe wird von 0 bis 4 bewertet.",ziel:"Gleichgewicht und Sturzrisiko einschätzen und im Verlauf vergleichen.",norm:["Höchstwert 56. Unter 45: erhöhtes Sturzrisiko (ältere Erwachsene, Berg 1992).","Gesunde Ältere, Mittelwert: 60–69 J. 55; 70–79 J. 53–54; 80–89 J. 50–53 (Steffen 2002).","Parkinson: ≤ 52 als Sturzgrenze (Schlenstedt 2016). Chronischer Schlaganfall: ≤ 44 hohes Sturzrisiko (Alghadir 2018)."],normQuelle:"Q109",durch:"14 Aufgaben im Sitzen und Stehen, jede mit 0 bis 4 bewertet, Summe 0 bis 56. Material: Stoppuhr, Stuhl mit und ohne Armlehnen, Stufe oder Hocker, Lineal, Schuh. Dauer 15 bis 20 Minuten. Die Aufgaben im Einzelnen und die Bewertung stehen im Originalbogen, die Datenbankseite beschreibt sie nicht."},fga:{name:"Functional Gait Assessment",was:"Gleichgewicht beim Gehen",einheit:"Punkte von 30",kurz:"Zehn Gehaufgaben, zum Beispiel enger Gang, rückwärts gehen, Gehen mit geschlossenen Augen und Hindernis. Weiterentwicklung des Dynamic Gait Index.",ziel:"Dynamisches Gleichgewicht beim Gehen erfassen, auch bei geringeren Einschränkungen.",norm:["Höchstwert 30, höher = besser. Gesunde Erwachsene, Mittelwert: 40–49 J. 28,9; 50–59 J. 28,4; 60–69 J. 27,1; 70–79 J. 24,9; 80–89 J. 20,8 (Walker 2007).","Sturzrisiko: ≤ 22 bei älteren Erwachsenen (Wrisley 2010). Parkinson: < 15 (Duncan 2012) bzw. ≤ 18 (Yang 2014)."],normQuelle:"Q110",durch:"Zehn Gehaufgaben, jede mit 0 bis 3 bewertet (3 = normales Gehen). Markierte Strecke 6 m lang und 30 cm breit, Hindernis 23 cm hoch (zwei gestapelte Schuhkartons), Treppe mit beidseitigem Handlauf, Stoppuhr. Hilfsmittel erlaubt, keine körperliche Hilfe durch eine Person. Der Untersucher geht mindestens einen halben Schritt hinter dem Patienten. Dauer 5 bis 20 Minuten."},abc:{name:"Activities-specific Balance Confidence Scale (ABC)",was:"Vertrauen in das eigene Gleichgewicht",einheit:"Prozent",kurz:"Fragebogen: Der Patient schätzt in Prozent ein, wie sicher er bei alltäglichen Tätigkeiten ist, ohne das Gleichgewicht zu verlieren.",ziel:"Vertrauen ins eigene Gleichgewicht und Sturzangst erkennen.",norm:["0 bis 100 %, höher = mehr Sicherheit. Unter 67 %: Sturzrisiko (ältere Erwachsene, vestibuläre Störungen).","Parkinson: 69 % (Mak 2009) bzw. 55 % (Almeida 2016) für wiederholte Stürze. Chronischer Schlaganfall: ab etwa 81 spricht gegen mehrfache Stürze (Beninato 2009)."],normQuelle:"Q111",durch:"16 Alltagssituationen. Jede beginnt mit der Frage, wie sicher der Patient ist, nicht das Gleichgewicht zu verlieren oder unsicher zu werden. Antwort von 0 bis 100 %. Gesamtwert = Summe geteilt durch 16. Interview wird empfohlen, Dauer 5 bis 10 Minuten. Manche Patienten antworten nach ihrer üblichen Aktivität statt nach ihrer Sicherheit, dann auf die Frage zurückführen."},t10:{name:"10-Meter-Gehtest",was:"Gehgeschwindigkeit",einheit:"m/s",kurz:"Der Patient geht eine Strecke von zehn Metern, in angenehmem oder schnellem Tempo. Gemessen wird die Zeit, daraus ergibt sich die Gehgeschwindigkeit.",ziel:"Gehgeschwindigkeit als einfachen, aussagekräftigen Wert dokumentieren.",norm:["Gesunde Erwachsene, angenehmes Tempo, Mittelwert (Bohannon & Andrews 2011): Männer 20–59 J. 1,36–1,43 m/s; 60–69 J. 1,34; 70–79 J. 1,26; 80+ J. 0,97.","Frauen: 20–59 J. 1,31–1,39; 60–69 J. 1,24; 70–79 J. 1,13; 80+ J. 0,94.","Schlaganfall: < 0,4 m/s Haushaltsgeher; 0,4–0,8 eingeschränkter Gemeindegeher; > 0,8 Gemeindegeher."],normQuelle:"Q112",durch:"Gehstrecke 10 m (die Seite nennt 6 bis 12 m). Vor der Messstrecke gibt es einen Anlauf, der nicht mitgezählt wird. Zwei Durchgänge im angenehmen Tempo, zwei im schnellen, je Tempo wird gemittelt. Geschwindigkeit = Strecke geteilt durch Zeit. Hilfsmittel erlaubt, bei jeder Messung gleich dokumentieren. Der Untersucher geht mindestens einen halben Schritt hinter dem Patienten. Dauer bis 5 Minuten."},t6:{name:"6-Minuten-Gehtest",was:"Gehstrecke, Ausdauer",einheit:"Meter",kurz:"Der Patient geht sechs Minuten in eigenem Tempo so weit wie möglich. Gemessen wird die Strecke.",ziel:"Gehausdauer erfassen. Der Test kommt zuletzt, weil er anstrengt.",norm:["Mehr Strecke = besser. Gesunde Erwachsene, Mittelwert (McKay 2017): 20–59 J. Männer 736 m, Frauen 674 m; ab 60 J. Männer 599 m, Frauen 550 m.","Gemeindewohnende Ältere (Steffen 2002), Männer / Frauen: 60–69 J. 572 / 538 m; 70–79 J. 527 / 471 m; 80–89 J. 417 / 392 m.","Chronischer Schlaganfall: unter 331,65 m erhöhtes Sturzrisiko (Regan 2020)."],normQuelle:"Q113",durch:"So weit wie möglich in 6 Minuten gehen, im eigenen Tempo, auf standardisierter Strecke mit standardisierter Anweisung (ATS: 30 m mit Markierung alle 3 m, Wendepunkte mit Hütchen). Stehpausen sind erlaubt, die Uhr läuft weiter, Anzahl und Dauer der Pausen notieren. Hilfsmittel erlaubt und dokumentieren. Nur die vorgegebenen zeitgebundenen Rückmeldungen geben. Der Untersucher geht mindestens einen halben Schritt hinter dem Patienten. Wer nicht gehen kann, aber wieder gehen soll, erhält 0."},sts5:{name:"5-mal Aufstehen vom Stuhl (5xSTS)",was:"Transfer Sitz zu Stand",einheit:"Sekunden",kurz:"Der Patient steht so schnell wie möglich fünfmal von einem Stuhl auf, ohne die Arme zu benutzen. Gemessen wird die Zeit.",ziel:"Beinkraft und den Transfer vom Sitzen zum Stand einschätzen.",norm:["Weniger Zeit = besser (aus den Grenzwerten abgeleitet). Gesunde Erwachsene, Mittelwert (Bohannon 2007): 19–49 J. 6,2 s; 50–59 J. 7,1; 60–69 J. 8,1; 70–79 J. 10,0; 80–89 J. 10,6.","Ältere Referenz (Bohannon 2006): 60–69 J. 11,4 s; 70–79 J. 12,6; 80–89 J. 14,8.","Über 15 s: Sturzvorhersage ab 65 J. (Buatois 2008). Parkinson: über 16 s (Duncan 2011)."],normQuelle:"Q114",durch:"Freistehender Standardstuhl mit Armlehnen und Rückenlehne, Sitzhöhe 43 bis 45 cm, nicht an die Wand gestellt, bei Wiederholungen derselbe Stuhl. Arme vor der Brust verschränkt (nach Schlaganfall darf der betroffene Arm seitlich liegen). Start mit „Go“, fünfmal vollständig aufstehen und wieder hinsetzen. Die Zeit endet, wenn das Gesäß nach der fünften Wiederholung den Stuhl berührt. Vorher ein Übungsversuch."},tug:{name:"Timed Up and Go",was:"Mobilität, Sturzrisiko",einheit:"Sekunden",kurz:"Der Patient steht von einem Stuhl auf, geht drei Meter, dreht um, geht zurück und setzt sich. Gemessen wird die Zeit.",ziel:"Alltagsmobilität und Sturzrisiko einschätzen.",norm:["Weniger Zeit = besser. Gemeindewohnende Ältere, Mittelwert (Steffen 2002): 60–69 J. 8 s; 70–79 J. 9 s; 80–89 J. Männer 10 s, Frauen 11 s.","Sturzrisiko ab > 13,5 s (Shumway-Cook 2000). Schlaganfall: > 14 s (Andersson 2006). Parkinson: > 11,5 s (Nocera 2013) bzw. > 16 s (Mak 2009)."],normQuelle:"Q115",durch:"Patient sitzt mit dem Rücken an der Lehne (Stuhl mit Armlehnen, Sitzhöhe 44 bis 47 cm, frei stehend). Auf „Go“ aufstehen, 3 m in bequemem und sicherem Tempo gehen, umdrehen, zurückgehen und hinsetzen. Die Zeit läuft vom Kommando bis zum Sitzen. Ein Übungsdurchgang, bei jeder Messung dieselbe Gehhilfe."},dgi:{name:"Dynamic Gait Index",was:"Gehen bei wechselnden Anforderungen",einheit:"Punkte von 24",kurz:"Gehen bei acht wechselnden Anforderungen, zum Beispiel Tempowechsel, Kopfdrehen, Hindernis und Treppe.",ziel:"Gehsicherheit bei alltagsnahen Anforderungen und Sturzrisiko einschätzen.",norm:["Höchstwert 24, höher = besser. Gesunde Erwachsene, Mittelwert nach Dekade (Vereeck 2008): Dekade 3 und 4: 24,0; Dekade 5 und 6: 23,9; Dekade 7: 23,2; Dekade 8: 22,0.","Unter 19: erhöhtes Sturzrisiko (ältere Erwachsene, Shumway-Cook 1997; Parkinson, Dibble 2008). Schlaganfall: Median 13 (Lin 2010)."],normQuelle:"Q116",durch:"Acht Gehaufgaben auf markierter Strecke von 6,1 m (20 Fuß), jede mit 0 bis 3 bewertet (3 = keine Gangstörung): Gehen, Tempowechsel, Kopfdrehungen waagerecht und senkrecht, Hindernis übersteigen und umgehen, Drehen, Treppe. Material: Schuhkarton, zwei gleich große Hindernisse, Treppe. Dauer 10 bis 15 Minuten."},fmal:{name:"Fugl-Meyer-Assessment, untere Extremität",was:"Motorische Funktion Bein",einheit:"Punkte von 34",kurz:"Standardisierte Prüfung der motorischen Funktion des Beins: Reflexe, Bewegungsmuster, Koordination und Geschwindigkeit.",ziel:"Motorische Funktion und Erholung des Beins nach Schlaganfall beschreiben.",norm:["Höchstwert 34 (untere Extremität), je Item 0 bis 2. Normwerte und Schweregradgrenzen stehen auf der Seite nicht.","Veränderung, akuter Schlaganfall: 10 Punkte der unteren Extremität entsprechen 1,9 Punkten im FIM bei Entlassung (Shelton 2001)."],normQuelle:"Q118",durch:"Beobachtung der Bewegungen nach Protokoll. Je Item 0 = kann nicht ausführen, 1 = führt teilweise aus, 2 = führt vollständig aus. Obere und untere Extremität können getrennt geprüft werden. Material: Tennisball, kleiner runder Behälter, Reflexhammer. Etwa 30 Minuten, Kurzversionen unter 10 Minuten. Das Handbuch vorher lesen, die Einzelaufgaben stehen dort."},fmao:{name:"Fugl-Meyer-Assessment, obere Extremität",was:"Motorische Funktion Arm",einheit:"Punkte von 66",kurz:"Standardisierte Prüfung der motorischen Funktion von Arm und Hand: Reflexe, Bewegungsmuster, Koordination und Geschwindigkeit.",ziel:"Motorische Funktion und Erholung von Arm und Hand nach Schlaganfall beschreiben.",norm:["Höchstwert 66 (obere Extremität), je Item 0 bis 2. Normwerte und Schweregradgrenzen stehen auf der Seite nicht.","Bedeutsame Veränderung, chronischer Schlaganfall: mindestens 5,2 Punkte (Wagner 2008); je nach Anker 4,25–7,25 (Page 2012)."],normQuelle:"Q118",durch:"Beobachtung der Bewegungen nach Protokoll. Je Item 0 = kann nicht ausführen, 1 = führt teilweise aus, 2 = führt vollständig aus. Obere und untere Extremität können getrennt geprüft werden. Material: Tennisball, kleiner runder Behälter, Reflexhammer. Etwa 30 Minuten, Kurzversionen unter 10 Minuten. Das Handbuch vorher lesen, die Einzelaufgaben stehen dort."},fr:{name:"Functional Reach Test",was:"Gleichgewicht, Reichweite im Stand",einheit:"cm",kurz:"Der Patient streckt im Stand den Arm nach vorn, ohne einen Schritt zu machen. Gemessen wird, wie weit er reicht.",ziel:"Stabilitätsgrenzen im Stand abschätzen. Der Test ist schnell durchführbar.",norm:["Auf der Seite stehen keine Normwerte nach Alter. Sturzrisiko: unter 18,5 cm bei gebrechlichen Älteren (Thomas 2005); unter 7 Zoll (rund 17,8 cm) bei Gemeindeälteren (Weiner 1992).","Parkinson: unter 31,75 cm (Dibble & Lange 2006); Mittelwert 33,5 cm (Lim 2005). Subakuter Schlaganfall: Mittelwert 25,6 cm (Outermans 2010)."],normQuelle:"Q117",durch:"Der Patient steht seitlich nah an der Wand, ohne sie zu berühren. Der wandnahe Arm ist 90° angehoben, die Hand zur Faust geschlossen. Startwert am Köpfchen des 3. Mittelhandknochens am Maßstab ablesen. Dann so weit wie möglich nach vorn reichen, ohne einen Schritt zu machen. Die Differenz ist die Reichweite. Zwei Übungsdurchgänge, drei Testdurchgänge, gemittelt. Die abgewandelte Version (MFRT) wird im Sitzen nach vorn, rechts und links gemessen."},sis:{name:"Stroke Impact Scale",was:"Teilhabe und Alltag",einheit:"Punkte",kurz:"Fragebogen, in dem der Patient die Folgen des Schlaganfalls selbst einschätzt, zum Beispiel Kraft, Handfunktion, Alltag, Gedächtnis, Stimmung und Teilhabe.",ziel:"Die Sicht des Patienten auf Alltag und Teilhabe erfassen.",norm:["Jeder Bereich 0 bis 100, höhere Werte = weniger Beeinträchtigung (aus den Mittelwerten der Seite abgeleitet).","Schlaganfall unter 28 Tagen, Mittelwert (Duncan 2002): Kraft 61,9; Gedächtnis 77,8; Emotion 74,3; Kommunikation 81,0; Alltag 66,5; Mobilität 60,2; Handfunktion 55,9; Teilhabe 58,9.","Chronisch, im Mittel 18 Monate (Huang 2010): Kraft 40,7; Gedächtnis 81,5; Emotion 59,6; Kommunikation 89,7; Alltag 67,4; Mobilität 79,3; Handfunktion 29,6; Teilhabe 47,9."],normQuelle:"Q119",durch:"Fragebogen zum Selbstausfüllen (Selbstbericht), 59 Items, jedes auf einer 5-stufigen Skala nach erlebter Schwierigkeit. Die Bereichswerte werden auf 0 bis 100 umgerechnet. Der Patient muss einem 3-stufigen Auftrag folgen können, sonst gibt es eine Version für Angehörige. Dauer 15 bis 20 Minuten. Die Kurzform SIS-16 erfasst die körperliche Seite der letzten 2 Wochen."},arat:{name:"Action Research Arm Test",was:"Arm- und Handfunktion",einheit:"Punkte von 57",kurz:"Der Patient greift, hält und bewegt standardisierte Gegenstände, zum Beispiel Würfel, Becher und Kugel. Dazu kommen grobe Armbewegungen.",ziel:"Arm- und Handfunktion bei gezielten Aufgaben erfassen.",norm:["Höchstwert 57, höher = bessere Funktion der oberen Extremität. Chronischer Schlaganfall, Aufnahme: Mittelwert 29,2 (van der Lee 2001).","Akuter Schlaganfall, Mittelwert (Beebe & Lang 2009): 1 Monat 26,4; 3 Monate 39,5; 6 Monate 41,3. Bodeneffekt unter 3, Deckeneffekt über 54 (Nijland 2010)."],normQuelle:"Q120",durch:"19 Aufgaben in vier Teilen: Greifen, Halten, Pinzettengriff, grobe Bewegung. Je Aufgabe 3 = normal, 2 = vollständig, aber auffällig langsam oder mit großer Mühe, 1 = teilweise, 0 = nichts möglich. Zeitlimit überschritten oder Kontakt zur Stuhllehne verloren: 2 statt 3. Material: Testkit mit Holzblöcken, Murmeln, Gläsern und weiteren Teilen. Dauer 5 bis 15 Minuten. Das Protokoll von Yozbatiran 2008 beschreibt die Durchführung genau."},bbt:{name:"Box and Blocks Test",was:"Gezielter Griff",einheit:"Blöcke in 60 s",kurz:"Der Patient setzt in 60 Sekunden so viele Holzklötze wie möglich über eine Trennwand in das andere Fach.",ziel:"Grobe Greifgeschicklichkeit der Hand messen, Seitenvergleich möglich.",norm:["Anzahl Würfel in 60 s, mehr = besser. Mittelwert (Mathiowetz 1985), rechte / linke Hand. Männer: 40–44 J. 83,0 / 80,0; 50–54 J. 79,0 / 77,0; 60–64 J. 71,3 / 70,5; 70–74 J. 66,3 / 64,3; ab 75 J. 63,0 / 61,3.","Frauen: 40–44 J. 81,1 / 79,7; 50–54 J. 77,7 / 74,3; 60–64 J. 76,1 / 73,6; 70–74 J. 68,6 / 68,3; ab 75 J. 65,0 / 63,6. Für 20–39 Jahre nennt die Seite keine Werte."],normQuelle:"Q121",durch:"Der Patient sitzt am Tisch vor einer Box, die durch eine Trennwand in zwei Fächer geteilt ist. In einem Fach liegen 150 Holzwürfel (2,5 cm). In 60 Sekunden so viele Würfel wie möglich einzeln über die Trennwand ins andere Fach bringen. Die Hand muss die Trennwand überqueren. Mehrere gleichzeitig transportierte Würfel zählen als einer. Der Untersucher sitzt gegenüber. Jede Hand wird einzeln gemessen."},nhpt:{name:"9-Loch-Steckbrett-Test",was:"Feinmotorik der Hand",einheit:"Sekunden",kurz:"Der Patient steckt neun Stifte nacheinander in die Löcher eines Bretts und nimmt sie wieder heraus. Gemessen wird die Zeit.",ziel:"Feinmotorik und Fingergeschick messen.",norm:["Zeit in Sekunden, weniger = schneller. Gesunde Erwachsene, Mittelwert, rechte / linke Hand (Grice 2003). Männer: 21–25 J. 16,4 / 17,5; 41–45 J. 18,5 / 18,5; 61–65 J. 20,9 / 21,6; ab 71 J. 25,8 / 26,0.","Frauen: 21–25 J. 16,0 / 17,2; 41–45 J. 16,5 / 17,6; 61–65 J. 19,0 / 20,3; ab 71 J. 22,5 / 24,1.","Parkinson, dominante Hand (Earhart 2011): Hoehn & Yahr 1: 23,5 s; 2: 26,6; 3: 36,7. Multiple Sklerose: über 33,3 s = schwere Handfunktionsstörung (Lamers 2015)."],normQuelle:"Q122",durch:"Die Stifte einzeln aus dem Behälter nehmen und so schnell wie möglich in die Löcher stecken, danach einzeln herausnehmen und in den Behälter zurücklegen. Das Brett liegt in der Körpermitte, der Behälter auf der Seite der getesteten Hand. Nur die getestete Hand arbeitet, die andere darf den Brettrand halten. Die Zeit läuft ab Berühren des ersten Stifts bis der letzte Stift im Behälter landet."},ash:{name:"Ashworth-Skala",was:"Muskeltonus, Spastik",einheit:"Grad",kurz:"Der Untersucher bewegt ein Gelenk passiv durch und beurteilt den Widerstand der Muskulatur. Die Einstufung erfolgt in Graden.",ziel:"Muskeltonus beziehungsweise Spastik erkennen und den Grad dokumentieren.",norm:["Stufen 0, 1, 1+, 2, 3, 4. Höhere Stufe = mehr Muskeltonus. 0 = kein Tonusanstieg.","1 = leichter Anstieg mit kurzer Blockade und Nachlassen oder minimalem Widerstand am Ende der Bewegung. 1+ = leichter Anstieg mit Blockade, danach minimaler Widerstand über weniger als die Hälfte des Bewegungsausmaßes. 2 = deutlicher Anstieg über den größten Teil des Bewegungsausmaßes, Teil lässt sich noch leicht bewegen. 3 = deutlicher Anstieg, passive Bewegung schwierig. 4 = Teil starr in Beugung oder Streckung.","Normwerte und Cut-offs stehen auf der Seite nicht. Nach Botulinumtoxin gilt etwa 1 Punkt weniger als klinisch bedeutsam (Schlaganfall)."],normQuelle:"Q123",durch:"Das Gelenk wird passiv durch eine schnelle Dehnung mit hoher Geschwindigkeit bewegt, nach dem Widerstand wird die Stufe vergeben. Untersuchung auf einer Liege. Zur Lagerung und genauen Geschwindigkeit sagt die Seite nichts, das Vorgehen bei jeder Messung gleich halten."},tis:{name:"Trunk Impairment Scale",was:"Rumpfkontrolle",einheit:"Punkte von 23",kurz:"Der Patient sitzt und löst Aufgaben zur statischen und dynamischen Rumpfkontrolle sowie zur Koordination des Rumpfes.",ziel:"Rumpfkontrolle erfassen, die Gleichgewicht und Armfunktion mitbestimmt.",norm:["Gesamt 0 bis 23 (statisches Sitzen 0–7, dynamisches Sitzen 0–10, Koordination 0–6). Gesunde: Median 23 (Verheyden 2005).","Subakuter Schlaganfall (rund 61 Tage): Median 14, Bereich 0–21 (Verheyden 2004). Chronisch: Median 11; nicht gehfähig 8, gehfähig 14 (Verheyden 2006)."],normQuelle:"Q124",durch:"Der Patient sitzt auf der Bettkante oder Liege ohne Rücken- und Armstütze, Oberschenkel gestützt, Knie 90°, Füße flach auf dem Boden, Arme auf den Beinen, Kopf und Rumpf in Mittelstellung. Jede Aufgabe darf dreimal versucht werden, das beste Ergebnis zählt. Aufgaben mündlich erklären und bei Bedarf vormachen. Material: Liege ohne Rücken- und Armstütze, Protokollbogen, Stoppuhr. Bis etwa 20 Minuten."},mrs:{name:"Modifizierte Rankin-Skala",was:"Selbstständigkeit insgesamt",einheit:"Grad 0 bis 6",kurz:"Einstufung der Selbstständigkeit im Alltag in Graden von 0 (keine Symptome) bis 6 (verstorben). Sie beruht auf Gespräch und Beobachtung.",ziel:"Gesamteindruck von Behinderung und Selbstständigkeit festhalten und im Verlauf vergleichen.",norm:["Höhere Stufe = stärkere Behinderung. 0 = keine Symptome. 1 = trotz Symptomen keine wesentliche Behinderung. 2 = leichte Behinderung, eigene Angelegenheiten ohne Hilfe. 3 = mittelgradig, etwas Hilfe nötig, Gehen ohne Unterstützung möglich. 4 = mittelschwer bis schwer, ohne Hilfe weder Gehen noch Körperpflege. 5 = schwer, bettlägerig, inkontinent, ständige Pflege.","Stufe ≤ 1 gilt als gutes Ergebnis (Schlaganfall, 3 Monate, Ali 2013). Die Seite beschreibt nur die Stufen 0 bis 5. Stufe 6 nennt sie nicht, bitte im Original prüfen."],normQuelle:"Q125",durch:"Der Patient wird zu Alltagsaktivitäten befragt, auch zu Aktivitäten außer Haus. Neurologische Ausfälle wie Aphasie und kognitive Einschränkungen werden zusätzlich berücksichtigt. Eine einzige Einstufung, 5 bis 15 Minuten, auch telefonisch oder als strukturiertes Interview möglich."},updrs:{name:"MDS-UPDRS",was:"Parkinson-Symptome, Motorik",einheit:"Punkte",kurz:"Standardisierte Untersuchung der Parkinson-Symptome. Der motorische Teil prüft unter anderem Rigor, Tremor, Verlangsamung, Gang und Haltung.",ziel:"Schweregrad der Motorik bestimmen und den Verlauf unter Therapie und Medikation beobachten.",norm:["Je Item 0 = normal, 1 = leicht, 2 = mild, 3 = mäßig, 4 = schwer. Höhere Werte = stärkere Beeinträchtigung. Schweregradgrenzen stehen auf der Seite nicht.","Parkinson, Mittelwert (Goetz 2008): Teil I 11,5; Teil II 16,0; Teil III 36,8; Teil IV 4,0; gesamt 68,4."],normQuelle:"Q132",durch:"Vier Teile mit zusammen 50 Items. Teil I: nicht-motorischer Alltag (13 Fragen), im Gespräch mit Patient und Pflegeperson. Teil II: motorischer Alltag (13 Fragen), Fragebogen für den Patienten. Teil III: motorische Untersuchung durch den Untersucher (33 Werte aus 18 Aufgaben), ON- oder OFF-Zustand auf dem Bogen vermerken. Teil IV: motorische Komplikationen (6 Fragen). Etwa 30 Minuten. Laut Seite ist eine Schulung erforderlich."},moca:{name:"Montreal Cognitive Assessment (MoCA)",was:"Kognition",einheit:"Punkte von 30",kurz:"Kurzer Test zu Aufmerksamkeit, Gedächtnis, Sprache, Orientierung und Planen.",ziel:"Kognitive Einschränkungen erkennen, die Anleitung und Therapieplanung beeinflussen. Es ist ein Screening und keine Diagnose.",norm:["Höchstwert 30. 26 oder mehr gilt als normal (Nasreddine 2005). Bei 12 oder weniger Ausbildungsjahren 1 Punkt addieren.","Parkinson: unter 26 = leichte kognitive Störung, 21 = Grenze zur Demenz (Dalrymple-Alford 2010). Die Seite nennt 26 einmal als normal (≥ 26), einmal als Grenzwert (≤ 26), bitte im Original prüfen."],normQuelle:"Q126",durch:"16 Aufgaben in 11 Bereichen: visuell-räumlich und exekutiv, Benennen, Gedächtnis, Aufmerksamkeit, Sprache, Abstraktion, Orientierung. Papier, Bleistift, Stoppuhr, Bogen. Etwa 10 Minuten. Es gibt drei Parallelversionen gegen Lerneffekte. Laut Seite ist seit dem 1. September 2019 eine Schulung mit Zertifizierung erforderlich."},mbest:{name:"Mini-BESTest",was:"Gleichgewicht, mehrere Systeme",einheit:"Punkte von 28",kurz:"14 Aufgaben aus vier Bereichen: vorausschauende Anpassung, Reaktion auf Störungen, sensorische Orientierung und dynamisches Gehen.",ziel:"Gleichgewichtsprobleme nach Teilsystem unterscheiden, auch bei leichteren Einschränkungen.",norm:["Höchstwert 28 (14 Items, je 0 bis 2). Parkinson: unter 21 trennt Personen mit und ohne Gleichgewichtsdefizit (King 2012); ≤ 19 für wiederholte Stürze (Mak 2013).","Chronischer Schlaganfall: ≤ 17,5 mit Sturzanamnese (Tsang 2013). Bedeutsame Veränderung: 4 Punkte, Gleichgewichtsstörungen (Godi 2013)."],normQuelle:"Q127",durch:"14 Aufgaben in vier Bereichen: vorausschauende Haltungsanpassung, Reaktion auf Störungen, sensorische Orientierung, dynamisches Gehen. Je Aufgabe 0 bis 2. Bei seitengetrennten Aufgaben zählt nach dem Original der niedrigere Wert. Material: Schaumstoffblock 60 × 60 cm, 10°-Rampe, zwei Stühle, 23 cm hohe Box, Stoppuhr, Markierung bei 3 m. Dauer 10 bis 15 Minuten."},pdq:{name:"PDQ-39 oder PDQ-8",was:"Lebensqualität bei Parkinson",einheit:"Punkte",kurz:"Fragebogen zur Lebensqualität bei Parkinson. Es gibt eine Kurzform mit 8 und eine Langform mit 39 Fragen.",ziel:"Auswirkungen auf Alltag, Stimmung und Lebensqualität aus Patientensicht erfassen.",norm:["PDQ-39: je Item 0 = nie bis 4 = immer. 8 Bereiche mit je 0 bis 100, höher = stärker belastet. Gesamtwert (PDSI) = Mittel der 8 Bereiche. Für den PDQ-8 nennt die Seite keinen Bereich.","Parkinson, Mittelwert (Hagell 2007, n = 202): Mobilität 43,0; Alltag 38,9; Emotion 37,9; Stigma 27,5; soziale Unterstützung 14,8; Kognition 33,0; Kommunikation 28,0; Körperbeschwerden 40,9.","Eine Verbesserung um mindestens 5,39 Punkte im PDSI gilt als klinisch relevant (Tickle-Degnen 2010)."],normQuelle:"Q128",durch:"Fragebogen zum Selbstausfüllen, bezieht sich auf den letzten Monat, 10 bis 20 Minuten. Alle Items müssen beantwortet sein. Bereichswert = Summe der Items geteilt durch den möglichen Höchstwert, mal 100. Kostenlos nur für nichtkommerzielle akademische Nutzung oder öffentlich finanzierte Versorgung, sonst Lizenz nötig."},fog:{name:"Freezing of Gait Questionnaire",was:"Gangblockaden",einheit:"Punkte",kurz:"Fragebogen zu Gangblockaden im Alltag, zum Beispiel wie oft sie auftreten und wann.",ziel:"Gangblockaden erkennen und im Verlauf vergleichen.",norm:["Gesamt 0 bis 24 (6 Items, je 0 bis 4), höher = schwereres Freezing. Cut-off steht auf der Seite nicht. Item 3 gilt als gute Einzelfrage zur Häufigkeit.","Parkinson, Hoehn & Yahr II–IV (Nieuwboer 2007, n = 153): Median 7 bis 9 über vier Messzeitpunkte, Quartile etwa 3 bis 14."],normQuelle:"Q129",durch:"Fragebogen mit 6 Items, 5 bis 10 Minuten. Ausfüllen im besten Zustand (ON-Phase). Nach der Seite führt die Therapeutin oder der Therapeut das Freezing vor. Die meisten Items beziehen sich auf die letzte Woche."},pfs:{name:"Parkinson-Fatigue-Skala",was:"Erschöpfung",einheit:"Punkte",kurz:"Fragebogen zur Erschöpfung (Fatigue) bei Parkinson.",ziel:"Erschöpfung erfassen, die Belastbarkeit und Dosierung der Therapie beeinflusst.",norm:["PFS-16: Summe 16 bis 80 oder Mittelwert 1 bis 5, höher = mehr Erschöpfung. Mittelwert über 2,95: Fatigue vorhanden; über 3,30: als Problem erlebt (Brown 2005).","Parkinson, Mittelwert (Brown 2005, n = 495): 3,41. Binärer Score 0 bis 16: über 7 bzw. über 8 entsprechend."],normQuelle:"Q130",durch:"16 Aussagen zur Erschöpfung der letzten 2 Wochen. Zustimmung von 1 (stimme gar nicht zu) bis 5 (stimme voll zu). Fragebogen zum Selbstausfüllen, etwa 5 Minuten."},t360:{name:"360°-Drehtest",was:"Drehen im Stand",einheit:"Sekunden oder Schritte",kurz:"Der Patient dreht sich im Stand einmal um die eigene Achse. Gemessen werden Zeit oder Schritte.",ziel:"Drehfähigkeit prüfen, wichtig für Sturzrisiko und Gangblockaden.",norm:["Die Seite nennt keine Richtung. Ältere Selbstständige (Gill 1995): über 3,8 s steigt die Rate der Abhängigkeit deutlich. Mittelwert Nicht-Stürzer 2,2 s, Stürzer 2,7 s (Dai 2012).","Parkinson, Mittelwert Zeit / Schritte (Schenkman 2011): Hoehn & Yahr 1–1,5: 3,33 s / 6,3; 2: 3,91 s / 7,6; 2,5: 4,81 s / 8,7; 3: 7,34 s / 11,0."],normQuelle:"Q131",durch:"Eine Klebebandmarkierung am Boden zeigt den Start. Der Patient steht mit hängenden Armen, Füße bequem auseinander. Bei „Go“ eine volle Drehung um 360° in beliebige Richtung. Die Zeit endet, wenn die Schultern wieder zum Untersucher zeigen. Zwei Durchgänge, gemittelt. Material: Stoppuhr."},painfularc:{name:"Painful Arc",was:"Schmerz bei der Abduktion",einheit:"positiv oder negativ",kurz:"Schmerzprovokation bei der Abduktion des Arms. Die Durchführung steht in den gelesenen Quellen nicht.",ziel:"Hinweis auf eine subakromiale Schmerzursache gewinnen und im Verlauf vergleichen.",norm:["Positiv ist der Test, wenn die Abduktion den Schmerz auslöst. Den Winkelbereich nennen die gelesenen Quellen nicht.","Für subakromiales Impingement: LR+ 3,7 (95 % KI 1,9–7,0), LR− 0,36 (0,23–0,54), eine Studie mit 104 Schultern. Von sechs schmerzbasierten Tests der einzige mit LR+ über 2,0 oder LR− unter 0,5.","Gepoolt: Sensitivität 0,53 (0,31–0,74), Spezifität 0,76 (0,68–0,84), 4 Studien, 756 Patienten."],normQuelle:"Q140",durch:"Die Durchführung konnte ich in den gelesenen Quellen nicht belegen. Bitte nach deinem Standard ergänzen.",weitere:["Q139"]},hawkins:{name:"Hawkins-Kennedy-Test",was:"Schmerz bei Innenrotation, Hinweis auf Impingement",einheit:"positiv oder negativ",kurz:"Der Arm wird in 90° Flexion gebracht, der Ellbogen ist 90° gebeugt. Dann rotiert der Untersucher den Arm nach innen.",ziel:"Hinweis auf ein subakromiales Impingement gewinnen.",norm:["Positiv ist der Test bei Schmerz in der Innenrotation.","Gepoolt für Impingement: Sensitivität 0,80 (0,72–0,86), Spezifität 0,56 (0,45–0,67), LR+ 1,84, LR− 0,35, 7 Studien, 944 Patienten. Die Übersicht sieht den Wert eher im Ausschluss bei negativem Test, nennt den LR− dafür aber schwach.","Zusammen mit Painful Arc und Infraspinatus-Test (Park 2005): alle drei positiv LR+ 10,56; zwei von drei positiv LR+ 5,03; alle drei negativ LR− 0,17."],normQuelle:"Q139",durch:"Patient sitzt oder steht. Der Untersucher bringt den Arm in 90° Flexion bei 90° gebeugtem Ellbogen und rotiert den Arm dann nach innen. Positiv bei Schmerz in der Innenrotation (nach Flynn, Cleland und Whitman 2008).",weitere:["Q141"]},neer:{name:"Neer-Test",was:"Passive Elevation, Hinweis auf Impingement",einheit:"positiv oder negativ",kurz:"Der Untersucher fixiert die Skapula und hebt den innenrotierten Arm passiv nach vorn an. Positiv ist der Test, wenn der vertraute Schmerz auftritt.",ziel:"Hinweis auf ein subakromiales Impingement gewinnen.",norm:["Positiv, wenn die passive Elevation den vertrauten Schmerz auslöst. Eine Bewegungseinschränkung ohne Schmerz zählt nicht, sollte aber notiert werden.","Gepoolt für Impingement: Sensitivität 0,72 (0,60–0,81), Spezifität 0,60 (0,40–0,77), LR+ 1,79, LR− 0,47, 7 Studien, 946 Patienten.","Die Übersicht empfiehlt keinen Einzeltest als sicher diagnostisch."],normQuelle:"Q139",durch:"Patient sitzt oder steht aufrecht, der Arm hängt entspannt. Der Untersucher steht seitlich und fixiert mit einer Hand den oberen Rand der Skapula, damit sie nicht aufwärts rotiert. Bei gestrecktem Ellbogen wird der Arm nach innen rotiert (Daumen zeigt nach unten) und mit der anderen Hand langsam nach vorn bis zum Endbereich angehoben. Abbruch bei Symptomen, Abwehrspannung oder Einschränkung. Notieren: Schmerzort, Winkel des Schmerzbeginns.",weitere:["Q145"]},droparm:{name:"Drop-Arm-Test",was:"Kontrolle beim Absenken, Hinweis auf Supraspinatusruptur",einheit:"positiv oder negativ",kurz:"Der Arm wird passiv auf 90° abduziert und der Patient soll ihn langsam wieder absenken.",ziel:"Hinweis auf eine vollständige Ruptur der Supraspinatussehne gewinnen.",norm:["Positiv, wenn der Arm plötzlich fällt oder nicht kontrolliert gesenkt werden kann. Schmerz beim Absenken kann dazukommen.","Vollständige Supraspinatusruptur: Sensitivität 73 %, Spezifität 77 % (Miller 2008). LR+ 3,3 (1,0–11), eine Studie mit 104 Schultern.","Die Werte schwanken je Studie. Die Genauigkeit soll in der Kombination mit anderen Tests besser werden."],normQuelle:"Q142",durch:"Untersucher steht hinter dem sitzenden Patienten. Der gestreckte Arm wird mit voller Außenrotation passiv auf 90° abduziert und am Ellbogen gestützt. Dann löst der Untersucher die Stütze, und der Patient senkt den Arm langsam zurück in die Neutralstellung.",weitere:["Q140"]},erlag:{name:"Außenrotations-Lag-Sign",was:"Halten der Außenrotation, Hinweis auf Supra- und Infraspinatusruptur",einheit:"positiv oder negativ",kurz:"Der Arm wird bei 90° gebeugtem Ellbogen bis zum Anschlag außenrotiert. Der Patient soll die Stellung halten.",ziel:"Hinweis auf eine vollständige Ruptur von Supra- oder Infraspinatus gewinnen.",norm:["Positiv, wenn der Patient die Stellung nicht halten kann.","Vollständige Rupturen von Supra- und Infraspinatus: LR+ 7,2 (1,7–31), eine Studie mit 37 Patienten und 46 Schultern, zitiert nach der Hermans-Metaanalyse. Er gilt in dieser Quelle als genaueste Kraftprobe für diese Rupturen.","Zu Sensitivität und LR− nennt die Quelle keine Zahlen."],normQuelle:"Q140",durch:"Ellbogen 90° gebeugt, Schulter bis zum Anschlag außenrotiert. Der Patient soll diese Stellung halten. Positiv, wenn er es nicht kann. Genauere Handgriffe beschreibt die Quelle nicht."},liftoff:{name:"Lift-off-Test (Gerber)",was:"Abheben der Hand vom Rücken, Hinweis auf Subscapularis",einheit:"positiv oder negativ",kurz:"Die Hand liegt auf dem Rücken. Der Patient soll den Handrücken aktiv vom Rücken abheben.",ziel:"Hinweis auf eine Subscapularisläsion gewinnen.",norm:["Positiv, wenn der Handrücken nicht vom Rücken abgehoben werden kann. Voraussetzung: volle passive Innenrotation, Schmerz darf nicht begrenzen.","Subscapularis, Lag-Zeichen als Kriterium: LR+ 8,50, LR− 0,27 (Lasbleiz 2014).","Gerber und Krushell: 8 von 9 Patienten mit vollständiger Rotatorenmanschettenruptur einschließlich Subscapularis und 12 von 16 mit isolierter Subscapularisruptur hatten einen abnormen Test.","Verwandt, Innenrotations-Lag-Sign: LR+ 5,6 (2,6–12), LR− 0,04 (0,0–0,58), eine Studie mit 37 Patienten."],normQuelle:"Q147",durch:"Patient steht. Der Handrücken liegt auf dem Rücken in Höhe der mittleren Lendenwirbelsäule. Der Patient hebt ihn ab und hält dabei Innenrotation und Extension des Arms. Der Test setzt volle passive Innenrotation voraus, Schmerz darf nicht begrenzen. Normal: der Handrücken lässt sich abheben.",weitere:["Q140"]},belly:{name:"Belly-Press-Test",was:"Druck auf den Bauch, Hinweis auf Subscapularis",einheit:"positiv oder negativ",kurz:"Die Handfläche liegt auf dem Bauch. Der Patient drückt über Innenrotation gegen den Bauch.",ziel:"Hinweis auf eine Subscapularisläsion gewinnen, wenn der Lift-off-Test nicht möglich ist.",norm:["Positiv, wenn der Patient mit Handgelenkbeugung, Schulteradduktion und Schulterextension ausweicht; der Ellbogen fällt hinter den Rumpf.","Subscapularisriss: Sensitivität 0,34, Spezifität 0,96 (Kappe 2018). Nur Grad 2–4: 0,37 und 0,92.","Ein negativer Test schließt einen Subscapularisriss nicht aus. Zuverlässigkeit zwischen Untersuchern: κ 0,65–0,78 (Cadogan 2011)."],normQuelle:"Q143",durch:"Patient sitzt oder steht, der Ellbogen ist 90° gebeugt, die Handfläche liegt auf dem Oberbauch unterhalb des Processus xiphoideus. Der Patient drückt die Hand über Innenrotation gegen den Bauch."},apprehension:{name:"Apprehension-Test",was:"Angst vor Luxation, Hinweis auf vordere Instabilität",einheit:"positiv oder negativ",kurz:"Provokationstest für eine vordere Schulterinstabilität. Die Durchführung steht in den gelesenen Quellen nicht.",ziel:"Hinweis auf eine vordere Instabilität gewinnen.",norm:["Apprehension (2 Studien, 409 Patienten): Sensitivität 65,6 % (52,7–77,1), Spezifität 95,4 % (93,3–97,8), LR+ 17,21, LR− 0,39.","Relocation (3 Studien, 509 Patienten): Sensitivität 64,6 %, Spezifität 90,2 %, LR+ 5,48, LR− 0,55.","Apprehension, Relocation und Surprise sind laut der Übersicht die einzigen Tests mit guter klinischer Aussagekraft bei vorderer Instabilität."],normQuelle:"Q139",durch:"Die Durchführung konnte ich in den gelesenen Quellen nicht belegen. Bitte nach deinem Standard ergänzen."},lachman:{name:"Lachman-Test",was:"Vordere Schublade bei 20–30° Beugung",einheit:"positiv oder negativ",kurz:"Der Untersucher zieht die Tibia bei leicht gebeugtem Knie nach vorn und beurteilt Weg und Endgefühl.",ziel:"Hinweis auf eine Ruptur des vorderen Kreuzbands gewinnen.",norm:["Positiv bei weichem Endgefühl. Mehr als 2 mm vordere Translation gegenüber der gesunden Seite oder insgesamt 10 mm sprechen für einen Riss.","Likelihood-Ratios bei VKB-Riss: LR+ 12,4, LR− 0,14 (Jackson 2003). Ein positiver Test spricht stark für den Riss, ein negativer eher dagegen.","Katz und Fingeroth 1986 (Untersuchung in Narkose): akut Sensitivität 77,7 %, subakut und chronisch 84,6 %, Spezifität jeweils über 95 %. In der Praxis kann die Genauigkeit niedriger liegen. Bei frischem Trauma kann eine Schwellung die Beurteilung stören."],normQuelle:"Q144",durch:"Patient in Rückenlage, Knie 20–30° gebeugt, unterstützt durch ein Handtuch oder das Knie des Untersuchers, Bein leicht außenrotiert. Eine Hand liegt hinter der Tibia, die andere am Oberschenkel, der Daumen an der Tuberositas tibiae. Der Untersucher zieht die Tibia nach vorn. Vorher das hintere Kreuzband prüfen, weil ein Riss das Ergebnis verfälscht.",weitere:["Q148"]},schublade:{name:"Vordere Schublade",was:"Tibiaverschiebung nach vorn bei 90° Beugung",einheit:"positiv oder negativ",kurz:"Der Untersucher zieht die Tibia bei 90° gebeugtem Knie nach vorn und vergleicht mit der Gegenseite.",ziel:"Hinweis auf eine Ruptur des vorderen Kreuzbands gewinnen.",norm:["Positiv bei vermehrter vorderer Tibiatranslation im Seitenvergleich oder fehlendem festen Anschlag.","VKB-Riss: LR+ 3,7, LR− 0,6 (Jackson 2003). Sie ist weit verbreitet, gilt aber als die am wenigsten hilfreiche Probe für das VKB."],normQuelle:"Q148",durch:"Patient in Rückenlage, Hüfte 45° gebeugt, Knie 90°, Füße flach auf der Liege. Der Untersucher sitzt vor dem Knie und greift die Tibia unterhalb des Gelenkspalts, die Daumen liegen beidseits der Patellasehne. Die Tibia wird nach vorn gezogen.",weitere:["Q149"]},pivotshift:{name:"Pivot-Shift-Test",was:"Subluxation bei Streckung bis Beugung",einheit:"positiv oder negativ",kurz:"Provokationstest für die Rotationsinstabilität bei VKB-Insuffizienz. Der Untersucher beobachtet die Tibiaposition während der Beugung.",ziel:"Hinweis auf eine VKB-Ruptur mit Instabilität gewinnen.",norm:["Positiv, wenn die Tibiaposition sich bei 30–40° Beugung reponiert oder eine vordere Subluxation bei der Streckung zu spüren ist. Eine Gradeinteilung nennt die Quelle nicht.","VKB-Riss („Pivot test“): LR+ 20,3, LR− 0,4 (Jackson 2003). Ein positiver Test spricht stark für den Riss.","Abwehrspannung oder eine blockierte Meniskusläsion kann falsch negativ machen. In Narkose ist die Empfindlichkeit höher."],normQuelle:"Q148",durch:"Patient in Rückenlage, Hüfte passiv auf 30° gebeugt und abduziert, damit der Tractus iliotibialis entspannt. Der Untersucher fasst Unterschenkel und Knöchel, hält 20° Tibiainnenrotation und lässt das Knie in volle Streckung sinken. Die andere Hand liegt nahe dem proximalen Tibiofibulargelenk und verstärkt die Innenrotation. Unter Innenrotation wird ein Valgusstress gegeben und das Knie langsam gebeugt.",weitere:["Q150"]},mcmurray:{name:"McMurray-Test",was:"Klick und Gelenkspaltschmerz bei Rotation",einheit:"positiv oder negativ",kurz:"Der Untersucher bewegt das Knie mit rotierter Tibia aus der Beugung in die Streckung und tastet den Gelenkspalt.",ziel:"Hinweis auf eine Meniskusläsion gewinnen.",norm:["Positiv bei tastbarem oder hörbarem Klick, der den vertrauten Gelenkspaltschmerz auslöst. Manche Beschreibungen zählen Schmerz oder Klick allein. Schmerz ohne Klick ist weniger spezifisch.","Meniskusriss: LR+ 17,3, LR− 0,5 (Jackson 2003). Gelenkspaltdruckschmerz hilft dagegen wenig (LR+ 1,1, LR− 0,8).","Eine neuere Studie (2025, 152 Erwachsene von 20 bis 40 Jahren, Arthroskopie als Referenz, laut Anbieterseite): medialer Riss Sensitivität 60,9 %, Spezifität 61,5 %; lateraler Riss 55,6 % und 96,3 %. Die Studie habe ich nicht gelesen, die Werte liegen deutlich unter denen der älteren Übersicht."],normQuelle:"Q148",durch:"Rückenlage, Bein entspannt. Eine Hand hält die Ferse und steuert Beugung, Streckung und Tibiarotation, die andere liegt am Knie, Daumen am medialen, Finger am lateralen Gelenkspalt. Start in maximaler schmerzfreier Beugung, nicht erzwingen. Lateraler Meniskus: Tibia innenrotieren, Varusstress, Knie langsam strecken. Medialer Meniskus: wieder beugen, Tibia außenrotieren, Valgusstress, Knie langsam strecken. Dabei den Gelenkspalt tasten und nach Schmerz, Klick oder Einklemmung fragen.",weitere:["Q146"]},slr:{name:"Straight Leg Raise (Lasègue)",was:"Beinanheben, Hinweis auf lumbale Wurzelreizung",einheit:"positiv oder negativ",kurz:"Das gestreckte Bein wird in Rückenlage passiv angehoben. Gefragt wird, ob Beinschmerz entsteht und bei welchem Winkel.",ziel:"Hinweis auf eine lumbale Radikulopathie gewinnen und im Verlauf vergleichen.",norm:["Positiv bei Schmerz oder Symptomen im Bein unterhalb des Knies zwischen 30° und 70° Hüftbeugung, Hinweis auf Bandscheibenvorfall L4 bis S1. Schmerz erst über 70° spricht eher für Hamstrings, Gesäß- oder Hüftkapsel, Hüfte oder ISG.","Gepoolt, überwiegend operierte Patienten (Cochrane, van der Windt): Sensitivität 0,92 (0,87–0,95), Spezifität 0,28 (0,18–0,40). Gekreuzter SLR: Spezifität 0,90 (0,85–0,94), Sensitivität 0,28 (0,22–0,35).","Der SLR eignet sich damit eher zum Ausschluss. Verkürzte Hamstrings können falsch positiv machen. Die Studien betrafen operierte Gruppen mit 58–98 % Bandscheibenvorfällen und sind auf die Primärversorgung nur eingeschränkt übertragbar."],normQuelle:"Q153",durch:"Patient in Rückenlage, beide Beine gestreckt, kein Kissen unter dem Kopf. Das nicht betroffene Bein zuerst. Der Untersucher hebt das gestreckte Bein an der Ferse passiv an (Hüftbeugung), bis Symptome oder Spannung auftreten, notiert Winkel und Schmerzort. Zur Sensibilisierung kann Dorsalextension des Fußes oder Nackenflexion dazukommen. Die Zuverlässigkeit der Gradangabe ist niedrig.",weitere:["Q154"]},slump:{name:"Slump-Test",was:"Neurodynamik im Sitzen",einheit:"positiv oder negativ",kurz:"Im Sitzen wird die Wirbelsäule gebeugt, dann Knie gestreckt und Fuß dorsal extendiert. Gefragt wird nach ischialgiformem Schmerz.",ziel:"Hinweis auf eine neurale Mechanosensitivität des N. ischiadicus gewinnen.",norm:["Positiv bei ischialgiformem Schmerz (ausstrahlend, scharf, einschießend) oder anderen neurologischen Symptomen.","Zahlen zur Genauigkeit stehen in der gelesenen Quelle nicht. Sie nennt viele falsch positive Ergebnisse und rät, den Test mit anderen zu kombinieren.","Die Quelle ist eine Wiki-Seite, Teile sind dort als ungesichert markiert. Bitte mit einer Fachquelle abgleichen."],normQuelle:"Q151",durch:"Patient sitzt am Rand der Liege. Er sackt mit dem Rumpf nach vorn (Schultern gerundet), der Untersucher gibt dem Rumpf leichten Druck. Dann Kinn zur Brust, das Knie wird aktiv gestreckt, der Fuß dorsal extendiert. Bei Schmerz muss der Test nicht weitergeführt werden."},spurling:{name:"Spurling-Test A",was:"Kompression bei seitgeneigtem Nacken",einheit:"positiv oder negativ",kurz:"Der Nacken wird zur betroffenen Seite geneigt und der Untersucher gibt leichten Überdruck. Gefragt wird, ob der vertraute Armschmerz zunimmt.",ziel:"Hinweis auf eine zervikale Radikulopathie gewinnen.",norm:["Positiv bei Zunahme des vertrauten Armschmerzes. Eine zweite Quelle beschreibt die Reproduktion radikulärer Symptome als positiv.","Wainner 2003: Sensitivität 50 %, Spezifität 86 %. Eine zweite Quelle nennt den Test hochspezifisch, ohne Zahlen.","Im Cluster (Spurling, ULTT A, Distraktion, Rotation unter 60°): 3 von 4 positiv LR+ 6,1; 4 von 4 positiv LR+ 30,3 (Konfidenzintervall 1,7–538,2). Die Quelle sieht nur einen mäßigen klinischen Wert und fragt, ob die Krankenhausdaten auf die Primärversorgung passen."],normQuelle:"Q152",durch:"Patient sitzt. Der Nacken wird zur betroffenen Seite geneigt, der Untersucher gibt Überdruck von etwa 7 kg. Eine zweite Quelle beschreibt zusätzlich Extension und axialen Druck, um das Foramen zu verengen.",weitere:["Q133"]},ultt:{name:"ULTT A (Medianus)",was:"Nervendehnung des Arms",einheit:"positiv oder negativ",kurz:"Der Arm wird in einer Folge von Positionen angespannt (Schulter, Ellbogen, Handgelenk, Finger) und der Nacken zur Gegenseite geneigt.",ziel:"Hinweis auf eine zervikale Radikulopathie gewinnen; vor allem zum Ausschluss.",norm:["Positiv bei Reproduktion der Beschwerden, zum Beispiel einschießender Schmerz oder Kribbeln. Eine zweite Quelle: Schmerz in jedem Schritt der Abfolge.","Wainner 2003: Sensitivität 97 %, Spezifität 22 %. Eine Quelle nennt ihn den besten Test zum Ausschluss, eine zweite den sensitivsten."],normQuelle:"Q152",durch:"Patient in Rückenlage. Schulter niederdrücken, auf 110° abduzieren und außenrotieren, Unterarm supinieren, Handgelenk und Finger strecken, dann den Ellbogen langsam strecken. Zur Bestätigung etwas Ellbogenspannung lösen und den Nacken zur Gegenseite neigen lassen. Eine zweite Quelle beschreibt ihn mit 90° Abduktion.",weitere:["Q133"]},distraktion:{name:"Distraktionstest",was:"Längszug am Kopf",einheit:"positiv oder negativ",kurz:"Der Untersucher zieht in Rückenlage mit den Fingern unter dem Hinterkopf in Längsrichtung. Gefragt wird, ob der Armschmerz nachlässt.",ziel:"Hinweis auf eine zervikale Radikulopathie gewinnen; bestätigend.",norm:["Positiv bei Abnahme des vertrauten Armschmerzes. Sinnvoll nur bei aktuellem Armschmerz oder Kribbeln.","Wainner 2003: Sensitivität 44 %, Spezifität 90 %."],normQuelle:"Q152",durch:"Patient in Rückenlage. Der Untersucher hakt die Finger unter das Hinterhaupt und gibt Längszug."},rotation60:{name:"HWS-Rotation zur betroffenen Seite",was:"Rotationswinkel unter 60°",einheit:"positiv oder negativ",kurz:"Die aktive Rotation zur betroffenen Seite wird in Grad gemessen. Unter 60° gilt im Cluster als positiv.",ziel:"Hinweis auf eine zervikale Radikulopathie gewinnen; vor allem zum Ausschluss.",norm:["Positiv bei Rotation unter 60° zur betroffenen Seite. Gesunde erreichen etwa 80°.","Wainner 2003: Sensitivität 89 %, Spezifität 49 %."],normQuelle:"Q152",durch:"Der Patient dreht den Kopf aktiv zur betroffenen Seite. Gemessen wird am besten mit Inklinometer oder CROM-Gerät."},"oeffnungsbahn":{"name": "Öffnungsbahn (Deviation/Deflexion)", "was": "Asymmetrische Mundöffnung, Diskus- oder Muskelproblem", "einheit": "positiv oder negativ", "kurz": "Patient öffnet langsam maximal, Therapeut beobachtet die Unterkiefermitte gegenüber der Oberkiefermitte.", "ziel": "Seitabweichung der Öffnungsbahn erkennen.", "norm": ["Positiv, wenn der Unterkiefer beim Öffnen mehr als 2 mm zu einer Seite oder wechselnd zu beiden Seiten abweicht (CMD-Kurzbefund).", "Keine Kennwerte zur diagnostischen Genauigkeit in den gelesenen Quellen gefunden."], "durch": "Sitz, Kopf aufrecht, Zähne locker in Schlussbiss. Der Patient öffnet langsam so weit wie möglich und schließt wieder, mehrmals. Beobachtet wird die Inzisalmitte: Deviation (S-förmig, zurück zur Mitte) oder Deflexion (bleibende Abweichung zur Seite). Positiv ab mehr als 2 mm Abweichung.", "position": "Sitz", "quellen": ["CMD-Kurzbefund nach Ahlers/Jakstat (ZWP 2015) – https://www.zwp-online.info/fachgebiete/kieferorthopaedie/diagnostik/cmd-screening-erkennt-untersuchungsbedarf"]},"mundoeffnung":{"name": "Maximale Mundöffnung", "was": "Eingeschränkte Mundöffnung, Diskusverlagerung ohne Reposition", "einheit": "positiv oder negativ", "kurz": "Schne
