extension und schiebt es nach dorsal. Positiv bei vermehrter Translation oder bekanntem plantarem Schmerz unter dem Mittelfußköpfchen.", "position": "Rückenlage", "quellen": ["Knight (Übersicht Plantarplatte) – https://www.physio-network.com/blog/plantar-plate-injury-assessment-and-management-by-nick-knight/"]},"papiertest":{"name": "Papier-Zieh-Test (Digital Purchase)", "was": "Läsion der Plantarplatte", "einheit": "positiv oder negativ", "kurz": "Papierstreifen unter der Zehe herausziehen, während der Patient festhält.", "ziel": "Bodenkontakt und Greifkraft der Zehe prüfen.", "norm": ["Positiv, wenn der Patient den Streifen nicht mit der Zehe halten kann.", "Keine Kennwerte gelesen (laut Knight-Übersicht keine Genauigkeitsdaten)."], "durch": "Stand. Ein schmaler Papierstreifen liegt unter der zu testenden Zehe. Der Patient drückt die Zehe auf den Boden, der Therapeut zieht am Papier. Positiv, wenn das Papier ohne Widerstand herausgleitet.", "position": "Stand", "quellen": ["Knight (Übersicht Plantarplatte) – https://www.physio-network.com/blog/plantar-plate-injury-assessment-and-management-by-nick-knight/"]}},cluster:[{id:"kern",name:"Kernset Neurologie",gilt:"Alle neurologischen Erkrankungen",hoch:["bbs","fga","abc","t10","t6","sts5"],empf:[],hinweis:"Leitlinie der amerikanischen Neurologie-Sektion für Erwachsene mit neurologischen Erkrankungen. Messung bei Aufnahme und Abschluss, bei Bedarf dazwischen. Wenn ein Test nicht möglich ist (zum Beispiel kein Gehen), 0 dokumentieren. Patientenziele zusätzlich festhalten (Goal Attainment Scale).",quellen:["Q99"]},{id:"schlaganfall",name:"Schlaganfall",gilt:"Schlaganfall, Hirnblutung, Hemiparese",hoch:["t10","t6","bbs","tug","dgi","fmal","fr","sis"],empf:["sts5","abc","fmao","arat","bbt","nhpt","ash","tis","mrs"],hinweis:"Die Einstufung gilt für die subakute und chronische Phase. In der Akutphase sind einige Tests anders eingestuft (zum Beispiel ist die Stroke Impact Scale dort nicht empfohlen).",quellen:["Q100"]},{id:"parkinson",name:"Parkinson",gilt:"Parkinson-Syndrom",hoch:["updrs","moca","t6","t10","mbest","fga","sts5","nhpt","pdq"],empf:["abc","fog","pfs","tug","t360"],hinweis:"Die Auswahl hängt in der Quelle vom Hoehn-und-Yahr-Stadium ab. Im Stadium V bleiben dort nur MDS-UPDRS, Fatigue-Skala, 360°-Drehtest, Selbstbericht zur Behinderung und PDQ. Die Gruppierung der Zusatztests war im Originaldokument schlecht lesbar, bitte dort gegenprüfen.",quellen:["Q101"]},{"id": "o_kiefer", "name": "Kiefer, orthopädische Tests", "gilt": "Erscheint, wenn die Region gewählt ist.", "region": "KIEFER", "ortho": true, "hoch": ["oeffnungsbahn", "mundoeffnung", "gelenkgeraeusche", "okklgeraeusche", "palpkaumuskel", "palpkiefergelenk"], "empf": [], "hinweis": "Erst Bewegung und Geräusche beobachten, weil das nicht provoziert, dann palpieren. Alles im Sitz; die HWS sollte bei CMD immer mit untersucht werden.", "quellen": [], "oquellen": ["Schiffman 2014 (DC/TMD) – https://pmc.ncbi.nlm.nih.gov/articles/PMC4884471", "CMD-Kurzbefund nach Ahlers/Jakstat (ZWP 2015) – https://www.zwp-online.info/fachgebiete/kieferorthopaedie/diagnostik/cmd-screening-erkennt-untersuchungsbedarf"], "gruppen": [{"id": "kiefer_bewegung", "name": "Bewegung und Geräusche (CMD-Kurzbefund)", "tests": ["oeffnungsbahn", "mundoeffnung", "gelenkgeraeusche", "okklgeraeusche"], "hinweis": "Zusammen mit Muskelpalpation und dem zahnärztlichen Befund Attrition/traumatische Exzentrik bilden diese Punkte den CMD-Kurzbefund: ab 2 von 6 positiven Befunden ist eine CMD wahrscheinlich und eine Funktionsanalyse angezeigt."}, {"id": "kiefer_schmerz", "name": "Schmerzprovokation (DC/TMD)", "tests": ["palpkaumuskel", "palpkiefergelenk"], "hinweis": "Bekannter Schmerz bei Muskelpalpation spricht für Myalgie, bei Gelenkpalpation für Arthralgie; beide zusammen sind häufig."}]},{"id": "o_hws", "name": "HWS, orthopädische Tests", "gilt": "Erscheint, wenn die Region gewählt ist.", "region": "HWS", "ortho": true, "hoch": ["gangbild", "hoffmann", "supinatorzeichen", "babinski", "sharppurser", "flexionrotation", "rotation60", "spurling", "distraktion", "ultt"], "empf": [], "hinweis": "Sicherheit zuerst: Myelopathiezeichen und obere zervikale Instabilität vor provozierenden Tests. Danach der Wainner-Cluster, vom Sitz (Rotation, Spurling) in die Rückenlage (Distraktion, ULTT). Den Flexions-Rotations-Test in der gleichen Rückenlage anschließen.", "quellen": [], "oquellen": ["Cook 2010 – https://www.physiotutors.com/wiki/cervical-myelopathy-cluster", "Wainner 2003 – https://www.physiotutors.com/wiki/cluster-of-wainner/", "Hutting 2013 – https://www.physiotutors.com/wiki/sharp-purser-test/", "Ogince 2007 – https://www.physiotutors.com/wiki/flexion-rotation-test/"], "gruppen": [{"id": "hws_myelopathie", "name": "Zervikale Myelopathie", "tests": ["gangbild", "hoffmann", "supinatorzeichen", "babinski"], "hinweis": "Cluster nach Cook 2010 mit Alter über 45 als fünftem Kriterium: ab 3 von 5 positiv LR+ 30,9 (Myelopathie wahrscheinlich, ärztlich abklären); höchstens 1 von 5 positiv LR- 0,18."}, {"id": "hws_obere", "name": "Obere HWS", "tests": ["sharppurser", "flexionrotation"], "hinweis": "Sharp-Purser vor jeder Mobilisation; bei positivem Befund keine weiteren Provokationstests. Flexions-Rotations-Test für zervikogenen Kopfschmerz."}, {"id": "hws_radikulopathie", "name": "Zervikale Radikulopathie (Wainner)", "tests": ["rotation60", "spurling", "distraktion", "ultt"], "hinweis": "3 von 4 positiv: LR+ 6,1; 4 von 4: LR+ 30,3 (Wainner 2003). Ein negativer ULTT A (Sens. 97 %) macht eine Radikulopathie unwahrscheinlich."}]},{"id": "o_bws", "name": "BWS, orthopädische Tests", "gilt": "Erscheint, wenn die Region gewählt ist.", "region": "BWS", "ortho": true, "hoch": ["faustperkussion", "rueckenlagezeichen", "slump", "ersterippe"], "empf": [], "hinweis": "Für die BWS gibt es kaum validierte orthopädische Tests. Zuerst die Red-Flag-Tests auf Wirbelkörperfraktur (bei Osteoporose, Kortison, Trauma), danach Neurodynamik und erste Rippe.", "quellen": [], "oquellen": ["Langdon 2010 – https://www.physio-pedia.com/Closed_Fist_Percussion_Sign", "Langdon 2010 – https://www.physiotutors.com/wiki/supine-sign/"], "gruppen": [{"id": "bws_fraktur", "name": "Fraktur-Screening", "tests": ["faustperkussion", "rueckenlagezeichen"], "hinweis": "Positive Befunde sind eine Red Flag: ärztliche Abklärung vor Behandlung (Langdon 2010)."}, {"id": "bws_neural_rippe", "name": "Neurodynamik und erste Rippe", "tests": ["slump", "ersterippe"], "hinweis": "Slump zeigt neurale Mechanosensibilität thorakal/lumbal; für den Test der ersten Rippe wurden keine Genauigkeitswerte gelesen."}]},{"id": "o_lws", "name": "LWS und ISG, orthopädische Tests", "gilt": "Erscheint, wenn die Region gewählt ist.", "region": "LWS", "ortho": true, "hoch": ["slump", "slr", "slrgekreuzt", "femoralisdehnung", "isgdistraktion", "thighthrust", "gaenslen", "isgkompression", "sakralthrust", "plet", "bauchlageinstab"], "empf": [], "hinweis": "Radikuläre Tests zuerst (Slump im Sitz, dann Rückenlage), dann ISG-Provokation nach Laslett von Rückenlage über Seitlage zur Bauchlage, zum Schluss Instabilitätstests in Bauchlage. So bleibt jeder Positionswechsel einmalig.", "quellen": [], "oquellen": ["Laslett 2005 – https://www.physiotutors.com/wiki/cluster-of-laslett/", "van der Windt 2010 (Cochrane) – https://www.physiotutors.com/wiki/crossed-straight-leg-raise-test/", "Kasai 2006, Ferrari 2014 – https://www.physiotutors.com/wiki/passive-lumbar-extension-test/"], "gruppen": [{"id": "lws_radikulaer", "name": "Lumbale Radikulopathie", "tests": ["slump", "slr", "slrgekreuzt", "femoralisdehnung"], "hinweis": "SLR ist sensitiv (zum Ausschließen), gekreuzter SLR spezifisch (zum Bestätigen); Femoralis-Dehnungstest für hohe Wurzeln L2-L4."}, {"id": "lws_isg", "name": "Iliosakralgelenk (Laslett)", "tests": ["isgdistraktion", "thighthrust", "gaenslen", "isgkompression", "sakralthrust"], "hinweis": "Ab 2 positiven der Tests Distraktion, Thigh Thrust, Kompression, Sacral Thrust: Sens. 88 %, Spez. 78 % (Laslett 2005). Sind Distraktion und Thigh Thrust negativ, die anderen nachprüfen; sind alle negativ, ist das ISG als Schmerzquelle unwahrscheinlich."}, {"id": "lws_instabilitaet", "name": "Lumbale Instabilität", "tests": ["plet", "bauchlageinstab"], "hinweis": "Passiver lumbaler Extensionstest hat die besseren Kennwerte; der Prone Instability Test hilft eher bei der Auswahl von Stabilisationsübungen."}]},{"id": "o_schulter", "name": "Schulter, orthopädische Tests", "gilt": "Erscheint, wenn die Region gewählt ist.", "region": "SCHULTER", "ortho": true, "hoch": ["painfularc", "hawkins", "neer", "infraspinatus", "droparm", "erlag", "liftoff", "belly", "crossbody", "obrien", "apprehension", "relocation", "surprise"], "empf": [], "hinweis": "Erst die wenig belastenden Tests im Sitz (Painful Arc, Kraft- und Lagtests, AC), dann Impingement-Provokation, zum Schluss die Instabilitätstests in Rückenlage, weil sie Angst und Schmerz auslösen können.", "quellen": [], "oquellen": ["Hegedus 2012 – https://upload.orthobullets.com/journalclub/free_pdf/22773322_BrJSportsMed-2012-Hegedus-bjsports-2012-091066.pdf", "Park 2005 (zit. in Hospitalist-Review) – https://community.the-hospitalist.org/index.php/content/which-history-and-physical-findings-are-most-useful-identifying-rotator-cuff-tears", "Chronopoulos 2004 – https://www.physiotutors.com/wiki/ac-joint-cluster/"], "gruppen": [{"id": "schulter_subakromial", "name": "Subakromialer Schmerz", "tests": ["painfularc", "hawkins", "neer"], "hinweis": "Einzeln schwach (LR+ jeweils unter 2,3 nach Hegedus 2012); Hawkins und Neer sind eher zum Ausschließen geeignet."}, {"id": "schulter_rm", "name": "Rotatorenmanschettenruptur", "tests": ["infraspinatus", "droparm", "erlag", "liftoff", "belly"], "hinweis": "Painful Arc, Drop Arm und Infraspinatus-Test alle positiv: LR+ 15,57 für komplette RM-Ruptur (Park 2005). ER-Lag-Sign: LR+ 28 für Infraspinatus-/Supraspinatusruptur (Castoldi, zit. in Hegedus 2012)."}, {"id": "schulter_ac", "name": "AC-Gelenk", "tests": ["crossbody", "obrien"], "hinweis": "Mit dem AC-Resisted-Extension-Test alle drei positiv: Spez. 97 %, Sens. nur 25 % (Chronopoulos 2004) - gut zum Bestätigen."}, {"id": "schulter_instabilitaet", "name": "Vordere Instabilität", "tests": ["apprehension", "relocation", "surprise"], "hinweis": "In einem Ablauf durchführen. Apprehension LR+ 17,2, Relocation LR+ 5,5, Surprise LR+ 5,4 (Hegedus 2012); die drei Tests mit dem besten Nutzen an der Schulter."}]},{"id": "o_ellenbogen", "name": "Ellenbogen, orthopädische Tests", "gilt": "Erscheint, wenn die Region gewählt ist.", "region": "ELLENBOGEN", "ortho": true, "hoch": ["ellbogenstreckung", "hooktest", "movingvalgus", "lateralpivot", "cozen", "mill", "maudsley", "medialepi", "ulnarisdruck", "ellbeugetest"], "empf": [], "hinweis": "Nach akutem Trauma zuerst den Extensionstest als Fraktur-Screening, danach die Sehnen- und Bandtests. Ohne Trauma mit den Epikondylus-Tests im Sitz beginnen und die Nerventests anschließen; der laterale Pivot-Shift als stärkste Provokation in Rückenlage zum Schluss.", "quellen": [], "oquellen": ["Appelboam 2008 – https://www.physiotutors.com/wiki/elbow-extension-test/", "O'Driscoll 2007, Devereaux 2013 – https://www.physiotutors.com/wiki/hook-test/", "O'Driscoll 2005 – https://www.physiotutors.com/wiki/moving-valgus-stress-test/", "Novak 1994 – https://www.physiotutors.com/wiki/pressure-provocation-test", "Soares 2023 – https://www.mdpi.com/1660-4601/20/3/1794"], "gruppen": [{"id": "ellenbogen_trauma", "name": "Trauma, Bänder und Sehnen", "tests": ["ellbogenstreckung", "hooktest", "movingvalgus", "lateralpivot"], "hinweis": "Volle Streckung macht eine Fraktur unwahrscheinlich (Sens. 96,8 %); Hook-Test für distale Bizepssehne, Moving-Valgus für das mediale Band."}, {"id": "ellenbogen_epikondylus", "name": "Epikondylopathie lateral und medial", "tests": ["cozen", "mill", "maudsley", "medialepi"], "hinweis": "Für diese Tests liegen kaum Genauigkeitsdaten vor; bekannter Schmerz am Epikondylus bei mehreren Tests stützt die Diagnose."}, {"id": "ellenbogen_ulnaris", "name": "Kubitaltunnel (N. ulnaris)", "tests": ["ulnarisdruck", "ellbeugetest"], "hinweis": "Der Druckprovokationstest hat die besten Daten (Novak 1994); Kombination mit Ellbogenflexion erhöht die Provokation."}]},{"id": "o_handgelenk", "name": "Handgelenk und Hand, orthopädische Tests", "gilt": "Erscheint, wenn die Region gewählt ist.", "region": "HANDGELENK", "ortho": true, "hoch": ["tabatiere", "tuberculumscaphoidei", "scaphoidkompression", "schuettelzeichen", "phalen", "tinelhandgelenk", "durkan", "whattest", "finkelstein", "foveazeichen", "watson"], "empf": [], "hinweis": "Nach Sturz zuerst Skaphoid-Palpation und Kompression, vor allen Belastungstests. Danach die neurologischen Tests für den Karpaltunnel und die Sehnen- und Instabilitätstests; alles im Sitz.", "quellen": [], "oquellen": ["Parvizi 1998, Chen 1989, Waeckerle 1987 (BestBETs) – https://www.bestbets.org/?p=5060", "Wainner 2005 – https://www.physiotutors.com/wiki/carpal-tunnel-syndrome-cluster/", "Valdes 2013 – https://www.physiotutors.com/wiki/phalens-test/", "Goubau 2014 – https://www.physiotutors.com/wiki/what-test/", "Tay 2007 – https://www.patientcareonline.com/view/ulnar-fovea-test-unlocks-tricky-wrist-pain-diagnosis", "Golubev 2023 – https://journals.rcsi.science/0869-8678/article/view/254209"], "gruppen": [{"id": "handgelenk_skaphoid", "name": "Skaphoidfraktur", "tests": ["tabatiere", "tuberculumscaphoidei", "scaphoidkompression"], "hinweis": "Alle drei negativ machen eine Skaphoidfraktur unwahrscheinlich; die Kombination erreichte Sens. 100 %, Spez. 74 % (Parvizi 1998)."}, {"id": "handgelenk_kts", "name": "Karpaltunnelsyndrom", "tests": ["schuettelzeichen", "phalen", "tinelhandgelenk", "durkan"], "hinweis": "Prädiktionsregel nach Wainner 2005 (Schüttelzeichen, Handgelenk-Index > 0,67, Symptom-Schweregrad > 1,9, verminderte Sensibilität Daumenkuppe, Alter > 45): 5 von 5 LR+ 18,3, 4 von 5 LR+ 4,6, weniger als 2 LR- 0,14."}, {"id": "handgelenk_radial", "name": "Radiales Handgelenk (de Quervain)", "tests": ["whattest", "finkelstein"], "hinweis": "WHAT-Test sehr sensitiv (99 %) zum Ausschließen; Finkelstein zur Bestätigung."}, {"id": "handgelenk_instabil", "name": "Ulnare und karpale Instabilität", "tests": ["foveazeichen", "watson"], "hinweis": "Foveazeichen für TFCC (Sens. 95 %, Spez. 87 %), Watson-Test für das skapholunäre Band; immer Seitenvergleich."}]},{"id": "o_finger", "name": "Finger, orthopädische Tests", "gilt": "Erscheint, wenn die Region gewählt ist.", "region": "FINGER", "ortho": true, "hoch": ["fdptest", "fdstest", "elson", "pipseitenband", "ucldaumen", "cmcgrind"], "empf": [], "hinweis": "Zu Fingertests gibt es kaum Genauigkeitsstudien; die Auswahl folgt der klinischen Praxis. Erst die Sehnenfunktion aktiv prüfen, dann Bänder und Gelenke unter Stress, weil diese Tests schmerzhafter sind.", "quellen": [], "oquellen": ["Model 2016 – https://www.physio-pedia.com/Thumb_CMC_Grind_Test", "ALiEM 2018 – https://www.aliem.com/elsons-test/"], "gruppen": [{"id": "finger_sehnen", "name": "Beuge- und Strecksehnen", "tests": ["fdptest", "fdstest", "elson"], "hinweis": "Ein negativer Test bei frischer Verletzung schließt eine Teilruptur nicht aus; bei Verdacht frühe Vorstellung beim Handchirurgen."}, {"id": "finger_gelenke", "name": "Bänder und Daumensattelgelenk", "tests": ["pipseitenband", "ucldaumen", "cmcgrind"], "hinweis": "Instabilität immer im Seitenvergleich werten; der Grind-Test ist spezifischer als sensitiv (Model 2016)."}]},{"id": "o_huefte", "name": "Hüfte, orthopädische Tests", "gilt": "Erscheint, wenn die Region gewählt ist.", "region": "HUEFTE", "ortho": true, "hoch": ["einbeinstand30", "trendelenburg", "fader", "hockschmerz", "hueftflexionaktiv", "irpassiv", "scour", "hueftextensionaktiv", "fadir", "faber", "thomas"], "empf": [], "hinweis": "Erst die Tests im Stand (Hocke, Einbeinstand, Trendelenburg), dann Rückenlage von wenig zu stark provozierend (aktive Flexion, Innenrotation, Scour, FADIR, FABER, FADER-R, Thomas), zuletzt aktive Extension in Bauchlage.", "quellen": [], "oquellen": ["Sutlive 2008 – https://www.physiotutors.com/wiki/cluster-of-sutlive/", "Reiman 2015 – https://bjsm.bmj.com/content/49/6/357.full", "Reiman 2015 – https://www.physiotutors.com/wiki/faddir-test/", "Lequesne 2008, Grimaldi 2017 – https://www.physiotutors.com/wiki/single-leg-stance-test/", "Grimaldi 2017 – https://www.physiotutors.com/wiki/fader-test/", "Schneider 2020 – https://www.physiotutors.com/wiki/patricks-test/"], "gruppen": [{"id": "huefte_lateral", "name": "Laterale Hüfte (gluteale Tendinopathie)", "tests": ["einbeinstand30", "trendelenburg", "fader"], "hinweis": "Einbeinstand 30 s ist der spezifischste Test; positive Tests stützen die Diagnose, negative schließen sie nicht aus (Grimaldi 2017)."}, {"id": "huefte_arthrose", "name": "Hüftarthrose (Sutlive)", "tests": ["hockschmerz", "hueftflexionaktiv", "irpassiv", "scour", "hueftextensionaktiv"], "hinweis": "3 von 5 positiv: LR+ 5,2; 4 von 5 positiv: LR+ 24,3 (95-%-KI 4,4-142,1; Sutlive 2008, noch nicht ausreichend validiert)."}, {"id": "huefte_leiste", "name": "Leiste: FAI, Labrum, Hüftbeuger", "tests": ["fadir", "faber", "thomas"], "hinweis": "Negativer FADIR macht FAI/Labrumläsion unwahrscheinlich, ein positiver beweist sie nicht (Reiman 2015). Thomas-Test ergänzt bei Verdacht auf verkürzte oder gereizte Hüftbeuger."}]},{"id": "o_knie", "name": "Knie, orthopädische Tests", "gilt": "Erscheint, wenn die Region gewählt ist.", "region": "KNIE", "ortho": true, "hoch": ["ottawaknie", "tanzendepatella", "thessaly", "gelenkspalt", "mcmurray", "valgusstress", "varusstress", "hinteresag", "hintereschublade", "lachman", "leversign", "schublade", "pivotshift"], "empf": [], "hinweis": "Nach Trauma zuerst Ottawa Knee Rules und Erguss. Thessaly im Stand, dann Rückenlage: Meniskus, Seitenbänder, hinteres Kreuzband vor dem vorderen (ein durchhängendes Schienbein täuscht sonst eine positive vordere Schublade vor), Pivot Shift als stärkste Provokation zuletzt.", "quellen": [], "oquellen": ["Bachmann 2004 – https://book.physiotutors.com/?p=125", "Smith 2015 – https://ebm.bmj.com/content/20/3/88", "van Eck 2013 – https://community.the-hospitalist.org/content/accuracy-physical-diagnostic-tests-assessing-ruptures-anterior-cruciate-ligament-meta", "Rubinstein 1994 – https://ebmconsult.com/articles/physical-exam-posterior-drawer-test", "Metaanalyse 2019 (zit. nach Physiotutors) – https://www.physiotutors.com/research/lever-sign-test-for-acl-tears/"], "gruppen": [{"id": "knie_trauma", "name": "Trauma-Screening und Erguss", "tests": ["ottawaknie", "tanzendepatella"], "hinweis": "Ottawa negativ schließt eine Fraktur praktisch aus (LR- 0,03; Bachmann 2004). Erguss kurz nach Trauma spricht für intraartikuläre Verletzung."}, {"id": "knie_meniskus", "name": "Meniskus", "tests": ["thessaly", "gelenkspalt", "mcmurray"], "hinweis": "Einzeln mäßig genau (Smith 2015); mehrere positive Tests plus passende Anamnese (Blockade, Verdrehtrauma) erhöhen die Wahrscheinlichkeit."}, {"id": "knie_seitenbaender_hkb", "name": "Seitenbänder und hinteres Kreuzband", "tests": ["valgusstress", "varusstress", "hinteresag", "hintereschublade"], "hinweis": "Aufklappbarkeit in 20-30° Beugung spricht für isolierte Seitenbandläsion, zusätzlich in Streckung für Kapsel- oder Kreuzbandbeteiligung. Sag Sign und hintere Schublade (Spez. 99 %, Rubinstein 1994) vor den VKB-Tests prüfen."}, {"id": "knie_vkb", "name": "Vorderes Kreuzband", "tests": ["lachman", "leversign", "schublade", "pivotshift"], "hinweis": "Lachman ist der beste Einzeltest; ein positiver Pivot Shift bestätigt nahezu sicher (Spez. 97-99 %), ist aber oft nur in Narkose auslösbar (van Eck 2013)."}]},{"id": "o_osg", "name": "Oberes Sprunggelenk, orthopädische Tests", "gilt": "Erscheint, wenn die Region gewählt ist.", "region": "OSG", "ortho": true, "hoch": ["ottawafuss", "lfapalpation", "schubladeosg", "squeeze", "kleiger", "raldt", "taluskippung"], "empf": [], "hinweis": "Nach Supinationstrauma zuerst Ottawa Ankle Rules, dann Palpation, dann Stabilitätstests. Die vordere Schublade ist 4-5 Tage nach dem Trauma aussagekräftiger als sofort. Syndesmosentests vor den Instabilitätstests, weil eine hohe Sprunggelenksverletzung längere Ausfallzeiten bedeutet.", "quellen": [], "oquellen": ["Bachmann 2003 – https://www.aafp.org/pubs/afp/issues/2003/0815/p745a.html", "van Dijk 1996 – https://boneandjoint.org.uk/Article/10.1302/0301-620X.78B6.0780958", "van Dijk 1996, Croy 2013 – https://www.physio-pedia.com/Anterior_Drawer_of_the_Ankle", "Sman 2013 – https://bjsm.bmj.com/content/47/10/620.abstract", "Sman 2013 – https://www.physiotutors.com/wiki/syndesmosis-squeeze-test/", "Übersicht chron. Instabilität (Li 2020, Jolman 2017) – https://aoj.amegroups.org/article/view/8912/html"], "gruppen": [{"id": "osg_akut", "name": "Akutes Supinationstrauma", "tests": ["ottawafuss", "lfapalpation", "schubladeosg"], "hinweis": "Ottawa negativ: Fraktur sehr unwahrscheinlich (Sens. 97,6 %). Druckschmerz LFTA, Hämatom und positive Schublade nach 4-5 Tagen: Sens. 96 %, Spez. 84 % für Bandruptur (van Dijk 1996)."}, {"id": "osg_syndesmose", "name": "Syndesmose", "tests": ["squeeze", "kleiger"], "hinweis": "Kein Einzeltest ist sicher (Sman 2013); bei Verdacht Bildgebung."}, {"id": "osg_chronisch", "name": "Chronische Instabilität", "tests": ["raldt", "taluskippung"], "hinweis": "Reverse anterolaterale Schublade hatte in einer Studie bessere Werte als die klassische Schublade (Li 2020); Talar Tilt für das Lig. calcaneofibulare."}]},{"id": "o_usg", "name": "Unteres Sprunggelenk, orthopädische Tests", "gilt": "Erscheint, wenn die Region gewählt ist.", "region": "USG", "ortho": true, "hoch": ["toomanytoes", "einbeinfersenstand", "jacktest", "colemanblock", "sinustarsi", "peronealsubluxation"], "empf": [], "hinweis": "Für das untere Sprunggelenk gibt es kaum validierte Tests; die Auswahl folgt der klinischen Praxis. Zuerst Beobachtung und Funktion im Stand (Rückfußstellung, Fersenstand, Gewölbe), danach Palpation und Sehnentests im Sitz.", "quellen": [], "oquellen": ["Ross 2021 (Reliabilität) – https://www.physio-network.com/?p=45243", "Lubcke 2019 (Review-Abstract) – https://apodc-2019.p.asnevents.com.au/days/2019-05-22/abstract/59729"], "gruppen": [{"id": "usg_tibpost", "name": "Tibialis posterior und Rückfußstellung", "tests": ["toomanytoes", "einbeinfersenstand"], "hinweis": "Fersenstand ist der am besten untersuchte Test (Ross 2021), Kennwerte zur Genauigkeit fehlen."}, {"id": "usg_flexibilitaet", "name": "Flexibilität des Rückfußes", "tests": ["jacktest", "colemanblock"], "hinweis": "Jack-Test für den Plattfuß, Coleman-Block für den Hohlfuß: unterscheiden flexible von rigiden Fehlstellungen."}, {"id": "usg_lateral", "name": "Lateraler Rückfuß", "tests": ["sinustarsi", "peronealsubluxation"], "hinweis": "Für beide Tests wurden keine Genauigkeitsdaten gefunden; Befund im Seitenvergleich werten."}]},{"id": "o_fuss", "name": "Fuß, orthopädische Tests", "gilt": "Erscheint, wenn die Region gewählt ist.", "region": "FUSS", "ortho": true, "hoch": ["windlass", "fersenpalpation", "dorsalextevers", "tineltarsal", "thompson", "matles", "achillesdelle", "achillespalpation", "arcsign", "royallondon"], "empf": [], "hinweis": "Zuerst der Windlass-Test im Stand, dann Rückenlage/Seitlage für Ferse und Tarsaltunnel, zum Schluss die Achillessehnentests in Bauchlage. Bei akutem Achillestrauma die Rupturtests vorziehen.", "quellen": [], "oquellen": ["De Garceau 2003 – https://www.physiotutors.com/wiki/windlass-test/", "Kinoshita 2001 – https://www.physiotutors.com/wiki/dorsiflexion-eversion-test/", "Reiman 2014 – https://nata.kglmeridian.com/view/journals/attr/49/6/article-p820.xml"], "gruppen": [{"id": "fuss_plantarfaszie", "name": "Plantarfaszie", "tests": ["windlass", "fersenpalpation"], "hinweis": "Windlass positiv bestätigt gut (Spez. 100 %), negativ schließt nicht aus (Sens. 32 %); Diagnose stützt sich vor allem auf Palpation und Anamnese."}, {"id": "fuss_tarsaltunnel", "name": "Tarsaltunnel", "tests": ["dorsalextevers", "tineltarsal"], "hinweis": "Dorsalextensions-Eversions-Test nur in einer Studie untersucht (Kinoshita 2001), daher vorsichtig lesen."}, {"id": "fuss_achillesruptur", "name": "Achillessehnenruptur", "tests": ["thompson", "matles", "achillesdelle"], "hinweis": "Thompson positiv: LR+ 13,7; negativ: LR- 0,04 (Reiman 2014). Mehrere positive Tests machen die Ruptur sehr wahrscheinlich."}, {"id": "fuss_achillestendinopathie", "name": "Achillestendinopathie", "tests": ["achillespalpation", "arcsign", "royallondon"], "hinweis": "Einzeln nur mäßig genau; nicht als alleiniges Kriterium verwenden (Reiman 2014)."}]},{"id": "o_zehen", "name": "Zehen, orthopädische Tests", "gilt": "Erscheint, wenn die Region gewählt ist.", "region": "ZEHEN", "ortho": true, "hoch": ["papiertest", "plantarplatte", "fingerkompression", "mulder"], "empf": [], "hinweis": "Für die Zehen gibt es nur wenige und kleine Studien. Erst der Papiertest im Stand, dann in Rückenlage Plantarplatte und Interdigitalraum; der Mulder-Klick als unangenehmster Test zuletzt.", "quellen": [], "oquellen": ["Pitcher 2024 – https://uhra.herts.ac.uk/id/eprint/9649/1/pitcher-et-al-2024-diagnostic-accuracy-of-subjective-features-and-physical-examination-tests-for-morton-neuroma-a.pdf", "Knight (Übersicht Plantarplatte) – https://www.physio-network.com/blog/plantar-plate-injury-assessment-and-management-by-nick-knight/"], "gruppen": [{"id": "zehen_plantarplatte", "name": "Plantarplatte (Kleinzehengrundgelenke)", "tests": ["papiertest", "plantarplatte"], "hinweis": "Der vertikale Stresstest ist der aussagekräftigste klinische Test; Kennwerte stammen aus einer Einzelstudie."}, {"id": "zehen_morton", "name": "Morton-Neurom", "tests": ["fingerkompression", "mulder"], "hinweis": "Negative Daumen-Zeigefinger-Kompression spricht gegen ein Neurom (LR- 0,04); Mulder-Klick allein ist schwach (Pitch
