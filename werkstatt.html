<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Therapiebericht-Werkstatt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>@font-face{font-family:"Outfit";font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/outfit-latin-wght-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-display:swap;font-weight:500;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}</style>
<style>
/* Farben nach W&W Therapiezeit (ww-therapiezeit.de): Anthrazit 1A1A1A, Karten 212121, Lindgrün DDF6A2 als Akzent, Schrift Outfit.
   Layout: links Kacheln je Abschnitt des Berichts, rechts das Formular als Live-Vorschau; am Handy umschaltbar über eine schwebende Leiste */

:root{
  --bg:#1a1a1a; --surface:#212121; --surface2:#2a2a2a; --line:#3a3a3a;
  --fg:#f3f6ec; --muted:#a3a99a; --red:#ddf6a2; --red-dk:#c8e48a; --on-acc:#1a1a1a; --ok:#3ccb6b;
  --paper:#ffffff;
  --display:"Outfit",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --body:"Outfit",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --r:20px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:1380px;margin:0 auto;padding-block:18px 120px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-family:var(--display);font-weight:800;color:var(--red);letter-spacing:.06em;font-size:13px;text-transform:uppercase;}
h1{font-family:var(--display);font-weight:900;font-size:clamp(30px,5vw,46px);line-height:.95;margin:6px 0 0;text-transform:uppercase;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--red)}
.topctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.tabs{display:inline-flex;gap:22px;border-bottom:1px solid var(--line);padding-bottom:0}
.tabs button{background:none;border:0;padding:8px 0 10px;font-weight:700;color:var(--muted);position:relative}
.tabs button[aria-pressed="true"]{color:var(--fg)}
.tabs button[aria-pressed="true"]::after{content:"";position:absolute;left:20%;right:20%;bottom:-1px;height:3px;border-radius:3px;background:var(--red)}

.pill{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;white-space:nowrap}
.pill:hover{border-color:#5a5a60}
.btn{border:0;border-radius:999px;background:var(--red);color:var(--on-acc);font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:13px 22px;font-size:13px}
.btn:hover{background:var(--red-dk)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.ghost:hover{background:#2f2f33}
.btn[disabled]{opacity:.45;cursor:default}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:26px;align-items:start}
.left{min-width:0;display:grid;gap:12px}
.right{min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}

/* Kacheln */
.tile{background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid transparent;transition:border-color .2s}
.tile.open{border-color:#3a3a3f}
.tile>.head{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 18px;background:none;border:0;text-align:left}
.badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface2);color:var(--muted)}
.tile.done .badge{background:var(--red);color:var(--on-acc)}
.tt{min-width:0}
.tt b{display:block;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:15px}
.tt small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:12px;height:12px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);margin-right:6px;transition:transform .2s}
.tile.open .chev{transform:rotate(225deg)}
.body{padding:0 18px 18px;display:grid;gap:14px}
.body[hidden]{display:none}

label.l{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.field{display:grid;gap:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.in{width:100%;background:#0b0b0c;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;outline:none}
.in:focus{border-color:#6a6a70}
/* iOS: Datumsfelder haben sonst eine feste Eigenbreite und laufen über die Spalte hinaus */
.field,.row2>*{min-width:0}
input.in[type="date"]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;min-height:50px;text-align:left;line-height:1.3}
input.in[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0}
input.in[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.8)}
textarea.in{resize:vertical;min-height:70px;line-height:1.4}
.search{position:relative}
.search .in{border-radius:999px;padding-right:58px;background:#000}
.search .go{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:var(--red);border:0;display:grid;place-items:center}
.search .go svg{width:20px;height:20px}
.hits{display:grid;gap:4px;max-height:280px;overflow:auto}
.hit{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline;text-align:left;background:var(--surface2);border:0;border-radius:12px;padding:10px 12px}
.hit code{font-family:"IBM Plex Sans",monospace;font-weight:500;color:var(--red);font-size:13px;min-width:54px}
.hit span{font-size:14px}
.hit em{font-style:normal;color:var(--muted);font-size:12px;display:block}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;text-align:left}
.chip:hover{border-color:#66666c}
.chip.learn{border-color:var(--red)}
.chip.learn::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:7px;vertical-align:1px}
.chiphead{font-size:12px;color:var(--muted);font-weight:600;margin:2px 0 6px}
.chiphead b{color:var(--fg)}

.items{display:grid;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start}
.item textarea{min-height:46px;height:46px;resize:none;overflow:hidden}
.x{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface2);color:var(--muted);font-size:18px;line-height:1}
.x:hover{color:var(--fg)}
.add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}

.dg{display:grid;gap:8px}
.dgi{background:var(--surface2);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.dgi .nm{min-width:0}
.dgi .nm b{font-family:"IBM Plex Sans",monospace;font-weight:500;color:var(--red);margin-right:8px}
.mini{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.mini button{border:1.5px solid var(--line);background:none;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700;color:var(--muted)}
.mini button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:#000}

.seg{justify-self:start;display:inline-flex;background:#000;border-radius:999px;padding:4px;gap:4px;border:1.5px solid var(--line)}
.seg button{border:0;background:none;border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--red);color:var(--on-acc)}

.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ck{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;border:1.5px solid transparent;text-align:left}
.ck i{width:20px;height:20px;border-radius:6px;border:2px solid #6a6a70;flex:none;display:grid;place-items:center;font-style:normal;font-size:13px}
.ck[aria-pressed="true"]{border-color:var(--red)}
.ck[aria-pressed="true"] i{background:var(--red);border-color:var(--red)}
.ck[aria-pressed="true"] i::after{content:"✓";color:var(--on-acc);font-weight:800}
.note{font-size:12.5px;color:var(--muted)}
.note b{color:var(--fg)}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.sw{width:46px;height:28px;border-radius:999px;background:var(--surface2);border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#bbb;transition:transform .2s}
.sw[aria-pressed="true"]{background:var(--red)}
.sw[aria-pressed="true"]::after{transform:translateX(18px);background:var(--on-acc)}

/* Fließtext */
.ft-haken{justify-self:start;width:auto;margin:2px 0 4px;cursor:pointer}
.ft-box{background:var(--surface2);border-radius:14px;padding:10px 14px;border-left:3px solid var(--red)}
.ft-box small{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.ft-box p{margin:4px 0 0;font-size:15px;line-height:1.45}
/* Vorschau */
.pv{background:var(--surface);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.pvhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pvhead h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:15px;letter-spacing:.04em;margin:0}
.paper{background:var(--paper);border-radius:6px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.55);aspect-ratio:1655/2340;max-width:100%}
.paper canvas{width:100%;height:100%;display:block}
.warn{display:flex;flex-wrap:wrap;gap:6px}
.warn span{font-size:12px;font-weight:600;background:#3a2a10;color:#ffcf7a;border-radius:999px;padding:4px 10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1 1 140px;white-space:nowrap;padding-inline:14px}
.toast{min-height:18px;font-size:13px;color:var(--muted)}

/* Handy: schwebende Leiste */
.dock{display:none}
@media (max-width:899px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .right{position:static}
  body[data-view="eingabe"] .right{display:none}
  body[data-view="vorschau"] .left{display:none}
  .dock{display:flex;position:fixed;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
    bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:20;background:rgba(28,28,30,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid #333;border-radius:999px;padding:6px;justify-content:space-around;align-items:center}
  .dock button{background:none;border:0;color:var(--muted);font-weight:700;font-size:12px;display:grid;justify-items:center;gap:2px;padding:6px 14px;border-radius:999px}
  .dock button[aria-pressed="true"]{color:var(--fg)}
  .dock .mid{width:58px;height:58px;border-radius:50%;background:var(--red);color:var(--on-acc);margin-top:-22px;box-shadow:0 8px 22px rgba(221,246,162,.3);display:grid;place-items:center;padding:0}
  .dock svg{width:22px;height:22px}
}
@media (max-width:480px){.row2,.checks{grid-template-columns:1fr}}
/* ---------- Bericht diktieren ---------- */
.lspalte{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-content:start}
.paper{position:relative}
.dkbtn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--fg);color:var(--bg);padding:10px 16px;font-weight:800;font-size:13px;white-space:nowrap}
.dkbtn svg{width:16px;height:16px}
.dk{grid-template-columns:minmax(0,1fr);background:#2a2a2a;border:1px solid #3a3a3a;color:#f3f6ec;border-radius:22px;padding:18px;display:grid;gap:12px;min-width:0;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 10px)}
html[data-theme="light"] .dk{background:#1a1a1a;border-color:#1a1a1a}
.dk-k{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#ddf6a2}
.dk-x{width:30px;height:30px;border-radius:50%;border:0;background:#333;color:#f3f6ec;font-size:17px;line-height:1;display:grid;place-items:center}
.dk-pills{display:flex;gap:6px;flex-wrap:wrap}
.dk-pills button{border:0;font-size:12px;font-weight:700;border-radius:999px;padding:6px 11px;background:#333;color:#a3a99a;white-space:nowrap}
.dk-pills button.ok{background:#33401a;color:#ddf6a2}.dk-pills button.jetzt{background:#fff;color:#1a1a1a}
.dk-q{font-family:var(--display);font-weight:800;font-size:clamp(19px,2.6vw,23px);line-height:1.15;text-wrap:balance}
.dk-hint{font-size:13px;color:#a3a99a;margin-top:-6px}
.dk-ta{width:100%;background:#1f1f1f;border:1.5px solid #3a3a3a;border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.45;color:#f3f6ec;resize:vertical;min-height:84px;outline:none}
html[data-theme="light"] .dk-ta{background:#262626}
.dk-ta:focus{border-color:#ddf6a2}
.dk-ta::placeholder{color:#7d8274}
.dk-zw{font-size:14px;color:#a3a99a;font-style:italic;min-height:0}
.dk-zw:empty{display:none}
.dk-bisher{font-size:13px;color:#a3a99a;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.dk-bisher button{border:0;background:none;color:#ddf6a2;font-weight:700;padding:0;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.dk-chips{min-width:0;display:flex;gap:6px;flex-wrap:wrap}
.dk-chips button{border:1.5px solid #3a3a3a;background:transparent;color:#f3f6ec;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;text-align:left}
.dk-chips button::before{content:"+ ";color:#ddf6a2}
.dk-f{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dk-mic{width:58px;height:58px;border-radius:50%;border:0;background:#ddf6a2;color:#1a1a1a;display:grid;place-items:center;flex:none;box-shadow:0 0 0 7px rgba(221,246,162,.18)}
.dk-mic svg{width:26px;height:26px}
.dk-mic i{display:none;width:18px;height:18px;border-radius:5px;background:#fff}
.dk-mic.an{background:#e5484d;box-shadow:0 0 0 7px rgba(229,72,77,.22)}
.dk-mic.an svg{display:none}.dk-mic.an i{display:block}
.dk-mic[disabled]{opacity:.5}
.dk-wave{display:inline-flex;gap:3px;align-items:center;height:24px}
.dk-wave i{display:block;width:3px;height:4px;border-radius:2px;background:#ddf6a2;transition:height .08s}
.dk-st{font-size:13px;color:#a3a99a;min-width:0;flex:1 1 120px}
.dk-st.fehler{color:#ffb3b5}
.dk-b{border:0;border-radius:999px;padding:11px 18px;font-weight:800;font-size:14px;white-space:nowrap}
.dk-b.g{background:#333;color:#f3f6ec}.dk-b.a{background:#ddf6a2;color:#1a1a1a}
.dk-b[disabled]{opacity:.4}
.dk-vorher{display:flex;align-items:baseline;gap:10px;border-top:1px solid #3a3a3a;padding-top:10px;font-size:13px;color:#a3a99a}
.dk-vorher b{color:#ddf6a2}.dk-vorher span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk-vorher button{margin-left:auto;border:0;background:none;color:#f3f6ec;font-weight:700;font-size:13px;padding:0;flex:none}
.dkmark{position:absolute;border-radius:6px;background:rgba(221,246,162,.32);box-shadow:0 0 0 3px #b9dc5c,0 0 0 9px rgba(221,246,162,.5);pointer-events:none;transition:all .25s}
.dkmark b{position:absolute;right:-2px;top:-24px;background:#1a1a1a;color:#ddf6a2;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap}
@media (max-width:899px){body[data-view="vorschau"] .lspalte{display:none}}
@media (max-width:480px){.dk{padding:16px}.dk-wave{display:none}.dk-st{order:9;flex-basis:100%}.dk-f .dk-b.g{margin-left:auto}.dk-b{padding:11px 15px}}

</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">W&amp;W Therapiezeit · Doku-Fix</div>
      <h1>Therapie<span>bericht</span></h1>
    </div>
    <div class="topctl">
      <button class="dkbtn" id="dk-start" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>Bericht diktieren</button>
      <div class="tabs" role="group" aria-label="Schrift">
        <button id="m-hand" aria-pressed="true">Handschrift</button>
        <button id="m-klar" aria-pressed="false">Klartext</button>
      </div>
    </div>
  </header>
  <div class="vorl" id="vorl" hidden>
    <b>W&amp;W-Vorlage fehlt</b>
    <p>Lade einmal die Datei „Therapiebericht-Vorlage“. Formular und Handschrift bleiben nur auf diesem Gerät und stehen nicht im öffentlichen Code.</p>
    <label class="vorl-knopf">Vorlage laden<input type="file" id="vorl-datei" accept=".json,application/json" hidden></label>
  </div>

  <div class="grid">
    <div class="lspalte"><section class="dk" id="dk" aria-label="Bericht diktieren" hidden></section><section class="left" id="tiles" aria-label="Abschnitte des Berichts"></section></div>

      <div class="pv">

          <h2>Vorschau</h2>
          <div class="acts" style="flex:0 0 auto">
            <button class="pill" id="reroll" title="Gleicher Text, neue Handschrift">Neu schreiben</button>
            <button class="pill" id="neu">Neuer Bericht</button>
          </div>
        </div>
        <div class="paper"><canvas id="cv" width="2482" height="3510" aria-label="Therapiebericht als Vorschau"></canvas></div>
        <div class="warn" id="warn"></div>
        <div class="acts">
          <button class="btn" id="dl-jpg">Als JPEG sichern</button>
          <button class="btn ghost" id="dl-pdf">Als PDF sichern</button>
        </div>
        <div class="toast" id="toast" role="status"></div>
      </div>
    </section>
  </div>
</div>

<nav class="dock" aria-label="Ansicht">
  <button id="v-eingabe" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Abschnitte</button>
  <button class="mid" id="v-save" aria-label="Als JPEG sichern"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
  <button id="v-vorschau" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l4 4v16H6z"/><path d="M15 2v4h4M9 12h7M9 16h7"/></svg>Vorschau</button>
</nav>

<script src="jspdf.umd.min.js"></script>
<script>
/* Doku-Fix · Diktieren
   Teile, die im Browser und zum Testen in Node laufen:
   - segmente(): Aufnahme an Sprechpausen in Stücke ≤ 25 s schneiden (Whisper verliert sonst Text)
   - koelner(): Kölner Phonetik, deutsche Lautähnlichkeit
   - korrigieren(): Text mit Wörterbuch und Fachwortliste glätten
   - lernen(): aus Brunos Korrektur neue Wörterbuch-Paare vorschlagen */
(function (root) {
  'use strict';

  /* ---------- Aufnahme in Stücke schneiden ---------- */
